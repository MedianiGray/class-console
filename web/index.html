<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班级材料操作台 · 浏览器本地版 v0.15.0</title>
<style>
  :root{
    color-scheme:light;
    --bg:#F1F4F9; --content:#F1F4F9; --sidebar:#FBFCFE; --card:#FFFFFF; --card-soft:#F6F8FC;
    --line:#E3E8F0; --line-strong:#CBD4E1;
    --text:#151C28; --muted:#5F6B7B; --sub:#8B96A6; --bg-soft:#F5F7FB;
    --primary:#4F63EE; --primary-hover:#3D50D8; --primary-soft:#EDF0FE;
    --green:#128B4C; --orange:#C87A08; --red:#D23235; --zebra:#FAFBFD;
    --th-bg:#F7F9FC; --row-hover:#F2F5FA; --tag-green:#E8F6EE; --tag-orange:#FDF2E1;
    --tag-red:#FDEDED; --tag-muted:#F0F2F6; --danger-line:#EFBABA; --danger-bg:#FDF0F0;
    --bulk-line:#D5DDFA; --row-removed:#F9FAFC; --scroll:#C3CEDB;
    --radius:10px; --radius-sm:7px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 1px rgba(16,24,40,.02);
    --shadow-lg:0 10px 34px rgba(16,24,40,.14);
    --fs-xs:12px; --fs-sm:12.5px; --fs-base:13.5px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px;
  }
  /* 深色主题：同一套 token 换值，组件样式不改 */
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0F1115; --content:#101318; --sidebar:#12151B; --card:#171A22; --card-soft:#1C2029;
    --line:#252A34; --line-strong:#363D4A;
    --text:#E8ECF4; --muted:#9AA4B4; --sub:#6C7685; --bg-soft:#1D222B;
    --primary:#7D93FF; --primary-hover:#93A7FF; --primary-soft:#232B46;
    --green:#4CBE86; --orange:#DFA24B; --red:#EF6E6E; --zebra:#1B1F27;
    --th-bg:#1A1E26; --row-hover:#202530; --tag-green:#16332A; --tag-orange:#332A19;
    --tag-red:#392326; --tag-muted:#222833; --danger-line:#482B2E; --danger-bg:#2C2022;
    --bulk-line:#2B3450; --row-removed:#181B21; --scroll:#3A4049;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --shadow-lg:0 12px 38px rgba(0,0,0,.52);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-size:var(--fs-base); line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;font-size:14px;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(61,91,221,.14)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  html{background:var(--bg)}
  .app{display:flex;min-height:100vh}

  /* 侧边栏 */
  .sidebar{width:232px;background:var(--card);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:var(--primary-soft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--primary)}
  .brand .logo svg{width:18px;height:18px}
  .brand .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .brand h1{font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.2}
  .brand p{font-size:var(--fs-xs);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .collapse-btn{flex-shrink:0;width:28px;height:28px;border:0;background:transparent;border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;margin-left:auto}
  .collapse-btn:hover{background:var(--bg-soft);color:var(--text)}
  .collapse-btn svg{width:16px;height:16px}
  /* 折叠为纯图标栏 */
  .sidebar.collapsed{width:64px}
  .sidebar.collapsed .brand{padding:18px 10px 14px;flex-wrap:wrap;justify-content:center;gap:10px}
  .sidebar.collapsed .brand .bt{display:none}
  .sidebar.collapsed .brand .collapse-btn{margin-left:0}
  .sidebar.collapsed .nav{padding:4px 10px}
  .sidebar.collapsed .nav button{justify-content:center;gap:0;padding:9px 0}
  .sidebar.collapsed .nav button .txt{display:none}
  .sidebar.collapsed .nav-group-label{display:none}
  .sidebar.collapsed .side-bottom{padding:14px 10px}
  .sidebar.collapsed .identity{justify-content:center;padding:2px 0 10px}
  .sidebar.collapsed .identity .id-t{display:none}
  .sidebar.collapsed .role-select{display:none}
  .nav{display:flex;flex-direction:column;padding:4px 12px;gap:2px}
  .nav button{position:relative;display:flex;align-items:center;gap:11px;border:0;background:transparent;
    color:var(--muted);padding:9px 12px;border-radius:var(--radius-sm);text-align:left;min-height:40px;font-size:14px;
    transition:background .15s,color .15s}
  .nav button .ico{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .nav button .ico svg{width:16px;height:16px}
  .nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .nav button:hover:not(.active){background:var(--bg-soft);color:var(--text)}
  .side-bottom{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line)}
  .identity{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}
  .identity .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
  .identity .id-t{display:flex;flex-direction:column;gap:1px;min-width:0}
  .identity .id-name{font-size:13px;font-weight:600;line-height:1.2}
  .identity .id-role{font-size:var(--fs-xs);color:var(--sub)}
  .topbar-right{display:flex;align-items:center;gap:10px}

  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:0 32px;height:56px;background:var(--card);border-bottom:1px solid var(--line)}
  .topbar h2{font-size:16px;font-weight:600;letter-spacing:-.005em}
  .topbar .summary{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
  .content{flex:1;padding:20px 32px 24px;min-width:0}
  .view{display:none}
  .view.active{display:block}
  .statusbar{display:flex;justify-content:space-between;gap:16px;padding:9px 32px;
    background:var(--card);border-top:1px solid var(--line);color:var(--sub);font-size:var(--fs-xs)}

  /* 卡片与通用：单平面，靠发丝线与留白分层，不压阴影 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px 16px}
  .empty .empty-title{font-size:15px;color:var(--text);margin-bottom:4px;font-weight:600}
  .empty .empty-sub{font-size:13px;margin-bottom:12px}
  .btn{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--radius-sm);
    padding:0 15px;min-height:36px;font-size:13.5px;font-weight:500;color:var(--text);
    transition:background .15s,border-color .15s,box-shadow .15s}
  .btn:hover{background:var(--bg-soft);border-color:var(--sub)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
  .btn.danger{background:var(--card);border-color:var(--danger-line);color:var(--red)}
  .btn.danger:hover{background:var(--danger-bg)}
  .btn.mini{min-height:30px;padding:4px 11px;font-size:12.5px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0}
  .toolbar label{font-size:var(--fs-sm);color:var(--muted)}
  .toolbar input[type=search],.toolbar select{
    border:1px solid transparent;border-radius:var(--radius-sm);padding:8px 12px;background:var(--bg-soft);
    min-height:36px;font-size:13.5px;color:var(--text);transition:border-color .15s,background .15s,box-shadow .15s}
  .toolbar input[type=search]:hover,.toolbar select:hover{border-color:var(--line-strong)}
  .toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(61,91,221,.14);outline:none}
  .toolbar input[type=search]{width:210px}
  .toolbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .actions{display:flex;gap:10px;align-items:center;padding:12px 0}
  .actions .spacer{margin-left:auto}
  .hint{font-size:var(--fs-sm);color:var(--muted)}

  /* 文件夹收集 */
  .collect-head{margin-bottom:14px}
  .collect-head.panel{padding:18px 20px}
  .collect-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .collect-toolbar label{font-size:var(--fs-sm);color:var(--muted)}
  .collect-toolbar select{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;background:var(--card);min-height:36px;font-size:13.5px;color:var(--text)}
  .watch-toggle{display:flex;align-items:center;gap:6px;cursor:pointer}
  .watch-toggle input{accent-color:var(--primary)}
  .collect-status{font-size:13px;color:var(--text);margin-top:12px}
  .collect-note{margin-top:6px;line-height:1.6}
  .file-cell{font-weight:500}
  .row-removed .file-cell{color:var(--sub)}
  .row-removed{background:var(--row-removed)}

  /* 筛选条件标签 */
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 12px;min-height:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:0;
    background:var(--bg-soft);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--text)}
  .chip b{font-weight:600}
  .chip button{border:0;background:transparent;color:var(--muted);font-size:14px;line-height:1;
    padding:0 2px;cursor:pointer}
  .chip button:hover{color:var(--red)}
  .chip-clear{border:0;background:transparent;color:var(--primary);font-size:12.5px;cursor:pointer;padding:4px 6px}
  .chip-clear:hover{text-decoration:underline}

  /* 看板 */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 18px}
  .dash-cards{grid-template-columns:repeat(4,1fr)}
  .stat-card{display:flex;align-items:baseline;gap:10px;padding:16px 18px;cursor:default;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .stat-card .num{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text)}
  .stat-card .lbl{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
  .stat-card .lbl .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

  /* 首屏 KPI：一条指标带，上下发丝线，不铺白盒 */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 18px;
    background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    border-radius:0;overflow:hidden}
  .kpi{padding:15px 18px;cursor:pointer;display:flex;flex-direction:column;gap:5px;
    border-right:1px solid var(--line);transition:background .15s}
  .kpi:last-child{border-right:0}
  .kpi:hover{background:var(--bg-soft)}
  .kpi .lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .kpi .lbl .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
  .kpi .num{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text)}
  .aux-line{display:flex;flex-wrap:wrap;align-items:center;gap:18px;font-size:12.5px;color:var(--muted);margin:0 0 16px}
  .aux-line a{color:var(--primary);cursor:pointer;text-decoration:none}
  .aux-line a:hover{text-decoration:underline}

  /* 首屏主张：页头带式，不套卡片 */
  .hero{background:transparent;border:0;border-radius:0;box-shadow:none;
    padding:2px 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line)}
  .hero h2{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.32;margin-bottom:6px}
  .hero p{font-size:13.5px;color:var(--muted);max-width:660px;line-height:1.65}
  .sell-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .sell{background:var(--bg-soft);border-radius:var(--radius-sm);padding:14px 15px}
  .sell .sell-ico{width:30px;height:30px;border-radius:8px;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;margin-bottom:9px}
  .sell .sell-ico svg{width:16px;height:16px}
  .sell .sell-t{font-size:13.5px;font-weight:600;margin-bottom:3px}
  .sell .sell-d{font-size:12.5px;color:var(--muted);line-height:1.55}

  /* 空态上手步骤 */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;
    display:flex;flex-direction:column;gap:8px}
  .step .step-no{width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .step .step-t{font-size:14px;font-weight:600}
  .step .step-d{font-size:12.5px;color:var(--muted);line-height:1.55;flex:1}
  .step .step-go{border:0;background:transparent;color:var(--primary);font-size:13px;font-weight:500;
    padding:0;cursor:pointer;text-align:left}
  .step .step-go:hover{text-decoration:underline}

  /* 导航分组 */
  .nav-group-label{font-size:11px;color:var(--sub);letter-spacing:.05em;font-weight:600;
    padding:14px 12px 5px}
  .nav-group-label:first-child{padding-top:6px}
  .nav button.nav-aux{color:var(--sub);font-size:13px}
  .nav button.nav-aux .ico{opacity:.65}
  .nav button.nav-aux:hover:not(.active){color:var(--text)}

  /* 首屏下一步行动条：全页唯一强调带 */
  .action-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--primary-soft);border:0;border-radius:var(--radius);
    padding:15px 18px;margin:0 0 18px}
  .action-bar .ab-k{font-size:11.5px;font-weight:600;color:var(--primary);letter-spacing:.04em;margin-bottom:2px}
  .action-bar .ab-t{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.01em}
  .action-bar .ab-d{font-size:12.5px;color:var(--muted);margin-top:3px}
  .action-bar .btn{flex-shrink:0}

  /* 常驻卖点标签 */
  .sell-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .sell-tags span{font-size:12px;color:var(--muted);background:var(--bg-soft);
    border:1px solid var(--line);border-radius:999px;padding:4px 11px}

  /* 岗位下拉 */
  .role-select{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg-soft);
    min-height:34px;padding:0 10px;font-size:13px;color:var(--text);margin-top:10px}
  /* 申请人学号：只在申请人视角显示，用于只看本人材料 */
  .applicant-id{display:none;margin-top:8px}
  .applicant-id label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .applicant-id input{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--bg-soft);min-height:34px;padding:0 10px;font-size:13px;color:var(--text)}

  /* 次级弱按钮 */
  .btn.subtle{background:var(--bg-soft);border-color:var(--line);color:var(--muted)}
  .btn.subtle:hover{background:var(--line);color:var(--text);border-color:var(--line-strong)}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{padding:20px}
  .panel h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .cat-row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .cat-row .name{width:78px;font-size:13px;flex-shrink:0}
  .cat-row .track{flex:1;min-width:0;height:8px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
  .cat-row .fill{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:6px}
  .cat-row .cnt{width:26px;text-align:right;font-size:13px;color:var(--muted)}
  .panel + .panel{margin-top:14px}

  /* 表格 */
  .table-wrap{overflow:auto;border:0;border-radius:var(--radius);background:var(--card)}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:var(--fs-base);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:var(--fs-xs);background:transparent;
    border-bottom:1px solid var(--line-strong);letter-spacing:.01em}
  tbody tr:hover{background:var(--row-hover)}
  tbody tr.sel{background:var(--primary-soft)}
  tbody tr.clickable{cursor:pointer}
  .num-col{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  /* 首列冻结：复选框列 + 材料名称列横滑固定 */
  .sticky-l0{position:sticky;left:0;z-index:2;background:var(--card)}
  th.sticky-l0,td.sticky-l0{padding-left:10px;padding-right:2px}
  .sticky-l1{position:sticky;left:36px;z-index:2;background:var(--card)}
  thead .sticky-l0,thead .sticky-l1{background:var(--card)}
  /* 表头吸顶：长列表下滑时列名与排序指示始终可见 */
  .table-wrap thead th{position:sticky;top:0;z-index:3;background:var(--th-bg)}
  .table-wrap thead .sticky-l0,.table-wrap thead .sticky-l1{z-index:4}
  tbody tr.sel .sticky-l0,tbody tr.sel .sticky-l1{background:var(--primary-soft)}
  /* 密度三档 */
  .density-compact th,.density-compact td{padding:5px 10px}
  .density-spacious th,.density-spacious td{padding:13px 12px}
  /* 排序表头 */
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--text)}
  th .sort-ind{font-size:11px;color:var(--primary);margin-left:3px}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-size:var(--fs-xs);font-weight:500}
  .tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .tag.green{color:var(--green);background:var(--tag-green)}
  .tag.orange{color:var(--orange);background:var(--tag-orange)}
  .tag.red{color:var(--red);background:var(--tag-red)}
  .tag.blue{color:var(--primary);background:var(--primary-soft)}
  .tag.muted{color:var(--muted);background:var(--tag-muted)}

  /* 复选框与批量操作栏 */
  .cb{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;vertical-align:middle}
  .bulk-bar{display:none;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;
    background:var(--primary-soft);border:1px solid var(--bulk-line);border-radius:var(--radius)}
  .bulk-bar.show{display:flex}
  .bulk-bar .bulk-count{font-size:13px;font-weight:600;color:var(--primary)}
  .bulk-bar .spacer{margin-left:auto}

  /* 列显隐面板 */
  .col-menu{position:relative;display:inline-block}
  .col-menu > summary{list-style:none;cursor:pointer;border:1px solid transparent;
    background:var(--bg-soft);border-radius:var(--radius-sm);padding:0 12px;min-height:36px;font-size:13.5px;
    display:flex;align-items:center;gap:6px}
  .col-menu > summary::-webkit-details-marker{display:none}
  .col-menu .panel{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;box-shadow:var(--shadow-lg);
    z-index:20;min-width:150px}
  .col-menu .panel label{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer}
  .match-count{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}

  /* 表单字段就近报错 */
  .field .ferr{grid-column:2;color:var(--red);font-size:12.5px;min-height:16px;padding-top:2px}

  /* 分页 */
  .pager{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 2px 0}
  .pager .pg-info{font-size:13px;color:var(--muted)}
  .pager .spacer{margin-left:auto}

  /* 表单 */
  .form-card{max-width:640px;margin:8px 0;padding:26px 28px}
  .form-card h3{font-size:17px;margin-bottom:4px;font-weight:700}
  .form-card .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .field{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:12px 0}
  .field label{font-size:13.5px;color:var(--text)}
  .field label .req{color:var(--red)}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--card);width:100%;
    transition:border-color .15s,box-shadow .15s}
  .field input:hover,.field select:hover,.field textarea:hover{border-color:var(--sub)}
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(61,91,221,.14)}
  .field textarea{resize:vertical;min-height:78px}
  .file-line{display:flex;align-items:center;gap:10px}
  .file-line .fname{font-size:13px;color:var(--muted)}
  .err{color:var(--red);font-size:13px;min-height:20px;padding:6px 0}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

  /* 确认弹窗 */
  .mask{position:fixed;inset:0;background:rgba(22,29,41,.40);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:30}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:16px;max-width:520px;width:100%;padding:24px 26px;
    box-shadow:var(--shadow-lg)}
  .modal h3{font-size:16px;margin-bottom:12px;font-weight:700}
  .modal .body{font-size:14px}
  .modal .body .kv{display:grid;grid-template-columns:86px 1fr;gap:6px 12px;padding:4px 0}
  .modal .body .kv .k{color:var(--muted)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

  /* 详情抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(31,41,55,.32);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:25}
  .drawer-mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:92vw;background:var(--card);
    box-shadow:-10px 0 32px rgba(16,24,40,.14);display:flex;flex-direction:column;z-index:26;
    transform:translateX(100%);transition:transform .22s ease}
  .drawer.show{transform:translateX(0)}
  .drawer header{display:flex;align-items:flex-start;gap:10px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
  .drawer header .dh-t{flex:1;min-width:0}
  .drawer header h3{font-size:16px;line-height:1.4;word-break:break-all;font-weight:700}
  .drawer header .dh-tag{margin-top:6px}
  .drawer .dh-close{border:0;background:transparent;font-size:20px;color:var(--muted);padding:4px 8px;line-height:1;border-radius:6px}
  .drawer .dh-close:hover{color:var(--text);background:var(--bg)}
  .drawer-body{flex:1;overflow:auto;padding:18px 24px}
  .drawer-section{margin-bottom:18px}
  .drawer-section h4{font-size:12px;color:var(--sub);margin-bottom:10px;letter-spacing:.02em;font-weight:600}
  .kv{display:grid;grid-template-columns:86px 1fr;gap:8px 12px;font-size:13.5px}
  .kv .k{color:var(--muted)}
  .kv .v{word-break:break-all}
  .trace{border-top:1px solid var(--line);padding-top:12px}
  .trace h4{font-size:13px;color:var(--muted);margin-bottom:8px}
  .trace li{list-style:none;font-size:13px;padding:5px 0;color:var(--text)}
  .trace .t-time{color:var(--muted);margin-right:6px}
  .drawer footer{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line)}
  .drawer footer .spacer{margin-left:auto}

  .toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:var(--text);
    color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:40;max-width:80vw;text-align:center;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:.95}

  /* ===== 现代界面：主题切换 / 视图菜单 / 快捷键提示 ===== */
  .theme-switch{display:flex;gap:2px;padding:2px;background:var(--bg-soft);border-radius:8px;margin-top:10px}
  .theme-switch button{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px 0;
    min-height:26px;border-radius:6px;transition:background .15s,color .15s}
  .theme-switch button.on{background:var(--card);color:var(--text);font-weight:600}
  .sidebar.collapsed .theme-switch{display:none}

  .topbar .tb-left{display:flex;flex-direction:column;gap:1px;min-width:0}
  .topbar .tb-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .search-wrap{position:relative;display:flex;align-items:center}
  .search-wrap svg{position:absolute;left:11px;width:15px;height:15px;color:var(--sub);pointer-events:none}
  .toolbar .search-wrap input[type=search]{width:250px;padding-left:33px}

  .view-menu{position:relative;display:inline-block}
  .view-menu > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;
    min-height:36px;padding:0 12px;border-radius:var(--radius-sm);background:var(--bg-soft);color:var(--muted);font-size:13px}
  .view-menu > summary::-webkit-details-marker{display:none}
  .view-menu > summary:hover{color:var(--text)}
  .view-menu > summary svg{width:15px;height:15px}
  .view-menu .panel{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:200px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow-lg)}
  .view-menu .vrow{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:10px;padding:4px 0}
  .view-menu .vrow:last-child{align-items:start;padding-top:8px}
  .view-menu .vrow > span{font-size:12.5px;color:var(--muted)}
  .view-menu .vrow select{width:100%}
  .view-menu .col-checks{display:flex;flex-direction:column;gap:2px}
  .view-menu .col-checks label{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0;cursor:pointer}

  .kbd-hint{font-size:var(--fs-xs);color:var(--sub);white-space:nowrap}

  @media (max-width:1024px){
    .sidebar{width:200px}
    .brand{padding:20px 14px 14px}
    .nav button{padding:8px 10px;font-size:13px}
    .dash-cards{grid-template-columns:repeat(3,1fr)}
    .kpi-row{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:768px){
    .topbar{padding:0 16px}
    .cards{grid-template-columns:repeat(2,1fr)}
    .dash-cards{grid-template-columns:repeat(2,1fr)}
    .kpi-row{grid-template-columns:repeat(2,1fr)}
    .kpi:nth-child(2n){border-right:0}
    .grid-2{grid-template-columns:1fr}
    .sell-row,.steps{grid-template-columns:1fr}
    .content{padding:16px 16px 16px}
    .statusbar{padding:8px 16px}
    .field{grid-template-columns:1fr;gap:6px}
    .field .ferr{grid-column:1}
    .drawer{width:100%;max-width:100%}
    .kbd-hint{display:none}
    .search-wrap{flex:1 1 100%}
    .toolbar .search-wrap input[type=search]{width:100%}
  }
  @media (max-width:600px){
    .app{flex-direction:column}
    .sidebar{width:100%}
    .sidebar.collapsed{width:100%}
    .sidebar.collapsed .brand .bt{display:flex}
    .brand{padding:14px 16px 6px}
    .brand p{display:none}
    .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:4px 12px}
    .nav button{flex:0 0 auto;justify-content:center;min-height:38px}
    .nav button .txt{display:none}
    .nav-group-label{display:none}
    .side-bottom{margin-top:0;padding:6px 16px 10px}
    .identity{display:none}
    .topbar{height:48px;padding:0 16px}
  }

  /* ===== v0.15 骨架：顶栏搜索 / 页头 / 分层卡片 / 提醒与模板 ===== */
  body{background:var(--content)}
  .sidebar{width:236px;background:var(--sidebar)}
  .brand{height:64px;padding:0 16px 0 18px;border-bottom:1px solid var(--line);gap:10px}
  .brand .logo{width:30px;height:30px;border-radius:8px}
  .brand .logo svg{width:17px;height:17px}
  .brand h1{font-size:14.5px;font-weight:650}
  .brand p{font-size:11.5px}
  .nav{padding:10px 10px;gap:2px}
  .nav-group-label{padding:13px 12px 5px;font-size:10.5px;letter-spacing:.07em;color:var(--sub)}
  .nav button{min-height:37px;padding:7px 10px;border-radius:7px;font-size:13.5px;border:1px solid transparent}
  .nav button.active{background:var(--primary-soft);color:var(--primary);border-color:var(--bulk-line);font-weight:600}
  .nav button:hover:not(.active){background:var(--bg-soft);color:var(--text)}
  .side-bottom{padding:12px 14px;border-top:1px solid var(--line)}
  .identity{padding:2px 2px 10px;gap:9px}
  .identity .avatar{width:30px;height:30px;font-size:13px}
  .role-select{margin-top:8px;background:var(--card);border-color:var(--line);min-height:33px;font-size:12.5px}
  .theme-switch{margin-top:8px;background:var(--card-soft)}

  .topbar{height:64px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);gap:18px}
  .topbar .tb-left{display:none}
  .tb-search{flex:1;max-width:520px;min-width:0;position:relative;display:flex;align-items:center}
  .tb-search > svg{position:absolute;left:12px;width:15px;height:15px;color:var(--sub);pointer-events:none}
  .tb-search input{width:100%;height:38px;border:1px solid transparent;border-radius:8px;background:var(--bg-soft);
    color:var(--text);padding:0 74px 0 35px;font-size:13px;transition:border-color .15s,box-shadow .15s}
  .tb-search input::placeholder{color:var(--sub)}
  .tb-search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,99,238,.14);outline:none}
  .tb-search kbd{position:absolute;right:9px;font-family:inherit;font-size:10.5px;color:var(--sub);
    background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 6px;pointer-events:none}
  .topbar-right{display:flex;align-items:center;gap:9px;min-width:0}
  .id-chip{display:flex;align-items:center;gap:9px;padding:4px 8px 4px 4px;border:1px solid var(--line);
    border-radius:8px;background:var(--card-soft);min-width:0}
  .id-chip .ic-avatar{width:27px;height:27px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
  .id-chip .ic-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .id-chip .ic-name{font-size:12.5px;font-weight:600;white-space:nowrap}
  .id-chip .ic-role{font-size:10.5px;color:var(--sub);white-space:nowrap}
  .icon-btn{position:relative;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);cursor:pointer}
  .icon-btn:hover{background:var(--bg-soft);color:var(--text);border-color:var(--line-strong)}
  .icon-btn svg{width:17px;height:17px}
  .icon-btn .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--primary);color:#fff;font-size:10px;font-weight:600;display:none;align-items:center;justify-content:center;
    line-height:1;box-shadow:0 0 0 2px var(--card)}
  .icon-btn .badge.show{display:inline-flex}
  .topbar-action{display:flex;align-items:center;gap:8px}

  .content{padding:22px 28px 28px;min-width:0}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 18px}
  .page-head .ph-main{min-width:0}
  .page-head .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--sub);text-transform:none}
  .page-head h1{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.025em;margin-top:4px}
  .page-head .ph-sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .page-head .ph-side{display:flex;align-items:center;gap:8px;flex-shrink:0}

  .card{box-shadow:var(--shadow)}
  .panel{padding:18px 20px}
  .panel h3{font-size:13.5px;margin-bottom:13px}
  .hero{padding:0 0 18px;margin:0 0 18px}
  .hero h2{font-size:20px;letter-spacing:-.02em}
  .hero p{font-size:13px;color:var(--muted);max-width:720px}
  .action-bar{padding:14px 18px;border:1px solid var(--bulk-line)}
  .action-bar .ab-k{font-size:10.5px;letter-spacing:.08em}
  .kpi{padding:14px 18px}
  .kpi .num{font-size:23px}
  .stat-card{padding:15px 18px}
  .stat-card .num{font-size:21px}
  .btn{min-height:34px;padding:0 14px;font-size:13px}
  .btn.mini{min-height:28px;padding:3px 10px;font-size:12px}
  .toolbar{padding:12px 0 10px}
  .table-wrap{border:1px solid var(--line);border-radius:9px;background:var(--card);box-shadow:var(--shadow)}
  th,td{padding:10px 13px;font-size:13px}
  th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;background:var(--th-bg)}
  tbody tr{height:42px}
  tbody tr.clickable:active{background:var(--bg-soft)}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:5px}
  .drawer{width:460px;box-shadow:-14px 0 40px rgba(0,0,0,.2)}
  .drawer header{padding:18px 22px 13px}
  .drawer header h3{font-size:15.5px}
  .drawer-body{padding:18px 22px 24px}
  .drawer footer{padding:13px 22px}
  .drawer-section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .drawer-section:last-child{border-bottom:0;margin-bottom:0}
  .drawer-section h4{font-size:10.5px;letter-spacing:.08em;color:var(--sub);font-weight:600}
  .kv{font-size:12.5px;grid-template-columns:80px 1fr}
  .drawer .empty{padding:10px 0}
  .nodes{position:relative;padding-left:18px;margin:2px 0 0 3px;border-left:1px solid var(--line)}
  .node{position:relative;padding-bottom:15px}
  .node:last-child{padding-bottom:0}
  .node .nd-dot{position:absolute;left:-23px;top:3px;width:9px;height:9px;border-radius:50%;
    background:var(--card);border:2px solid var(--primary)}
  .node.off .nd-dot{border-color:var(--line-strong);background:var(--card-soft)}
  .node.bad .nd-dot{border-color:var(--red)}
  .node .nd-t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .node .nd-time{font-size:10.5px;color:var(--sub);font-weight:400}
  .node .nd-d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.55;word-break:break-word}
  .node.off .nd-t{color:var(--muted);font-weight:500}

  /* 提醒中心：顶栏入口 + 四卡弹层 */
  .reminder-pop{position:fixed;top:72px;right:24px;width:382px;max-width:calc(100vw - 24px);
    max-height:calc(100vh - 88px);background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow-lg);display:none;flex-direction:column;z-index:29;overflow:hidden}
  .reminder-pop.show{display:flex}
  .reminder-pop header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line)}
  .reminder-pop header .rh-t{font-size:13.5px;font-weight:650}
  .reminder-pop header .rh-s{font-size:10.5px;color:var(--sub);margin-top:2px}
  .reminder-pop .rh-close{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;
    padding:4px 6px;border-radius:6px;cursor:pointer}
  .reminder-pop .rh-close:hover{background:var(--bg-soft);color:var(--text)}
  .reminder-pop .rem-body{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:9px}
  .rem-card{border:1px solid var(--line);border-radius:9px;background:var(--card-soft);padding:11px 12px}
  .rem-card .rc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .rem-card .rc-title{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
  .rem-card .rc-title .dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
  .rem-card .rc-count{font-size:16px;font-weight:700;line-height:1}
  .rem-card .rc-list{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .rem-card .rc-row{font-size:11.5px;color:var(--muted);line-height:1.45;display:flex;gap:6px;min-width:0}
  .rem-card .rc-row b{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rem-card .rc-row span{white-space:nowrap;color:var(--sub)}
  .rem-card .rc-more{font-size:10.5px;color:var(--sub);margin-top:5px}
  .rem-card .rc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;
    padding-top:7px;border-top:1px solid var(--line)}
  .rem-card .rc-denied{font-size:11px;color:var(--sub);margin-top:6px}
  .rem-card .rc-go{border:0;background:transparent;color:var(--primary);font-size:11px;font-weight:600;cursor:pointer;padding:0}
  .rem-card .rc-go:hover{text-decoration:underline}
  .reminder-pop footer{padding:9px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--sub)}

  /* 材料模板配置 */
  .tpl-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
  .tpl-list{padding:8px;display:flex;flex-direction:column;gap:3px}
  .tpl-kind{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid transparent;
    background:transparent;border-radius:7px;padding:9px 10px;text-align:left;color:var(--muted);font-size:12.5px;cursor:pointer}
  .tpl-kind:hover{background:var(--bg-soft);color:var(--text)}
  .tpl-kind.on{background:var(--primary-soft);color:var(--primary);border-color:var(--bulk-line);font-weight:600}
  .tpl-kind .tk-n{font-size:10.5px;color:var(--sub);font-weight:400}
  .tpl-main{min-width:0}
  .tpl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .tpl-head h3{font-size:15px;font-weight:650;margin:0}
  .tpl-head p{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .tpl-table{width:100%;border-collapse:collapse}
  .tpl-table th,.tpl-table td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:left}
  .tpl-table th{font-size:10.5px;color:var(--sub);font-weight:600;background:var(--th-bg)}
  .tpl-table td .tpl-builtin{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .tpl-add{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .tpl-add-grid{display:grid;grid-template-columns:minmax(0,1fr) 130px 76px auto;gap:8px;align-items:center}
  .tpl-add-grid input,.tpl-add-grid select{border:1px solid var(--line);border-radius:7px;min-height:34px;padding:0 10px;
    background:var(--card);color:var(--text);font-size:12.5px;width:100%;min-width:0}
  .tpl-add-grid .tpl-req{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .tpl-add-sub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}
  .tpl-add-sub input{border:1px solid var(--line);border-radius:7px;min-height:34px;padding:0 10px;
    background:var(--card);color:var(--text);font-size:12.5px}
  .tpl-note{margin-top:10px;font-size:11px;color:var(--sub);line-height:1.55}
  .tpl-empty{padding:24px 10px;text-align:center;color:var(--sub);font-size:12px}

  @media (max-width:1100px){
    .id-chip .ic-t{display:none}
    .content{padding:20px 20px 24px}
    .tpl-wrap{grid-template-columns:1fr}
    .tpl-list{flex-direction:row;flex-wrap:wrap;border-bottom:1px solid var(--line);border-radius:0}
  }
  @media (max-width:768px){
    .sidebar{width:210px}

/* ============ 类型配置（schema 驱动：列 / 字段 / 校验 / 动作 / 导出共用一份定义） ============ */

}

function nowStr() {
  var d = new Date();
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function clean(v){ return v == null ? "" : String(v).trim(); }

/* 模板附加字段：仅接受 text/textarea/date/select，key 统一 cf_ 前缀，内置字段不受影响 */
function normalizeTemplateField(raw){
  if (!raw || typeof raw !== "object") return null;
  var type = clean(raw.type);
  if (TPL_TYPES.map(function(t){ return t[0]; }).indexOf(type) < 0) return null;
  var label = clean(raw.label), key = clean(raw.key);
  if (!label || !key) return null;
  var options = Array.isArray(raw.options) ? raw.options.map(clean).filter(Boolean) : [];
  if (type === "select" && options.length < 2) return null;
  return { key:key, label:label, type:type, required:!!raw.required, options:type === "select" ? options : [] };
}
function normalizeTemplates(src){
  var out = {};
  Object.keys(src || {}).forEach(function(k){
    if (!FORM_TEMPLATES[k] || !Array.isArray(src[k])) return;
    var fields = src[k].map(normalizeTemplateField).filter(Boolean);
    if (fields.length) out[k] = fields;
  });
  return out;
}
function addTemplateField(formType, data){
  var type = clean(formType), def = FORM_TEMPLATES[type];
  var label = clean(data && data.label);
  if (!def) throw new Error("未知模板类型");
  if (!label) throw new Error("请填写字段名称");
  if (label.length > 16) throw new Error("字段名称最多 16 个字");
  var kind = clean(data && data.type) || "text";
  if (TPL_TYPES.map(function(t){ return t[0]; }).indexOf(kind) < 0) throw new Error("未知字段类型");
  var options = Array.isArray(data.options) ? data.options.map(clean).filter(Boolean) : [];
  if (kind === "select" && options.length < 2) throw new Error("下拉字段至少需要两个选项");
  var exists = templateCustom(type).some(function(f){ return f.label === label; }) ||
    def.fields.some(function(f){ return f.label === label; });
  if (exists) throw new Error("该模板已有同名字段");
  store.templates = store.templates || {};
  store.templates[type] = templateCustom(type);
  store.templates[type].push({
    key:"cf_" + Math.random().toString(36).slice(2, 8),
    label:label, type:kind, required:!!(data && data.required),
    options:kind === "select" ? options : []
  });
  saveStore();
  return store.templates[type][store.templates[type].length - 1];
}
function removeTemplateField(formType, key){
  var type = clean(formType);
  key = clean(key);
  if (key.indexOf("cf_") !== 0) throw new Error("内置字段不能删除");
  var before = templateCustom(type);
  var after = before.filter(function(f){ return f.key !== key; });
  if (before.length === after.length) return false;
  store.templates = store.templates || {};
  if (after.length) store.templates[type] = after; else delete store.templates[type];
  saveStore();
  return true;
}

function loadStore() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.docs) && Array.isArray(data.logs)) {
        store.docs = data.docs.filter(function(d){ return d && typeof d === "object"; }).map(normalizeDoc);
        store.logs = data.logs.filter(function(l){ return l && typeof l === "object"; });
        store.roster = Array.isArray(data.roster) ? data.roster.filter(function(r){ return r && typeof r === "object"; }).map(normalizeRoster) : [];
        store.tasks = Array.isArray(data.tasks) ? data.tasks.filter(function(t){ return t && typeof t === "object"; }).map(normalizeTask) : [];
        store.templates = (data.templates && typeof data.templates === "object") ? normalizeTemplates(data.templates) : {};
        store.seq = data.seq || { doc: store.docs.length, log: store.logs.length };
        backfillCodes();
        saveStore();
        return;
      }
    }

/* ---- 仓库方法（与桌面版契约同名） ---- */
function listDocs(q, cat) {

/* 按类型 schema 对一条记录做字段兜底，缺字段补空串，状态/范围给默认值 */
function normalizeDoc(raw, i) {
  var row = { id: i + 1 };
  TYPES.doc.fields.forEach(function(f){ row[f.key] = clean(raw[f.key]); });
  row.time = clean(raw.time);
  row.status = clean(raw.status) || "待审核";
  row.scope = clean(raw.scope) || "全员";
  row.reason = clean(raw.reason);
  row.path = clean(raw.path);
  row.form_type = clean(raw.form_type) || "general";
  row.extra = (raw.extra && typeof raw.extra === "object") ? raw.extra : {};
  row.attachments = Array.isArray(raw.attachments)
    ? raw.attachments.filter(function(a){ return a && typeof a === "object"; }) : [];
  return row;
}
function codePrefix(cat){ return CAT_PREFIX[clean(cat)] || "材料"; }
function nextCode(cat, formType) {
  var ft = clean(formType);
  var prefix = (ft && ft !== "general" && FORM_PREFIX[ft]) || codePrefix(cat), maxn = 0;
  store.docs.forEach(function(d){
    var c = clean(d.code);
    if (c.indexOf(prefix + "-") === 0) {
      var tail = c.split("-")[1];
      if (/^\d+$/.test(tail)) maxn = Math.max(maxn, parseInt(tail, 10));
    }
  });
  return prefix + "-" + String(maxn + 1).padStart(3, "0");
}
function backfillCodes() {
  var used = {};
  store.docs.forEach(function(d){
    var prefix = codePrefix(d.cat), code = clean(d.code);
    used[prefix] = used[prefix] || {};
    if (code) { used[prefix][code] = true; return; }
    var maxn = 0;
    Object.keys(used[prefix]).forEach(function(c){
      if (c.indexOf(prefix + "-") === 0 && /^\d+$/.test(c.split("-")[1]))
        maxn = Math.max(maxn, parseInt(c.split("-")[1], 10));
    });
    maxn += 1;
    d.code = prefix + "-" + String(maxn).padStart(3, "0");
    used[prefix][d.code] = true;
  });
}
function addDoc(data) {
  var row = normalizeDoc(data, store.seq.doc);
  row.time = nowStr();
  row.status = "待审核";
  if (!row.name || !row.cat) throw new Error("材料名称、类别不能为空");
  var atts = Array.isArray(data.attachments) ? data.attachments.filter(function(a){ return a && typeof a === "object"; }) : [];
  if (!atts.length && row.file) atts = [{name: row.file, path: row.path || "", kind: ""}];
  row.attachments = atts;
  if (!row.code) row.code = nextCode(row.cat, row.form_type);
  store.seq.doc += 1; row.id = store.seq.doc;
  store.docs.push(row); saveStore();
  return row;
}

function archiveDoc(id){ var d = findDoc(id); if(!d) return null; d.status = "已归档"; saveStore(); return d; }

function addRoster(sid, who){

/* ---- 任务 / 截止跟踪 ---- */
function normalizeTask(raw, i){
  return {
    id: (i || 0) + 1,
    title: clean(raw.title), cat: clean(raw.cat), scope: clean(raw.scope) || "全员",
    deadline: clean(raw.deadline), note: clean(raw.note), done: !!raw.done
  };
}
function listTasks(){ return store.tasks.slice().sort(function(a,b){ return a.deadline < b.deadline ? -1 : 1; }); }
function findTask(id){ return store.tasks.find(function(t){ return t.id === id; }) || null; }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function normalizeDeadline(value){
  var raw = clean(value);
  if (!raw) return "";
  var m = raw.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (!m) throw new Error("截止日期格式应为 YYYY-MM-DD，例如 2026-11-30");
  var y = Number(m[1]), mo = Number(m[2]), day = Number(m[3]);
  var dt = new Date(Date.UTC(y, mo - 1, day));
  if (y < 1900 || y > 2100 || dt.getUTCFullYear() !== y ||
      dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== day) {
    throw new Error("截止日期格式应为 YYYY-MM-DD，例如 2026-11-30");
  }
  return y + "-" + pad2(mo) + "-" + pad2(day);
}
function addTask(data){
  var row = normalizeTask(data, store.seq.task || 0);
  row.deadline = normalizeDeadline(data.deadline);
  if (!row.title) throw new Error("任务标题不能为空");
  if (!row.deadline) throw new Error("请选择截止日期");
  var maxId = store.tasks.length ? Math.max.apply(null, store.tasks.map(function(x){ return x.id; })) : 0;
  row.id = maxId + 1;
  store.tasks.push(row); saveStore(); return row;
}
function updateTask(id, data){
  var t = findTask(id); if (!t) return null;
  ["title","cat","scope","note"].forEach(function(k){ if (data[k] != null) t[k] = clean(data[k]); });
  if (data.deadline != null) {
    var dl = normalizeDeadline(data.deadline);
    if (!dl) throw new Error("请选择截止日期");
    t.deadline = dl;
  }
  if (typeof data.done === "boolean") t.done = data.done;
  saveStore(); return t;
}
function removeTask(id){ store.tasks = store.tasks.filter(function(t){ return t.id !== id; }); saveStore(); }
function toggleTask(id){ var t = findTask(id); if (t) { t.done = !t.done; saveStore(); } }

function dateToday(){ var d = new Date(); function p(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function daysUntil(deadline){
  if (!deadline) return null;
  var today = new Date(dateToday()); var dl = new Date(deadline + "T00:00:00");
  return Math.round((dl - today) / 86400000);
}
function taskStats(){
  var ongoing = 0, due = 0, overdue = 0, done = 0;
  store.tasks.forEach(function(t){
    if (t.done) { done++; return; }
    var left = daysUntil(t.deadline);
    if (left != null && left < 0) overdue++;
    else if (left != null && left <= 2) due++;
    ongoing++;
  });
  return { total: store.tasks.length, ongoing: ongoing, due: due, overdue: overdue, done: done };
}

/* 核对：应交（名单）/ 已交（待审核或已归档）/ 未交 / 需补交（仅已驳回）/ 名单外材料 */
function rosterCheck(){
  var submitted = {}, rejected = {};
  store.docs.forEach(function(d){
    if (!d.sid) return;
    if (d.status === "待审核" || d.status === "已归档") submitted[d.sid] = true;
    else if (d.status === "已驳回") rejected[d.sid] = true;
  });
  var absent = store.roster.filter(function(r){ return !submitted[r.sid]; });
  var resubmit = store.roster.filter(function(r){ return rejected[r.sid] && !submitted[r.sid]; });
  var rosterSids = store.roster.map(function(r){ return r.sid; });
  var extra = store.docs.filter(function(d){ return d.sid && rosterSids.indexOf(d.sid) < 0; });
  return { total: store.roster.length, done: store.roster.length - absent.length,
    absent: absent, resubmit: resubmit, extra: extra };
}

var WATCH_KEY = "classconsole_web_watch";

function watchBaseName(name){ var s = String(name || ""); var i = s.lastIndexOf("."); return i > 0 ? s.slice(0, i) : s; }
function watchHumanSize(n){
  n = Number(n) || 0;
  var units = ["B", "KB", "MB", "GB"];
  for (var u = 0; u < units.length; u++){
    if (n < 1024 || u === units.length - 1) return u === 0 ? String(Math.round(n)) : (Math.round(n * 10) / 10) + " " + units[u];
    n /= 1024;
  }
  return "0 B";
}
function watchFmtMtime(ts){
  var d = new Date(Number(ts) || 0); if (isNaN(d.getTime())) return "";
  function p(x){ return (x < 10 ? "0" : "") + x; }
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

/* entries: [{rel,name,size,mtime}]；baseline: {rel:{name,size,mtime}}；regSet: {name:true}
   返回 {items, removed, counts:{new,changed,removed,registered,kept}} */
function compareWatch(entries, baseline, regSet){
  baseline = baseline || {}; regSet = regSet || {};
  var items = [], removed = [], seen = {};
  var counts = { new:0, changed:0, removed:0, registered:0, kept:0 };
  (entries || []).forEach(function(e){
    var prev = baseline[e.rel];
    var state;
    if (!prev) state = regSet[e.name] ? "registered" : "new";
    else if (prev.size !== e.size || prev.mtime !== e.mtime) state = "changed";
    else state = "kept";
    counts[state] = (counts[state] || 0) + 1;
    seen[e.rel] = true;
    items.push({ rel:e.rel, name:e.name, size:e.size, mtime:e.mtime, state:state });
  });
  Object.keys(baseline).forEach(function(rel){
    if (!seen[rel]){
      removed.push({ rel:rel, name:baseline[rel].name, size:baseline[rel].size, mtime:baseline[rel].mtime });
      counts.removed++;
    }
  });
  return { items:items, removed:removed, counts:counts };
}
function watchSnapshotOf(entries){
  var snap = {};
  (entries || []).forEach(function(e){ snap[e.rel] = { name:e.name, size:e.size, mtime:e.mtime }; });
  return snap;
}

    var label = document.createElement("div");
    label.className = "nav-group-label";
    label.textContent = g.label;
    nav.appendChild(label);
    items.forEach(function(n){
      var b = document.createElement("button");
      b.dataset.key = n.key;
      b.title = n.title;
      if (n.tier === "aux") b.classList.add("nav-aux");
      b.innerHTML = '<span class="ico">' + (ICONS[n.ico] || "") + '</span><span class="txt">' + esc(n.title) + "</span>";
      b.onclick = function(){ switchView(n.key); };
      nav.appendChild(b);
    });
  });
}

function renderPageHead(target){
  var head = document.getElementById("pageHead");

  var meta = VIEW_META[target.key] || {};
  head.innerHTML = '<div class="ph-main"><div class="eyebrow">' + esc(meta.eyebrow || "工作台") + '</div>' +
    '<h1>' + esc(target.title) + '</h1>' +
    '<div class="ph-sub" id="pageSub">' + esc(meta.sub || "当前岗位 · " + roleLabel() + " · 数据只在本机") + '</div></div>' +
    '<div class="ph-side" id="pageSide"></div>';
}
function switchView(key) {
  var target = NAV.find(function(n){ return n.key === key; });
  if (!target || !navVisible(target)) {
    if (state.current !== "dashboard") { toast("当前视角无权访问该模块"); switchView("dashboard"); }
    return;
  }
  state.current = key;
  NAV.forEach(function(n){
    document.getElementById("view-" + n.key).classList.toggle("active", n.key === key);
    var btn = document.querySelector('.nav button[data-key="' + n.key + '"]');
    if (btn) btn.classList.toggle("active", n.key === key);
  });
  var vt = document.getElementById("viewTitle");
  if (vt) vt.textContent = target.title;
  renderPageHead(target);
  if (key === "submit" && state.tplDirty) { buildSubmit(); state.tplDirty = false; }
  refreshAll();
}
function refreshAll() {
  var s = stats(visibleDocs());
  document.getElementById("statusRight").textContent = "材料 " + s.total + " 条 · 日志 " + store.logs.length + " 条";
  var persistTip = state.persist === false ? " · 存储不可用(仅本次会话)" : "";
  document.getElementById("statusLeft").textContent = "网页版 v" + WEB_VERSION + " · 本地缓存 · " + roleLabel() + persistTip;
  var tr = document.getElementById("topbarAction");
  if (tr) {
    if (state.current === "dashboard" && can("docs:create")) {
      tr.innerHTML = '<button class="btn primary" id="dashNew">提交新材料</button>';
      document.getElementById("dashNew").onclick = function(){ switchView("submit"); };
    } else {
      tr.innerHTML = "";
    }
  }
  refreshReminders();
  if (state.current === "dashboard") renderDashboard();
  else if (state.current === "docs") renderDocs();
  else if (state.current === "roster") renderRoster();
  else if (state.current === "tasks") renderTasks();
  else if (state.current === "templates") renderTemplates();
  else if (state.current === "collect") renderCollect();
  else if (state.current === "logs") renderLogs();
}

/* ============ 提醒中心（按岗位汇总待办，不联网） ============ */
var REM_LIMIT = 3;
function reminderSnapshot(){
  var docs = visibleDocs(store.docs);
  var pending = docs.filter(function(d){ return d.status === "待审核"; });
  var rejected = docs.filter(function(d){ return d.status === "已驳回"; });
  var canTask = can("task:manage"), canRoster = can("roster:manage");
  var taskAlerts = canTask ? listTasks().filter(function(t){
    if (t.done) return false;
    var left = daysUntil(t.deadline);
    return left != null && left <= 2;
  }) : [];
  var absent = canRoster ? rosterCheck().absent : [];
  return {
    pending: pending, rejected: rejected, tasks: taskAlerts, absent: absent,
    canTask: canTask, canRoster: canRoster,
    total: pending.length + rejected.length + taskAlerts.length + absent.length
  };
}
function refreshReminders(){
  var snap = reminderSnapshot();
  var badge = document.getElementById("reminderBadge");
  if (badge) {
    badge.textContent = snap.total > 99 ? "99+" : String(snap.total);
    badge.classList.toggle("show", snap.total > 0);
  }
  var btn = document.getElementById("reminderBtn");
  if (btn) btn.title = snap.total ? "提醒中心 · " + snap.total + " 项待办" : "提醒中心 · 暂无待办";
  var pop = document.getElementById("reminderPop");
  if (pop && pop.classList.contains("show")) renderReminders();
}
function remCardHtml(o){
  var rows = "", foot = "";
  if (o.denied) {
    rows = '<div class="rc-denied">' + esc(o.denied) + "</div>";
  } else if (!o.items.length) {
    rows = '<div class="rc-denied">' + esc(o.empty) + "</div>";
  } else {
    rows = o.items.slice(0, REM_LIMIT).map(function(it){
      return '<div class="rc-row"><b>' + esc(it.title) + "</b><span>" + esc(it.meta) + "</span></div>";
    }).join("");
    if (o.items.length > REM_LIMIT) rows += '<div class="rc-more">还有 ' + (o.items.length - REM_LIMIT) + " 项</div>";
    foot = '<div class="rc-foot"><span class="rc-more" style="margin:0">' +
      (o.denied ? "" : "处理后自动更新") + '</span><button class="rc-go" data-go="' + o.go + '"' +
      (o.filter ? ' data-filter="' + esc(o.filter) + '"' : "") + ">去" + esc(o.goLabel) + " →</button></div>";
  }
  return '<div class="rem-card"><div class="rc-head"><div class="rc-title">' +
    '<span class="dot" style="background:' + o.color + '"></span>' + esc(o.title) + "</div>" +
    '<span class="rc-count" style="color:' + o.color + '">' + (o.denied ? "—" : o.items.length) + "</span></div>" +
    '<div class="rc-list">' + rows + "</div>" + foot + "</div>";
}
function renderReminders(){
  var snap = reminderSnapshot();
  var body = document.getElementById("remBody");
  if (!body) return;
  var cards = [];
  cards.push(remCardHtml({
    title:"待审材料", color:"var(--orange)", items:snap.pending.map(function(d){
      return {title:d.name, meta:(d.who || "—") + " · " + (d.time || "时间未记")};
    }), empty:"没有待审材料", go:"docs", filter:"待审核", goLabel:"台账"
  }));
  cards.push(remCardHtml({
    title:"已驳回 · 需补交", color:"var(--red)", items:snap.rejected.map(function(d){
      return {title:d.name, meta:(d.who || "—") + " · " + (d.reason || "未填原因")};
    }), empty:"没有被驳回的材料", go:"docs", filter:"已驳回", goLabel:"台账"
  }));
  cards.push(remCardHtml({
    title:"任务临期 / 逾期", color:"var(--primary)", denied:snap.canTask ? "" : "当前视角不显示任务提醒",
    items:snap.tasks.map(function(t){
      var left = daysUntil(t.deadline);
      return {title:t.title, meta:left < 0 ? "逾期 " + (-left) + " 天 · " + t.deadline :
        (left === 0 ? "今天截止 · " + t.deadline : "剩 " + left + " 天 · " + t.deadline)};
    }), empty:"没有临期或逾期任务", go:"tasks", goLabel:"任务"
  }));
  cards.push(remCardHtml({
    title:"名单未交", color:"var(--green)", denied:snap.canRoster ? "" : "当前视角不显示名单核对",
    items:snap.absent.map(function(r){ return {title:r.who, meta:r.sid}; }),
    empty:"名单内成员均已交", go:"roster", goLabel:"名单"
  }));
  body.innerHTML = cards.join("");
  var sub = document.getElementById("remSub");
  if (sub) sub.textContent = "当前岗位 · " + roleLabel() + " · 共 " + snap.total + " 项待办";
  body.querySelectorAll(".rc-go").forEach(function(b){
    b.onclick = function(){
      if (b.dataset.filter) { docsFilter.status = b.dataset.filter; docsFilter.page = 1; }
      switchView(b.dataset.go);
      closeReminders();
    };
  });
}
function openReminders(){
  var pop = document.getElementById("reminderPop");
  if (!pop) return;
  if (pop.classList.contains("show")) { closeReminders(); return; }
  renderReminders();
  pop.classList.add("show");
  pop.setAttribute("aria-hidden", "false");
}
function closeReminders(){
  var pop = document.getElementById("reminderPop");
  if (!pop) return;
  pop.classList.remove("show");
  pop.setAttribute("aria-hidden", "true");
}
function bindReminders(){
  var btn = document.getElementById("reminderBtn");
  if (btn) btn.onclick = function(e){ if (e && e.stopPropagation) e.stopPropagation(); openReminders(); };
  var close = document.getElementById("remClose");
  if (close) close.onclick = closeReminders;
  document.addEventListener("click", function(e){
    var pop = document.getElementById("reminderPop"), b = document.getElementById("reminderBtn");
    if (!pop || !pop.classList.contains("show")) return;
    if ((pop.contains && pop.contains(e.target)) || (b && b.contains && b.contains(e.target))) return;
    closeReminders();
  });
}

/* ============ 看板（待办优先 + 卡片下钻） ============ */
function renderDashboard() {
  var isApplicant = state.role === "applicant";
  var sid = clean(state.applicantSid);
  var docs = visibleDocs(store.docs), logs = listLogs();
  var s = stats(docs);
  var pending = docs.filter(function(d){ return d.status === "待审核"; });
  var rejected = docs.filter(function(d){ return d.status === "已驳回"; });

  var canArchive = can("docs:archive"), canRoster = can("roster:manage"),
      canTask = can("task:manage"), canLogs = can("logs:view");

  var chk = rosterCheck();
  var tsk = taskStats();
  var kpiDefs = [
    {key:"total",    label:"材料总数", color:"var(--muted)",  filter:"全部"},
    {key:"pending",  label:"待审核",   color:"var(--orange)", filter:"待审核"},
    {key:"archived", label:"已归档",   color:"var(--green)",  filter:"已归档"},
    {key:"rejected", label:"已驳回",   color:"var(--red)",    filter:"已驳回"}
  ];
  var kpiHtml = kpiDefs.map(function(c){
    return '<div class="kpi" data-filter="' + esc(c.filter) + '" role="button" tabindex="0" title="查看' + c.label + '">' +
      '<span class="lbl" style="color:' + c.color + '"><span class="dot"></span>' + c.label + "</span>" +
      '<span class="num">' + s[c.key] + "</span></div>";
  }).join("");

  /* 衍生提醒：不占首屏卡片，收成一行可点摘要 */
  var auxItems = [];
  if (canRoster) auxItems.push('<a data-go="roster">未交 ' + chk.absent.length + " 人</a>");
  if (canTask) auxItems.push('<a data-go="tasks">临期 ' + tsk.due + " · 逾期 " + tsk.overdue + "</a>");
  var auxHtml = auxItems.length ? '<div class="aux-line">' + auxItems.join("") + "</div>" : "";

  var total = docs.length || 1;
  var catHtml = CATS.map(function(cat){
    var n = docs.filter(function(d){ return d.cat === cat; }).length;
    var pct = Math.round(100 * n / total);
    return '<div class="cat-row"><span class="name">' + esc(cat) + "</span>" +
      '<span class="track"><span class="fill" style="width:' + pct + '%"></span></span>' +
      '<span class="cnt">' + n + "</span></div>";
  }).join("");

  var recent = logs.slice(0, 6).map(function(l){
    return "<tr><td>" + esc(l.time) + "</td><td>" + esc(l.who) + "</td><td>" +
      esc(l.act) + "</td><td>" + esc(l.obj) + "</td></tr>";
  }).join("");
  var recentBody = recent || '<tr><td colspan="4" class="empty">暂无操作动态</td></tr>';

  /* 主待办队列：按岗位区分处理 / 跟进 / 本人关注 */
  var focusDocs, queueTitle, queueEmpty;
  if (isApplicant) {
    focusDocs = pending.concat(rejected);
    queueTitle = "需我关注的材料（" + focusDocs.length + "）";
    queueEmpty = sid
      ? '<tr><td colspan="4" class="empty"><div class="empty-title">暂无需要你跟进的材料</div>' +
        '<div class="empty-sub">你提交的材料进入审核后会显示在这里</div></td></tr>'
      : '<tr><td colspan="4" class="empty"><div class="empty-title">请先填写申请人学号</div>' +
        '<div class="empty-sub">未填写时不展示任何人的材料</div></td></tr>';
  } else if (canArchive) {
    focusDocs = pending;
    queueTitle = "待审核 · 需处理（" + pending.length + "）";
    queueEmpty = '<tr><td colspan="4" class="empty"><div class="empty-title">暂无待审核材料</div>' +
      '<div class="empty-sub">新材料提交后会先出现在这里等待处理</div></td></tr>';
  } else {
    focusDocs = pending;
    queueTitle = "待审核 · 跟进（" + pending.length + "）";
    queueEmpty = '<tr><td colspan="4" class="empty"><div class="empty-title">暂无待审核材料</div>' +
      '<div class="empty-sub">新材料提交后会先出现在这里跟进流转</div></td></tr>';
  }
  var pendRows = focusDocs.slice(0, 6).map(function(d){
    return "<tr class='clickable' data-id='" + d.id + "'><td>" + esc(d.name) + "</td><td>" +
      esc(d.who) + "</td><td>" + esc(d.sid) + "</td><td>" + esc(d.time) + "</td></tr>";
  }).join("");
  var pendBody = pendRows || queueEmpty;

  /* 未交材料清单：仅名单维护岗位可见 */
  var absentRows = chk.absent.slice(0, 6).map(function(r){
    return "<tr class='clickable-roster'><td>" + esc(r.who) + "</td><td>" + esc(r.sid) + "</td></tr>";
  }).join("");
  var absentBody = absentRows || '<tr><td colspan="2" class="empty">名单内成员均已交材料</td></tr>';

  var rightPanel = "";
  if (canLogs) {
    rightPanel = '<div class="card panel"><h3>近期动态</h3>' +
      '<div class="table-wrap"><table><colgroup><col style="width:26%"><col style="width:24%"><col style="width:18%"><col></colgroup>' +
      "<thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>对象</th></tr></thead><tbody>" + recentBody + "</tbody></table></div>" +
      "</div>";
  } else if (canRoster) {
    rightPanel = '<div class="card panel"><h3>未交材料 · 名单核对（' + chk.absent.length + "）</h3>" +
      '<div class="table-wrap"><table><colgroup><col style="width:40%"><col></colgroup>' +
      "<thead><tr><th>姓名</th><th>学号</th></tr></thead><tbody>" + absentBody + "</tbody></table></div>" +
      "</div>";
  }

  var empty = docs.length === 0 && !isApplicant;
  var canCreate = can("docs:create");

  var sellHtml = empty
    ? '<div class="sell-row">' +
        '<div class="sell"><div class="sell-ico">' + ICONS.docs + '</div><div class="sell-t">流程闭环</div><div class="sell-d">提交、审核、归档全程留痕，状态可追</div></div>' +
        '<div class="sell"><div class="sell-ico">' + ICONS.shield + '</div><div class="sell-t">本地离线</div><div class="sell-d">材料与日志只存本机浏览器，不依赖账号与网络</div></div>' +
        '<div class="sell"><div class="sell-ico">' + ICONS.folder + '</div><div class="sell-t">文件夹收集</div><div class="sell-d">选定目录自动比对新增、修改、删除，勾选即可入账</div></div>' +
      "</div>"
    : "";

  var sellTags = '<div class="sell-tags"><span>闭环留痕</span><span>本地离线</span><span>文件夹收集</span></div>';

  var heroHtml = "";

  /* 下一步重点：按岗位与待办给出唯一主动作 */
  var abTitle, abDesc, abGo, abFilter = "", abLabel, abFocus = "";
  if (isApplicant && !sid) {
    abTitle = "请先填写申请人学号";
    abDesc = "在左侧「申请人学号」填写后，这里只显示你的材料；未填写时不展示任何人的材料";
    abGo = "dashboard"; abLabel = "填写学号"; abFocus = "applicantSid";
  } else if (isApplicant) {
    if (focusDocs.length) {
      abTitle = "有 " + focusDocs.length + " 份材料需要你关注";
      abDesc = "被驳回或待审核的材料在这里，及时补充或跟进";
      abGo = "docs"; abLabel = "查看我的材料";
    } else {
      abTitle = "暂无需要你跟进的材料";
      abDesc = "提交新材料后，审核进度会显示在这里";
      abGo = canCreate ? "submit" : "docs"; abLabel = canCreate ? "提交材料" : "查看台账";
    }
  } else if (pending.length > 0) {
    abTitle = pending.length + " 份材料待" + (canArchive ? "审核" : "跟进");
    abDesc = canArchive ? "优先处理待审核材料，通过后归档并留痕" : "新材料进入待审核队列，跟进流转状态";
    abGo = "docs"; abFilter = "待审核"; abLabel = "去处理";
  } else {
    abTitle = "暂无待处理材料";
    abDesc = canCreate ? "可录入新材料，或核对名单与任务进度" : "可核对名单未交人员，跟进任务截止时间";
    abGo = canCreate ? "submit" : (canRoster ? "roster" : "docs");
    abLabel = canCreate ? "提交材料" : (canRoster ? "核对名单" : "查看台账");
  }
  var abAttrs = abFocus
    ? 'data-focus="' + abFocus + '"'
    : 'data-go="' + abGo + '"' + (abFilter ? ' data-filter="' + abFilter + '"' : "");
  var actionHtml = '<div class="action-bar"><div><div class="ab-k">下一步</div><div class="ab-t">' + esc(abTitle) +
    '</div><div class="ab-d">' + esc(abDesc) + '</div></div>' +
    '<button class="btn primary" ' + abAttrs + ">" + esc(abLabel) + "</button></div>";

        '<div class="step"><div class="step-no">1</div><div class="step-t">' + (canCreate ? "提交或收集材料" : "查看材料台账") + '</div>' +

          '<button class="step-go" data-go="' + firstGo + '">前往录入</button></div>' +
        '<div class="step"><div class="step-no">2</div><div class="step-t">跟进审核与归档</div>' +
          '<div class="step-d">新材料进入待审核队列，处理后归档并留下操作记录</div>' +
          '<button class="step-go" data-go="docs">前往台账</button></div>' +
        '<div class="step"><div class="step-no">3</div><div class="step-t">核对名单 · 跟进任务</div>' +
          '<div class="step-d">对照名单查看未交人员，登记任务与截止时间</div>' +
          '<button class="step-go" data-go="' + thirdGo + '">前往核对</button></div>' +
      "</div>"
    : "";

  var queueHtml = '<div class="card panel" style="margin-bottom:14px"><h3>' + queueTitle + "</h3>" +
      '<div class="table-wrap"><table><colgroup><col><col style="width:18%"><col style="width:18%"><col style="width:22%"></colgroup>' +
      "<thead><tr><th>材料名称</th><th>提交人</th><th>学号</th><th>提交时间</th></tr></thead><tbody>" + pendBody + "</tbody></table></div>" +

      '<div class="card panel"><h3>类别分布</h3>' + catHtml + "</div>" +

  document.getElementById("view-dashboard").innerHTML = empty
    ? heroHtml + stepsHtml + (rightPanel ? '<div class="grid-2">' + rightPanel + "</div>" : "")
    : heroHtml + actionHtml + queueHtml + '<div class="kpi-row">' + kpiHtml + "</div>" + auxHtml + gridHtml;

  document.querySelectorAll("#view-dashboard .kpi").forEach(function(card){
    var go = function(){ drillByStatus(card.dataset.filter); };
    card.onclick = go;
    card.onkeydown = function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
  document.querySelectorAll("#view-dashboard [data-go]").forEach(function(a){
    a.onclick = function(){
      if (a.dataset.filter) { docsFilter.status = a.dataset.filter; docsFilter.page = 1; }
      switchView(a.dataset.go);
    };
  });
  document.querySelectorAll("#view-dashboard [data-focus]").forEach(function(a){
    a.onclick = function(){
      var el = document.getElementById(a.dataset.focus);
      if (el && el.focus) el.focus();
    };
