<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班级材料操作台 · 浏览器本地版</title>
<style>
  :root{
    --bg:#F4F6FA; --card:#FFFFFF; --line:#E7ECF2; --text:#1F2937; --muted:#6B7280;
    --primary:#4F63EE; --primary-hover:#3D55D8; --primary-soft:#EEF1FE;
    --green:#16A34A; --orange:#F59E0B; --red:#EF4444; --zebra:#F8FAFC;
    --radius:12px; --shadow:0 1px 3px rgba(31,41,55,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  }
  button{font-family:inherit;font-size:14px;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  .app{display:flex;min-height:100vh}

  /* 侧边栏 */
  .sidebar{width:208px;background:var(--card);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:24px 20px 18px}
  .brand h1{font-size:17px;font-weight:700}
  .brand p{font-size:12px;color:var(--muted);margin-top:3px}
  .nav{display:flex;flex-direction:column;padding:6px 10px;gap:2px}
  .nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;
    color:var(--muted);padding:11px 14px;border-radius:9px;text-align:left;min-height:44px}
  .nav button .ico{width:18px;text-align:center}
  .nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .nav button:hover:not(.active){background:var(--bg)}
  .side-bottom{margin-top:auto;padding:18px 16px;border-top:1px solid var(--line)}
  .side-bottom .lbl{font-size:12px;color:var(--muted);margin-bottom:10px}
  .role-row{display:flex;gap:8px}
  .role-row label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--line);border-radius:9px;padding:9px 6px;cursor:pointer;min-height:40px}
  .role-row input{accent-color:var(--primary)}
  .role-row label.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 28px 10px}
  .topbar h2{font-size:19px;font-weight:700}
  .topbar .summary{font-size:13px;color:var(--muted);white-space:nowrap}
  .content{flex:1;padding:6px 28px 18px;min-width:0}
  .view{display:none}
  .view.active{display:block}
  .statusbar{display:flex;justify-content:space-between;gap:16px;padding:9px 28px;
    background:#E4EAE9;color:#5B716E;font-size:12.5px}

  /* 卡片与通用 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px 16px}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 15px;min-height:40px}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.danger{background:var(--card);border-color:#F3C2C2;color:var(--red)}
  .btn.danger:hover{background:#FEECEC}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 0}
  .toolbar label{font-size:13px;color:var(--muted)}
  .toolbar input[type=search],.toolbar select{
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--card);min-height:40px}
  .toolbar input[type=search]{width:210px}
  .actions{display:flex;gap:10px;align-items:center;padding:12px 0}
  .hint{margin-left:auto;font-size:13px;color:var(--muted)}

  /* 看板 */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 16px}
  .stat-card{padding:16px 18px}
  .stat-card .num{font-size:26px;font-weight:700}
  .stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:2px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{padding:14px 16px}
  .panel h3{font-size:14px;margin-bottom:12px}
  .cat-row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .cat-row .name{width:78px;font-size:13px;flex-shrink:0}
  .cat-row .track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .cat-row .fill{height:100%;background:var(--primary);border-radius:6px}
  .cat-row .cnt{width:26px;text-align:right;font-size:13px;color:var(--muted)}
  .panel + .panel{margin-top:14px}

  /* 表格 */
  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12.5px;background:var(--zebra)}
  tbody tr:nth-child(even){background:var(--zebra)}
  tbody tr.sel{background:var(--primary-soft)}
  tbody tr.clickable{cursor:pointer}
  .tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px}
  .tag.green{color:var(--green);background:#EAF7EF}
  .tag.orange{color:var(--orange);background:#FDF3E3}
  .tag.red{color:var(--red);background:#FEECEC}
  .tag.muted{color:var(--muted);background:#F1F3F6}

  /* 表单 */
  .form-card{max-width:640px;margin:8px 0;padding:24px 26px}
  .form-card h3{font-size:17px;margin-bottom:4px}
  .form-card .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .field{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:11px 0}
  .field label{font-size:14px}
  .field label .req{color:var(--red)}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--card);width:100%}
  .field textarea{resize:vertical;min-height:78px}
  .file-line{display:flex;align-items:center;gap:10px}
  .file-line .fname{font-size:13px;color:var(--muted)}
  .err{color:var(--red);font-size:13px;min-height:20px;padding:6px 0}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(31,41,55,.42);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:30}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:14px;max-width:520px;width:100%;padding:22px 24px;
    box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .modal h3{font-size:16px;margin-bottom:12px}
  .modal .body{font-size:14px}
  .modal .body .kv{display:grid;grid-template-columns:86px 1fr;gap:6px 12px;padding:4px 0}
  .modal .body .kv .k{color:var(--muted)}
  .trace{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .trace h4{font-size:13px;color:var(--muted);margin-bottom:8px}
  .trace li{list-style:none;font-size:13px;padding:4px 0;color:var(--text)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:var(--text);
    color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:40}
  .toast.show{opacity:.95}

  @media (max-width:880px){
    .app{flex-direction:column}
    .sidebar{width:100%;border-right:0;border-bottom:1px solid var(--line)}
    .nav{flex-direction:row;flex-wrap:wrap}
    .nav button{flex:1;justify-content:center}
    .side-bottom{margin-top:0;border-top:1px solid var(--line)}
    .cards{grid-template-columns:repeat(2,1fr)}
    .grid-2{grid-template-columns:1fr}
    .topbar{padding:16px 16px 8px}
    .content{padding:4px 16px 16px}
    .statusbar{padding:8px 16px}
    .field{grid-template-columns:1fr;gap:6px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>班级操作台</h1>
      <p>数据仅存本浏览器 · 不上云、不同步</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom">
      <div class="lbl">当前视角</div>
      <div class="role-row" id="roleRow">
        <label id="roleAdmin"><input type="radio" name="role" value="admin"> 管理员</label>
        <label id="roleStudent"><input type="radio" name="role" value="student"> 同学</label>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="viewTitle">工作台概览</h2>
      <div class="summary" id="summary"></div>
    </div>
    <div class="content">
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-docs"></section>
      <section class="view" id="view-submit"></section>
      <section class="view" id="view-logs"></section>
    </div>
    <div class="statusbar">
      <span id="statusLeft">本地缓存模式 · 数据保存在本浏览器</span>
      <span id="statusRight"></span>
    </div>
  </main>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ 常量与种子数据（对齐桌面版 seed.py） ============ */
var CATS = ["团务材料", "奖助材料", "学分材料", "宣传材料", "班级事务"];
var STORE_KEY = "classconsole_web_v1";

var SEED_DOCS = [
  {name:"团日活动申报表", cat:"团务材料", who:"黄志强", sid:"250211", note:"十月主题团日活动", file:"", time:"11-12 09:24", status:"已归档", scope:"全员"},
  {name:"奖学金评定证明复印件", cat:"奖助材料", who:"李雨桐", sid:"250203", note:"校级奖学金评定", file:"证明复印件.pdf", time:"11-12 10:05", status:"待审核", scope:"班委"},
  {name:"社团招新活动新闻稿", cat:"宣传材料", who:"王浩宇", sid:"250217", note:"计算机网络协会招新", file:"新闻稿.docx", time:"11-13 14:40", status:"已归档", scope:"全员"},
  {name:"实践学分认定表", cat:"学分材料", who:"覃祖悦", sid:"250201", note:"暑期实践学分认定", file:"认定表.pdf", time:"11-13 16:18", status:"已归档", scope:"本人"},
  {name:"班会签到表", cat:"班级事务", who:"陈思颖", sid:"250208", note:"11 月第二次班会", file:"签到表.xlsx", time:"11-14 08:52", status:"待审核", scope:"全员"},
  {name:"反诈舞台剧剧照素材包", cat:"宣传材料", who:"覃祖悦", sid:"250201", note:"《签名的重量》剧照", file:"素材包.zip", time:"11-14 10:30", status:"已归档", scope:"全员"},
  {name:"体测成绩统计表", cat:"班级事务", who:"刘一帆", sid:"250222", note:"本学期体测汇总", file:"", time:"11-14 11:07", status:"待审核", scope:"全员"}
];
var SEED_LOGS = [
  {time:"11-14 11:20", who:"覃祖悦", role:"管理员", act:"查看", obj:"反诈舞台剧剧照素材包", src:"本机"},
  {time:"11-14 11:07", who:"刘一帆", role:"同学", act:"提交", obj:"体测成绩统计表", src:"本机"},
  {time:"11-14 10:30", who:"覃祖悦", role:"管理员", act:"归档", obj:"反诈舞台剧剧照素材包", src:"本机"},
  {time:"11-14 08:52", who:"陈思颖", role:"同学", act:"提交", obj:"班会签到表", src:"本机"},
  {time:"11-13 16:18", who:"覃祖悦", role:"管理员", act:"修改", obj:"实践学分认定表", src:"本机"},
  {time:"11-13 14:40", who:"王浩宇", role:"同学", act:"提交", obj:"社团招新活动新闻稿", src:"本机"}
];

/* ============ 本地缓存存储层（对齐仓库契约） ============ */
var store = { docs: [], logs: [], seq: { doc: 0, log: 0 } };

function nowStr() {
  var d = new Date();
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function clean(v){ return v == null ? "" : String(v).trim(); }

function loadStore() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.docs) && Array.isArray(data.logs)) {
        store.docs = data.docs; store.logs = data.logs;
        store.seq = data.seq || { doc: store.docs.length, log: store.logs.length };
        return;
      }
    }
  } catch (e) { /* 缓存损坏则重建种子 */ }
  store.docs = SEED_DOCS.map(function(d, i){ return Object.assign({id: i+1}, d); });
  store.logs = SEED_LOGS.map(function(l, i){ return Object.assign({id: i+1}, l); });
  store.seq = { doc: store.docs.length, log: store.logs.length };
  saveStore();
}
function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
    state.persist = true;
  } catch (e) {
    // 存储被禁用或配额不足时降级为内存态，不中断当前操作
    state.persist = false;
  }
}

/* ---- 仓库方法（与桌面版契约同名） ---- */
function listDocs(q, cat) {
  q = clean(q).toLowerCase(); cat = clean(cat) || "全部";
  return store.docs.filter(function(d){
    var okCat = (cat === "全部" || d.cat === cat);
    if (!okCat) return false;
    if (!q) return true;
    return [d.name, d.who, d.sid].some(function(f){ return clean(f).toLowerCase().indexOf(q) >= 0; });
  }).sort(function(a,b){ return b.id - a.id; });
}
function addDoc(data) {
  var row = {
    name: clean(data.name), cat: clean(data.cat), who: clean(data.who), sid: clean(data.sid),
    note: clean(data.note), file: clean(data.file), time: nowStr(),
    status: "待审核", scope: clean(data.scope) || "全员"
  };
  if (!row.name || !row.cat || !row.who) throw new Error("材料名称、类别、姓名不能为空");
  store.seq.doc += 1; row.id = store.seq.doc;
  store.docs.push(row); saveStore();
  return row;
}
function findDoc(id){ return store.docs.find(function(d){ return d.id === id; }) || null; }
function archiveDoc(id){ var d = findDoc(id); if(!d) return null; d.status = "已归档"; saveStore(); return d; }
function rejectDoc(id){ var d = findDoc(id); if(!d) return null; d.status = "已驳回"; saveStore(); return d; }
function listLogs(){ return store.logs.slice().sort(function(a,b){ return b.id - a.id; }); }
function addLog(act, obj, who, role, src) {
  store.seq.log += 1;
  store.logs.push({id: store.seq.log, time: nowStr(), who: clean(who), role: clean(role),
    act: clean(act), obj: clean(obj), src: clean(src) || "本机"});
  saveStore();
}
function stats() {
  return {
    total: store.docs.length,
    pending: store.docs.filter(function(d){ return d.status === "待审核"; }).length,
    archived: store.docs.filter(function(d){ return d.status === "已归档"; }).length,
    rejected: store.docs.filter(function(d){ return d.status === "已驳回"; }).length
  };
}
function backup(){ return { docs: store.docs, logs: store.logs }; }
function restore(docs, logs) {
  if (!Array.isArray(docs) || !Array.isArray(logs)) throw new Error("备份数据结构不正确");
  store.docs = docs.filter(function(d){ return d && typeof d === "object"; }).map(function(d,i){
    return {id: i+1, name:clean(d.name), cat:clean(d.cat), who:clean(d.who), sid:clean(d.sid),
      note:clean(d.note), file:clean(d.file), time:clean(d.time),
      status:clean(d.status) || "待审核", scope:clean(d.scope) || "全员"};
  });
  store.logs = logs.filter(function(l){ return l && typeof l === "object"; }).map(function(l,i){
    return {id: i+1, time:clean(l.time), who:clean(l.who), role:clean(l.role),
      act:clean(l.act), obj:clean(l.obj), src:clean(l.src) || "本机"};
  });
  store.seq = { doc: store.docs.length, log: store.logs.length };
  saveStore();
}

/* ============ 界面状态与通用反馈 ============ */
var state = { role: "admin", current: "dashboard", operatorName: "学委", selectedId: null, persist: true };
var NAV = [
  {key:"dashboard", title:"工作台概览", ico:"◫"},
  {key:"docs",      title:"材料台账",   ico:"▤"},
  {key:"submit",    title:"提交材料",   ico:"✎"},
  {key:"logs",      title:"操作日志",   ico:"☰"}
];

function esc(s){ return clean(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
function roleLabel(){ return state.role === "admin" ? "管理员" : "同学"; }

var toastTimer = null;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

function showModal(title, bodyHtml, actions) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  var box = document.getElementById("modalActions");
  box.innerHTML = "";
  (actions || []).forEach(function(a){
    var b = document.createElement("button");
    b.className = a.cls || "btn"; b.textContent = a.label;
    b.onclick = function(){ if (a.onClick) a.onClick(); if (a.close !== false) closeModal(); };
    box.appendChild(b);
  });
  document.getElementById("mask").classList.add("show");
}
function closeModal(){ document.getElementById("mask").classList.remove("show"); }
function confirmModal(title, message, onOk) {
  showModal(title, "<div>" + esc(message) + "</div>", [
    {label:"取消", cls:"btn", onClick:function(){}},
    {label:"确定", cls:"btn primary", onClick:onOk}
  ]);
}

/* ============ 导航与全局刷新 ============ */
function buildNav() {
  var nav = document.getElementById("nav");
  nav.innerHTML = "";
  NAV.forEach(function(n){
    var b = document.createElement("button");
    b.dataset.key = n.key;
    b.innerHTML = '<span class="ico">' + n.ico + "</span><span>" + esc(n.title) + "</span>";
    b.onclick = function(){ switchView(n.key); };
    nav.appendChild(b);
  });
}
function switchView(key) {
  state.current = key;
  NAV.forEach(function(n){
    document.getElementById("view-" + n.key).classList.toggle("active", n.key === key);
    var btn = document.querySelector('.nav button[data-key="' + n.key + '"]');
    if (btn) btn.classList.toggle("active", n.key === key);
  });
  var cur = NAV.find(function(n){ return n.key === key; });
  document.getElementById("viewTitle").textContent = cur.title;
  refreshAll();
}
function refreshAll() {
  var s = stats();
  document.getElementById("summary").textContent =
    "总数 " + s.total + " · 待审核 " + s.pending + " · 已归档 " + s.archived + " · 已驳回 " + s.rejected;
  document.getElementById("statusRight").textContent = "材料 " + s.total + " 条 · 日志 " + store.logs.length + " 条";
  var persistTip = state.persist === false ? " · 存储不可用(仅本次会话)" : "";
  document.getElementById("statusLeft").textContent = "本地缓存 · " + roleLabel() + persistTip;
  if (state.current === "dashboard") renderDashboard();
  else if (state.current === "docs") renderDocs();
  else if (state.current === "logs") renderLogs();
}

/* ============ 看板 ============ */
function renderDashboard() {
  var docs = store.docs, logs = listLogs();
  var s = stats();
  var pending = docs.filter(function(d){ return d.status === "待审核"; });
  var cardDefs = [
    ["total", "材料总数", "var(--text)"],
    ["pending", "待审核", "var(--orange)"],
    ["archived", "已归档", "var(--green)"],
    ["rejected", "已驳回", "var(--red)"]
  ];
  var cardsHtml = cardDefs.map(function(c){
    return '<div class="card stat-card"><div class="num" style="color:' + c[2] + '">' + s[c[0]] +
      '</div><div class="lbl">' + c[1] + "</div></div>";
  }).join("");

  var total = docs.length || 1;
  var catHtml = CATS.map(function(cat){
    var n = docs.filter(function(d){ return d.cat === cat; }).length;
    var pct = Math.round(100 * n / total);
    return '<div class="cat-row"><span class="name">' + esc(cat) + "</span>" +
      '<span class="track"><span class="fill" style="width:' + pct + '%"></span></span>' +
      '<span class="cnt">' + n + "</span></div>";
  }).join("");

  var recent = logs.slice(0, 6).map(function(l){
    return "<tr><td>" + esc(l.time) + "</td><td>" + esc(l.who) + "</td><td>" +
      esc(l.act) + "</td><td>" + esc(l.obj) + "</td></tr>";
  }).join("");
  var recentBody = recent || '<tr><td colspan="4" class="empty">暂无操作动态</td></tr>';

  var pendRows = pending.slice(0, 5).map(function(d){
    return "<tr class='clickable' data-id='" + d.id + "'><td>" + esc(d.name) + "</td><td>" +
      esc(d.who) + "</td><td>" + esc(d.sid) + "</td><td>" + esc(d.time) + "</td></tr>";
  }).join("");
  var pendBody = pendRows || '<tr><td colspan="4" class="empty">暂无待审核材料</td></tr>';

  document.getElementById("view-dashboard").innerHTML =
    '<div class="cards">' + cardsHtml + "</div>" +
    '<div class="grid-2">' +
      '<div class="card panel"><h3>类别分布</h3>' + catHtml + "</div>" +
      '<div class="card panel"><h3>近期动态</h3>' +
        '<div class="table-wrap"><table><colgroup><col style="width:26%"><col style="width:24%"><col style="width:18%"><col></colgroup>' +
        "<thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>对象</th></tr></thead><tbody>" + recentBody + "</tbody></table></div>" +
      "</div>" +
    "</div>" +
    '<div class="card panel" style="margin-top:14px"><h3>待审核 · 需处理</h3>' +
      '<div class="table-wrap"><table><colgroup><col><col style="width:18%"><col style="width:18%"><col style="width:22%"></colgroup>' +
      "<thead><tr><th>材料名称</th><th>提交人</th><th>学号</th><th>提交时间</th></tr></thead><tbody>" + pendBody + "</tbody></table></div>" +
    "</div>";

  document.querySelectorAll("#view-dashboard tbody tr.clickable").forEach(function(tr){
    tr.onclick = function(){ switchView("docs"); state.selectedId = Number(tr.dataset.id); renderDocs(); };
  });
}

/* ============ 材料台账 ============ */
var docsFilter = { q: "", cat: "全部", status: "全部" };
var STATUS_TAG = { "已归档": "green", "已驳回": "red", "待审核": "orange", "待补材料": "orange" };

function buildDocs() {
  var catOpts = ["全部"].concat(CATS).map(function(c){
    return '<option' + (docsFilter.cat===c?" selected":"") + ">" + esc(c) + "</option>"; }).join("");
  var stOpts = ["全部","待审核","已归档","已驳回","待补材料"].map(function(c){
    return '<option' + (docsFilter.status===c?" selected":"") + ">" + esc(c) + "</option>"; }).join("");
  document.getElementById("view-docs").innerHTML =
    '<div class="toolbar">' +
      "<label>搜索</label><input type='search' id='fQ' placeholder='名称 / 姓名 / 学号' value='" + esc(docsFilter.q) + "'>" +
      "<label>类别</label><select id='fCat'>" + catOpts + "</select>" +
      "<label>状态</label><select id='fStatus'>" + stOpts + "</select></div>" +
    '<div class="table-wrap"><table><colgroup><col><col style="width:13%"><col style="width:12%"><col style="width:13%"><col style="width:18%"><col style="width:13%"><col></colgroup>' +
      "<thead><tr><th>材料名称</th><th>类别</th><th>提交人</th><th>学号</th><th>提交时间</th><th>状态</th><th>附件</th></tr></thead>" +
      '<tbody id="docsBody"></tbody></table></div>' +
    '<div class="actions" id="docsActions"></div>';

  document.getElementById("fQ").oninput = function(e){ docsFilter.q = e.target.value; renderDocs(); };
  document.getElementById("fCat").onchange = function(e){ docsFilter.cat = e.target.value; renderDocs(); };
  document.getElementById("fStatus").onchange = function(e){ docsFilter.status = e.target.value; renderDocs(); };
}

function renderDocs() {
  var rows = listDocs(docsFilter.q, docsFilter.cat);
  if (docsFilter.status && docsFilter.status !== "全部") {
    rows = rows.filter(function(d){ return d.status === docsFilter.status; });
  }
  var isAdmin = state.role === "admin";

  var trs = rows.map(function(d){
    var tag = STATUS_TAG[d.status] || "orange";
    var sel = d.id === state.selectedId ? " sel" : "";
    return "<tr class='clickable" + sel + "' data-id='" + d.id + "'>" +
      "<td>" + esc(d.name) + "</td><td>" + esc(d.cat) + "</td><td>" + esc(d.who) + "</td>" +
      "<td>" + esc(d.sid) + "</td><td>" + esc(d.time) + "</td>" +
      '<td><span class="tag ' + tag + '">' + esc(d.status) + "</span></td>" +
      "<td>" + esc(d.file || "无附件") + "</td></tr>";
  }).join("");
  document.getElementById("docsBody").innerHTML =
    trs || '<tr><td colspan="7" class="empty">暂无符合条件的材料，可到「提交材料」录入</td></tr>';

  document.querySelectorAll("#docsBody tr.clickable").forEach(function(tr){
    tr.onclick = function(){ state.selectedId = Number(tr.dataset.id); renderDocs(); };
    tr.ondblclick = function(){ viewDoc(state.selectedId); };
  });

  var actions = '<button class="btn" id="btnView">查看</button>' +
    (isAdmin ? '<button class="btn primary" id="btnArchive">归档</button>' +
               '<button class="btn danger" id="btnReject">驳回</button>' : "") +
    '<span class="hint" id="docsHint">共 ' + rows.length + " 条</span>";
  document.getElementById("docsActions").innerHTML = actions;

  var has = state.selectedId != null && findDoc(state.selectedId);
  document.getElementById("btnView").disabled = !has;
  var btnA = document.getElementById("btnArchive"), btnR = document.getElementById("btnReject");
  if (btnA) btnA.disabled = !has;
  if (btnR) btnR.disabled = !has;
  document.getElementById("btnView").onclick = function(){ viewDoc(state.selectedId); };
  if (btnA) btnA.onclick = archiveSelected;
  if (btnR) btnR.onclick = rejectSelected;
}

function viewDoc(id) {
  var d = findDoc(id);
  if (!d) { toast("请先在列表中选择一条材料"); return; }
  try { addLog("查看", d.name, state.operatorName, roleLabel()); } catch (e) {}
  var trace = listLogs().filter(function(l){ return l.obj === d.name; }).slice(0, 5);
  var traceHtml = trace.length ? '<div class="trace"><h4>最近操作记录</h4><ul>' +
    trace.map(function(l){ return "<li>" + esc(l.time) + "　" + esc(l.who) + "（" + esc(l.role) + "）· " + esc(l.act) + "</li>"; }).join("") +
    "</ul></div>" : "";
  showModal("材料详情",
    '<div class="kv"><span class="k">名称</span><span>' + esc(d.name) + "</span>" +
    '<span class="k">类别</span><span>' + esc(d.cat) + "</span>" +
    '<span class="k">提交人</span><span>' + esc(d.who) + "（" + esc(d.sid) + "）</span>" +
    '<span class="k">提交时间</span><span>' + esc(d.time) + "</span>" +
    '<span class="k">状态</span><span>' + esc(d.status) + "</span>" +
    '<span class="k">附件</span><span>' + esc(d.file || "无") + "</span>" +
    '<span class="k">说明</span><span>' + esc(d.note || "无") + "</span></div>" + traceHtml,
    [{label:"关闭", cls:"btn", onClick:function(){}}]);
  refreshAll();
}

function archiveSelected() {
  var d = findDoc(state.selectedId);
  if (!d) { toast("请先选择一条材料"); return; }
  if (d.status === "已归档") { toast("该材料已是已归档状态"); return; }
  confirmModal("归档确认", "确定将「" + d.name + "」归档吗？", function(){
    var saved = archiveDoc(d.id);
    if (saved) { try { addLog("归档", saved.name, state.operatorName, roleLabel()); } catch(e){} }
    refreshAll(); toast("已归档，并写入操作日志");
  });
}
function rejectSelected() {
  var d = findDoc(state.selectedId);
  if (!d) { toast("请先选择一条材料"); return; }
  if (d.status === "已驳回") { toast("该材料已是已驳回状态"); return; }
  confirmModal("驳回确认", "确定驳回「" + d.name + "」吗？驳回后该材料将标记为已驳回。", function(){
    var saved = rejectDoc(d.id);
    if (saved) { try { addLog("驳回", saved.name, state.operatorName, roleLabel()); } catch(e){} }
    refreshAll(); toast("已驳回，并写入操作日志");
  });
}

/* ============ 提交材料 ============ */
var submitFile = "";
function buildSubmit() {
  var catOptions = CATS.map(function(c){ return "<option>" + esc(c) + "</option>"; }).join("");
  document.getElementById("view-submit").innerHTML =
    '<div class="card form-card">' +
      "<h3>提交班级材料</h3>" +
      '<p class="sub">带 * 为必填项，提交后进入待审核列表并生成操作记录</p>' +
      '<div class="field"><label>材料名称 <span class="req">*</span></label><input id="sName" type="text" autocomplete="off"></div>' +
      '<div class="field"><label>姓名 <span class="req">*</span></label><input id="sWho" type="text" autocomplete="off"></div>' +
      '<div class="field"><label>学号 <span class="req">*</span></label><input id="sSid" type="text" inputmode="numeric" autocomplete="off"></div>' +
      '<div class="field"><label>材料类别 <span class="req">*</span></label><select id="sCat"><option value="">请选择类别</option>' + catOptions + "</select></div>" +
      '<div class="field"><label>材料说明</label><textarea id="sNote"></textarea></div>' +
      '<div class="field"><label>附件</label><div class="file-line">' +
        '<input type="file" id="sFile" style="display:none">' +
        '<button class="btn" id="btnPick">选择文件</button>' +
        '<span class="fname" id="fileName">未选择文件</span>' +
        '<button class="btn" id="btnRemoveFile" style="display:none">移除</button></div></div>' +
      '<div class="err" id="sErr"></div>' +
      '<div class="form-actions"><button class="btn" id="btnClear">清空</button>' +
      '<button class="btn primary" id="btnSubmit">提交材料</button></div>' +
    "</div>";

  var $ = function(id){ return document.getElementById(id); };
  $("btnPick").onclick = function(){ $("sFile").click(); };
  $("sFile").onchange = function(e){
    if (e.target.files && e.target.files[0]) {
      submitFile = e.target.files[0].name;
      $("fileName").textContent = submitFile;
      $("btnRemoveFile").style.display = "";
    }
  };
  $("btnRemoveFile").onclick = function(){
    submitFile = ""; $("sFile").value = "";
    $("fileName").textContent = "未选择文件"; $("btnRemoveFile").style.display = "none";
  };
  $("btnClear").onclick = clearSubmit;
  $("btnSubmit").onclick = submitDoc;
}

function clearSubmit() {
  var filled = ["sName","sWho","sSid","sCat","sNote"].some(function(id){ return document.getElementById(id).value; }) || submitFile;
  var doClear = function(){
    ["sName","sWho","sSid","sNote"].forEach(function(id){ document.getElementById(id).value = ""; });
    document.getElementById("sCat").value = "";
    document.getElementById("sErr").textContent = "";
    document.getElementById("btnRemoveFile").click();
  };
  if (filled) confirmModal("清空确认", "当前已填写的内容将被清空，确定继续吗？", doClear);
  else doClear();
}

function submitDoc() {
  var name = clean(document.getElementById("sName").value);
  var who = clean(document.getElementById("sWho").value);
  var sid = clean(document.getElementById("sSid").value);
  var cat = clean(document.getElementById("sCat").value);
  var note = clean(document.getElementById("sNote").value);
  var errors = [];
  if (!name) errors.push("材料名称");
  if (!who) errors.push("姓名");
  if (!sid) errors.push("学号");
  else if (!/^\d+$/.test(sid)) errors.push("学号需为纯数字");
  else if (!(sid.length >= 4 && sid.length <= 12)) errors.push("学号长度应为 4-12 位");
  if (!cat) errors.push("材料类别");
  var errEl = document.getElementById("sErr");
  if (errors.length) { errEl.textContent = "请检查：" + errors.join("、"); return; }

  var dup = store.docs.some(function(d){ return d.sid === sid && d.name === name && d.cat === cat; });
  var doAdd = function(){
    try {
      addDoc({name:name, cat:cat, who:who, sid:sid, note:note, file:submitFile, scope:"全员"});
      addLog("提交", name, state.operatorName, roleLabel());
    } catch (e) { errEl.textContent = "提交失败：" + e.message; return; }
    ["sName","sWho","sSid","sNote"].forEach(function(id){ document.getElementById(id).value = ""; });
    document.getElementById("sCat").value = "";
    document.getElementById("btnRemoveFile").click();
    errEl.textContent = "";
    switchView("docs");
    toast("材料已提交，进入待审核列表");
  };
  if (dup) confirmModal("重复提交确认", "学号 " + sid + " 已提交过「" + name + "」，是否仍要再次提交？", doAdd);
  else doAdd();
}

/* ============ 操作日志与备份恢复 ============ */
var ACT_TAG = { "提交":"green", "归档":"green", "驳回":"red", "查看":"muted" };

function renderLogs() {
  var rows = listLogs();
  var trs = rows.map(function(l){
    var tag = ACT_TAG[l.act] || "orange";
    return "<tr><td>" + esc(l.time) + "</td><td>" + esc(l.who) + "</td><td>" + esc(l.role) +
      "</td><td><span class='tag " + tag + "'>" + esc(l.act) + "</span></td><td>" +
      esc(l.obj) + "</td><td>" + esc(l.src || "本机") + "</td></tr>";
  }).join("");
  var body = trs || '<tr><td colspan="6" class="empty">暂无操作记录，提交、归档、驳回等操作会自动记录在这里</td></tr>';

  document.getElementById("view-logs").innerHTML =
    '<div class="toolbar"><span class="hint" style="margin-left:0">共 ' + rows.length + " 条记录</span></div>" +
    '<div class="table-wrap"><table><colgroup><col style="width:18%"><col style="width:16%"><col style="width:12%"><col style="width:12%"><col><col style="width:12%"></colgroup>' +
    "<thead><tr><th>时间</th><th>操作人</th><th>角色</th><th>动作</th><th>对象</th><th>来源</th></tr></thead><tbody>" + body + "</tbody></table></div>" +
    '<div class="actions"><button class="btn" id="btnExport">导出备份</button>' +
    '<button class="btn" id="btnImport">导入备份</button>' +
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none"></div>';

  document.getElementById("btnExport").onclick = exportBackup;
  document.getElementById("btnImport").onclick = function(){ document.getElementById("importFile").click(); };
  document.getElementById("importFile").onchange = importBackup;
}

function exportBackup() {
  var blob = new Blob([JSON.stringify(backup(), null, 2)], {type:"application/json;charset=utf-8"});
  var a = document.createElement("a");
  var d = new Date();
  var stamp = d.getFullYear() + ("0"+(d.getMonth()+1)).slice(-2) + ("0"+d.getDate()).slice(-2);
  a.href = URL.createObjectURL(blob);
  a.download = "class-console-backup-" + stamp + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 200);
  toast("备份已导出");
}

function importBackup(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); }
    catch (err) { toast("导入失败：不是有效的 JSON 文件"); return; }
    if (!data || typeof data !== "object" || !Array.isArray(data.docs) || !Array.isArray(data.logs)) {
      toast("导入失败：备份结构不正确，docs / logs 应为列表"); return;
    }
    confirmModal("导入确认", "导入将覆盖本浏览器当前全部材料与操作日志，且不可撤销。确定继续导入吗？", function(){
      try { restore(data.docs, data.logs); }
      catch (err) { toast("导入失败：" + err.message); return; }
      refreshAll(); toast("备份数据已导入");
    });
  };
  reader.readAsText(file, "utf-8");
  e.target.value = "";
}

/* ============ 初始化 ============ */
function bindRole() {
  var radios = document.querySelectorAll('input[name="role"]');
  function syncLabel() {
    document.getElementById("roleAdmin").classList.toggle("on", state.role === "admin");
    document.getElementById("roleStudent").classList.toggle("on", state.role === "student");
    radios.forEach(function(r){ r.checked = (r.value === state.role); });
  }
  radios.forEach(function(r){
    r.onchange = function(){ state.role = r.value; syncLabel(); refreshAll(); };
  });
  syncLabel();
}

loadStore();
buildNav();
buildDocs();
buildSubmit();
bindRole();
switchView("dashboard");
</script>
</body>
