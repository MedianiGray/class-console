  document.querySelectorAll("#view-dashboard tbody tr.clickable").forEach(function(tr){
    tr.onclick = function(){ openDoc(Number(tr.dataset.id), "docs"); };
  });
  document.querySelectorAll("#view-dashboard tbody tr.clickable-roster").forEach(function(tr){
    tr.onclick = function(){ switchView("roster"); };
  });
}

function drillByStatus(status) {
  docsFilter.status = status;
  docsFilter.page = 1;
  switchView("docs");
}

/* ============ 材料台账：筛选 / 排序 / 分页 / 密度 ============ */
var STATUS_TAG = { "已归档": "green", "已驳回": "red", "待审核": "orange", "待补材料": "orange" };
var DOC_COLS = TYPES.doc.columns;
var COLS_KEY = "classconsole_web_cols";
function hiddenCols(){ try { return JSON.parse(localStorage.getItem(COLS_KEY)) || []; } catch(e){ return []; } }
function saveHiddenCols(arr){ try { localStorage.setItem(COLS_KEY, JSON.stringify(arr)); } catch(e){} }
function visibleCols(){ var h = hiddenCols(); return DOC_COLS.filter(function(c){ return h.indexOf(c.key) < 0; }); }

var FILTER_KEY = "classconsole_web_prefs";
var SIZE_OPTS = [10, 25, 50], DENS_OPTS = ["compact", "comfortable", "spacious"];
function loadPrefs(){ try { return JSON.parse(localStorage.getItem(FILTER_KEY)) || {}; } catch(e){ return {}; } }
function savePrefs(){
  var p = { q:docsFilter.q, cat:docsFilter.cat, type:docsFilter.type, status:docsFilter.status,
    sortKey:docsFilter.sortKey, sortDir:docsFilter.sortDir,
    pageSize:docsFilter.pageSize, density:docsFilter.density };
  try { localStorage.setItem(FILTER_KEY, JSON.stringify(p)); } catch(e){}
}
function applyPrefs(){
  var p = loadPrefs();
  if (typeof p.q === "string") docsFilter.q = p.q;
  if (p.cat) docsFilter.cat = p.cat;
  if (p.type) docsFilter.type = p.type;
  if (p.status) docsFilter.status = p.status;
  if (p.sortKey) docsFilter.sortKey = p.sortKey;
  if (p.sortDir) docsFilter.sortDir = p.sortDir;
  if (SIZE_OPTS.indexOf(p.pageSize) >= 0) docsFilter.pageSize = p.pageSize;
  if (DENS_OPTS.indexOf(p.density) >= 0) docsFilter.density = p.density;
}

function filteredDocs() {
  var q = clean(docsFilter.q).toLowerCase();
  var rows = visibleDocs(store.docs).filter(function(d){
    if (docsFilter.cat !== "全部" && d.cat !== docsFilter.cat) return false;
    if (docsFilter.type !== "全部" && (d.form_type || "general") !== docsFilter.type) return false;
    if (docsFilter.status !== "全部" && d.status !== docsFilter.status) return false;
    if (!q) return true;
    return [d.name, d.who, d.sid].some(function(f){ return clean(f).toLowerCase().indexOf(q) >= 0; });
  });
  var key = docsFilter.sortKey, dir = docsFilter.sortDir === "asc" ? 1 : -1;
  rows.sort(function(a, b){
    var va = a[key], vb = b[key];
    if (key === "sid") { va = String(va); vb = String(vb); }
    if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
    return String(va).localeCompare(String(vb), "zh") * dir;
  });
  return rows;
}

function buildDocs() {
  var catOpts = ["全部"].concat(CATS).map(function(c){
    var label = c === "全部" ? "全部类别" : c;
    return '<option value="' + esc(c) + '"' + (docsFilter.cat===c?" selected":"") + ">" + esc(label) + "</option>"; }).join("");
  var stOpts = STATUS_ALL.map(function(c){
    var label = c === "全部" ? "全部状态" : c;
    return '<option value="' + esc(c) + '"' + (docsFilter.status===c?" selected":"") + ">" + esc(label) + "</option>"; }).join("");
  var typeOpts = TYPE_OPTIONS.map(function(o){
    var label = o[0] === "全部" ? "全部类型" : o[1];
    return '<option value="' + o[0] + '"' + (docsFilter.type===o[0]?" selected":"") + ">" + esc(label) + "</option>"; }).join("");
  var sizeOpts = [10,25,50].map(function(n){
    return '<option value="' + n + '"' + (docsFilter.pageSize===n?" selected":"") + ">" + n + " 条/页</option>"; }).join("");
  var densOpts = [["compact","紧凑"],["comfortable","舒适"],["spacious","宽松"]].map(function(o){
    return '<option value="' + o[0] + '"' + (docsFilter.density===o[0]?" selected":"") + ">" + o[1] + "</option>"; }).join("");

  var colChecks = DOC_COLS.map(function(c){
    var h = hiddenCols();
    var on = h.indexOf(c.key) < 0 ? " checked" : "";
    return '<label><input type="checkbox" class="col-cb" data-key="' + c.key + '"' + on + ">" + esc(c.label) + "</label>";
  }).join("");

  document.getElementById("view-docs").innerHTML =
    '<div class="toolbar">' +
      '<div class="search-wrap">' + ICONS.search +
        "<input type='search' id='fQ' placeholder='搜索名称 / 姓名 / 学号' value='" + esc(docsFilter.q) + "' aria-label='搜索材料'></div>" +
      "<select id='fCat' title='按类别筛选'>" + catOpts + "</select>" +
      "<select id='fType' title='按材料类型筛选'>" + typeOpts + "</select>" +
      "<select id='fStatus' title='按状态筛选'>" + stOpts + "</select>" +
      '<div class="toolbar-right">' +
        '<span class="match-count" id="matchCount"></span>' +
        '<details class="view-menu" id="viewMenu"><summary>' + ICONS.sliders + '视图</summary><div class="panel">' +
          '<div class="vrow"><span>每页</span><select id="fSize">' + sizeOpts + '</select></div>' +
          '<div class="vrow"><span>密度</span><select id="fDensity">' + densOpts + '</select></div>' +
          '<div class="vrow"><span>列显示</span><div class="col-checks">' + colChecks + '</div></div>' +
        "</div></details>" +
      "</div></div>" +
    '<div class="chips" id="docChips"></div>' +
    '<div class="table-wrap" id="docsWrap"><table>' +
      '<colgroup><col style="width:36px"></colgroup>' +
      '<thead id="docsHead"></thead>' +
      '<tbody id="docsBody"></tbody></table></div>' +
    '<div class="pager" id="docPager"></div>' +
    '<div class="bulk-bar" id="bulkBar"></div>' +
    '<div class="actions" id="docsActions"></div>' +
    '<input type="file" id="csvImportFile" accept=".csv,.txt" style="display:none">';

  var vm = document.getElementById("viewMenu");
  if (vm) { vm.open = docsViewOpen; vm.ontoggle = function(){ docsViewOpen = !!vm.open; }; }

  var qInput = document.getElementById("fQ");
  var debounce = null;
  qInput.oninput = function(e){
    clearTimeout(debounce);
    debounce = setTimeout(function(){
      docsFilter.q = e.target.value; docsFilter.page = 1; renderDocs();
    }, 300);
  };
  document.getElementById("fCat").onchange = function(e){ docsFilter.cat = e.target.value; docsFilter.page = 1; renderDocs(); };
  document.getElementById("fType").onchange = function(e){ docsFilter.type = e.target.value; docsFilter.page = 1; renderDocs(); };
  document.getElementById("fStatus").onchange = function(e){ docsFilter.status = e.target.value; docsFilter.page = 1; renderDocs(); };
  document.getElementById("fSize").onchange = function(e){ docsFilter.pageSize = Number(e.target.value); docsFilter.page = 1; renderDocs(); };
  document.getElementById("fDensity").onchange = function(e){ docsFilter.density = e.target.value; renderDocs(); };
  document.querySelectorAll(".col-cb").forEach(function(cb){
    cb.onchange = function(){
      var h = hiddenCols(), key = cb.dataset.key;
      if (cb.checked) { var i = h.indexOf(key); if (i >= 0) h.splice(i, 1); }
      else if (h.indexOf(key) < 0) h.push(key);
      saveHiddenCols(h); renderDocs();
    };
  });
}

function cellValue(d, key) {
  if (key === "id") return d.time || "";
  if (key === "file") {
    var atts = d.attachments || [];
    return atts.length ? atts.length + " 个附件" : (d.file || "无附件");
  }
  return d[key] == null ? "" : d[key];
}
function renderCell(d, key) {
  var col = DOC_COLS.filter(function(c){ return c.key === key; })[0] || {};
  var cls = [];
  if (col.frozen === "l1") cls.push("sticky-l1");
  if (col.num) cls.push("num-col");
  var clsAttr = cls.length ? ' class="' + cls.join(" ") + '"' : "";
  if (col.tag === "status") {
    var tag = STATUS_TAG[d.status] || "orange";
    return '<td' + clsAttr + '><span class="tag ' + tag + '">' + esc(d.status) + "</span></td>";
  }
  return "<td" + clsAttr + ">" + esc(cellValue(d, key)) + "</td>";
}

function renderHead() {
  var cols = visibleCols();
  var thHtml = cols.map(function(c){
    var sticky = c.frozen === "l1" ? " sticky-l1" : "";
    if (!c.sortable) return "<th class='" + sticky.trim() + "'>" + esc(c.label) + "</th>";
    var ind = docsFilter.sortKey === c.key ? '<span class="sort-ind">' + (docsFilter.sortDir === "asc" ? "▲" : "▼") + "</span>" : "";
    return '<th class="sortable' + sticky + '" data-key="' + c.key + '">' + esc(c.label) + ind + "</th>";
  }).join("");
  var headCb = '<th class="sticky-l0"><input type="checkbox" class="cb" id="cbAll" aria-label="全选本页"></th>';
  document.getElementById("docsHead").innerHTML = "<tr>" + headCb + thHtml + "</tr>";
  document.querySelectorAll("#docsHead th.sortable").forEach(function(th){
    th.onclick = function(){
      var key = th.dataset.key;
      if (docsFilter.sortKey === key) {
        docsFilter.sortDir = docsFilter.sortDir === "asc" ? "desc" : "asc";
      } else {
        docsFilter.sortKey = key;
        docsFilter.sortDir = (key === "id") ? "desc" : "asc";
      }
      renderDocs();
    };
  });
}

function renderChips() {
  var chips = [];
  if (docsFilter.q) chips.push({label:"关键词", value:docsFilter.q, clear:function(){ docsFilter.q = ""; var i = document.getElementById("fQ"); if (i) i.value = ""; }});
  if (docsFilter.cat !== "全部") chips.push({label:"类别", value:docsFilter.cat, clear:function(){ docsFilter.cat = "全部"; }});
  if (docsFilter.type !== "全部") chips.push({label:"类型", value:TYPE_LABEL[docsFilter.type] || docsFilter.type, clear:function(){ docsFilter.type = "全部"; }});
  if (docsFilter.status !== "全部") chips.push({label:"状态", value:docsFilter.status, clear:function(){ docsFilter.status = "全部"; }});
  var box = document.getElementById("docChips");
  if (!chips.length) { box.innerHTML = ""; return; }
  box.innerHTML = chips.map(function(c, i){
    return '<span class="chip">' + esc(c.label) + "：<b>" + esc(c.value) + "</b>" +
      '<button data-i="' + i + '" aria-label="移除该条件">×</button></span>';
  }).join("") + '<button class="chip-clear" id="chipClear">清除全部筛选</button>';
  box.querySelectorAll(".chip button").forEach(function(b){
    b.onclick = function(){ chips[Number(b.dataset.i)].clear(); docsFilter.page = 1; syncFilterControls(); renderDocs(); };
  });
  document.getElementById("chipClear").onclick = function(){
    docsFilter.q = ""; docsFilter.cat = "全部"; docsFilter.type = "全部"; docsFilter.status = "全部"; docsFilter.page = 1;
    syncFilterControls(); renderDocs();
  };
}

function syncFilterControls() {
  var q = document.getElementById("fQ"); if (q) q.value = docsFilter.q;
  var c = document.getElementById("fCat"); if (c) c.value = docsFilter.cat;
  var t = document.getElementById("fType"); if (t) t.value = docsFilter.type;
  var s = document.getElementById("fStatus"); if (s) s.value = docsFilter.status;
  var g = document.getElementById("globalSearch");
  if (g && g !== document.activeElement) g.value = docsFilter.q;
}

function renderDocs() {
  renderHead();
  renderChips();
  syncFilterControls();
  var rows = filteredDocs();
  var canCreate = can("docs:create"), canExport = can("docs:export");
  var canImport = can("docs:import");
  var canArchive = can("docs:archive"), canReject = can("docs:reject");

  var total = rows.length;
  var mc = document.getElementById("matchCount");
  if (mc) mc.textContent = "匹配 " + total + " 条";
  var pages = Math.max(1, Math.ceil(total / docsFilter.pageSize));
  if (docsFilter.page > pages) docsFilter.page = pages;
  var start = (docsFilter.page - 1) * docsFilter.pageSize;
  var pageRows = rows.slice(start, start + docsFilter.pageSize);
  var rangeStart = total ? start + 1 : 0;
  var rangeEnd = Math.min(total, start + docsFilter.pageSize);

  var wrap = document.getElementById("docsWrap");
  wrap.className = "table-wrap density-" + docsFilter.density;

  var visCols = visibleCols();
  var trs = pageRows.map(function(d){
    var sel = d.id === state.selectedId ? " sel" : "";
    var cb = '<td class="sticky-l0"><input type="checkbox" class="cb" data-id="' + d.id + '"' +
      (state.selected[d.id] ? " checked" : "") + " aria-label=\"选择该材料\"></td>";
    var tds = visCols.map(function(c){ return renderCell(d, c.key); }).join("");
    return "<tr class='clickable" + sel + "' data-id='" + d.id + "'>" + cb + tds + "</tr>";
  }).join("");

  var applicantNoSid = state.role === "applicant" && !clean(state.applicantSid);
  var bodyEl = document.getElementById("docsBody");
  if (!total) {
    var headEmpty = store.docs.length === 0;
    var emptyTitle, emptySub;
    if (applicantNoSid) {
      emptyTitle = "请先填写申请人学号";
      emptySub = "在左侧「申请人学号」填写后，这里只显示你的材料";
    } else if (headEmpty) {
      emptyTitle = "还没有材料";
      emptySub = "点击下方「提交材料」录入第一条";
    } else {
      emptyTitle = "没有符合条件的材料";
      emptySub = "试试放宽搜索或清除筛选条件";
    }
    bodyEl.innerHTML = '<tr><td colspan="' + (1 + visCols.length) + '" class="empty">' +
      '<div class="empty-title">' + esc(emptyTitle) + '</div>' +
      '<div class="empty-sub">' + esc(emptySub) + '</div></td></tr>';
  } else {
    bodyEl.innerHTML = trs;
  }

  document.querySelectorAll("#docsBody tr.clickable").forEach(function(tr){
    tr.onclick = function(e){
      if (e.target && e.target.tagName === "INPUT") return;
      state.selectedId = Number(tr.dataset.id); renderDocs();
    };
    tr.ondblclick = function(){ openDoc(state.selectedId); };
  });

  /* 行复选框 + 表头全选三态 */
  document.querySelectorAll("#docsBody .cb").forEach(function(cb){
    cb.onclick = function(e){ e.stopPropagation(); };
    cb.onchange = function(e){
      e.stopPropagation();
      var id = Number(cb.dataset.id);
      if (cb.checked) state.selected[id] = true; else delete state.selected[id];
      renderDocs();
    };
  });
  var cbAll = document.getElementById("cbAll");
  var pageIds = pageRows.map(function(d){ return d.id; });
  var checkedOnPage = pageIds.filter(function(id){ return state.selected[id]; });
  cbAll.checked = pageIds.length > 0 && checkedOnPage.length === pageIds.length;
  cbAll.indeterminate = checkedOnPage.length > 0 && checkedOnPage.length < pageIds.length;
  cbAll.onchange = function(){
    pageIds.forEach(function(id){
      if (cbAll.checked) state.selected[id] = true; else delete state.selected[id];
    });
    renderDocs();
  };

  /* 分页条 */
  var pager = document.getElementById("docPager");
  pager.innerHTML =
    '<span class="pg-info">第 ' + rangeStart + "–" + rangeEnd + " 条，共 " + total + " 条</span>" +
    '<span class="spacer"></span>' +
    '<button class="btn mini" id="pgPrev" ' + (docsFilter.page <= 1 ? "disabled" : "") + ">上一页</button>" +
    '<span class="pg-info">' + docsFilter.page + " / " + pages + " 页</span>" +
    '<button class="btn mini" id="pgNext" ' + (docsFilter.page >= pages ? "disabled" : "") + ">下一页</button>";
  document.getElementById("pgPrev").onclick = function(){ if (docsFilter.page > 1) { docsFilter.page -= 1; renderDocs(); } };
  document.getElementById("pgNext").onclick = function(){ if (docsFilter.page < pages) { docsFilter.page += 1; renderDocs(); } };

  /* 操作条：行级主操作居左，导入导出等次级操作居右弱化 */
  var pickedIds = Object.keys(state.selected).map(Number).filter(function(id){ return findDoc(id); });
  if (state.selectedId != null && findDoc(state.selectedId) && pickedIds.indexOf(state.selectedId) < 0) pickedIds.push(state.selectedId);
  var pickedCount = pickedIds.length;
  var actions = '<button class="btn" id="btnView">查看详情</button>' +
    (canArchive ? '<button class="btn primary" id="btnArchive">归档</button>' : "") +
    (canReject ? '<button class="btn danger" id="btnReject">驳回</button>' : "") +
    '<span class="spacer"></span>' +
    (canExport ? '<button class="btn subtle mini" id="btnCsv">导出 CSV</button>' : "") +
    (canImport ? '<button class="btn subtle mini" id="btnCsvImport">导入 CSV</button>' : "") +
    '<span class="hint">已选 ' + pickedCount + " 条</span>";
  document.getElementById("docsActions").innerHTML = actions;

  var has = state.selectedId != null && findDoc(state.selectedId);
  document.getElementById("btnView").disabled = !has;
  var btnCsv = document.getElementById("btnCsv");
  if (btnCsv) btnCsv.onclick = exportCsv;
  var btnImp = document.getElementById("btnCsvImport");
  if (btnImp) btnImp.onclick = function(){ document.getElementById("csvImportFile").click(); };
  document.getElementById("csvImportFile").onchange = importCsv;
  var btnA = document.getElementById("btnArchive"), btnR = document.getElementById("btnReject");
  if (btnA) btnA.disabled = !has;
  if (btnR) btnR.disabled = !has;
  document.getElementById("btnView").onclick = function(){ openDoc(state.selectedId); };
  if (btnA) btnA.onclick = archiveSelected;
  if (btnR) btnR.onclick = rejectSelected;

  /* 批量操作栏 */
  var selIds = Object.keys(state.selected).map(Number).filter(function(id){ return findDoc(id); });
  var bulk = document.getElementById("bulkBar");
  if (selIds.length) {
    bulk.classList.add("show");
    bulk.innerHTML = '<span class="bulk-count">已选 ' + selIds.length + " 条</span>" +
      (canArchive ? '<button class="btn primary mini" id="bulkArchive">批量归档</button>' : "") +
      (canReject ? '<button class="btn danger mini" id="bulkReject">批量驳回</button>' : "") +
      '<span class="spacer"></span><button class="btn subtle mini" id="bulkClear">清除选择</button>';
    document.getElementById("bulkClear").onclick = function(){ state.selected = {}; renderDocs(); };
    var bA = document.getElementById("bulkArchive"), bR = document.getElementById("bulkReject");
    if (bA) bA.onclick = function(){ bulkDoc("archive"); };
    if (bR) bR.onclick = function(){ bulkDoc("reject"); };
  } else {
    bulk.classList.remove("show"); bulk.innerHTML = "";
  }
  savePrefs();
}

function bulkDoc(action) {
  var ids = Object.keys(state.selected).map(Number).filter(function(id){ return findDoc(id); });
  if (!ids.length) { toast("请先选择要处理的材料"); return; }
  var label = action === "archive" ? "归档" : "驳回";
  confirmModal(label + "确认", "确定将选中的 " + ids.length + " 条材料" + label + "吗？执行后写入操作日志。", function(){
    var ok = 0, fail = 0;
    ids.forEach(function(id){
      var d = findDoc(id);
      if (!d) { fail++; return; }
      if (action === "archive") archiveDoc(id); else rejectDoc(id);
      try { addLog(label, d.name, state.operatorName, roleLabel()); } catch(e){}
      ok++;
    });
    state.selected = {};
    refreshAll();
    toast("已" + label + " " + ok + " 条" + (fail ? "，" + fail + " 条未处理" : ""));
  });
}

/* ============ 详情抽屉 ============ */
function openDoc(id, from) {
  var d = findDoc(id);
  if (!d) { toast("请先在列表中选择一条材料"); return; }
  state.selectedId = id; state.drawerId = id;
  try { addLog("查看", d.name, state.operatorName, roleLabel()); } catch (e) {}
  renderDrawer(d);
  document.getElementById("drawer").classList.add("show");
  document.getElementById("drawerMask").classList.add("show");
  if (state.current !== "docs") renderDocs();
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("drawerMask").classList.remove("show");
  state.drawerId = null;
}

function latestDocLog(act, name){
  var rows = listLogs();
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].act === act && rows[i].obj === name) return rows[i];
  }
  return null;
}
function approvalNodesHtml(d){
  var submitLog = latestDocLog("提交", d.name);
  var archiveLog = latestDocLog("归档", d.name);
  var rejectLog = latestDocLog("驳回", d.name);
  var submitMeta = submitLog
    ? submitLog.time + " · " + submitLog.who + "（" + submitLog.role + "）"
    : (d.time || "时间未记录") + " · " + (d.who || "提交人");
  var html = '<div class="node"><span class="nd-dot"></span><div class="nd-main">' +
    '<div class="nd-t">提交 <span class="nd-time">' + esc(submitMeta) + "</span></div>" +
    '<div class="nd-d">' + esc(d.name) + " · " + esc(d.form_type ? formTemplate(d.form_type).label : "材料") + "</div></div></div>";

  if (d.status === "已归档") {
    var rMeta = archiveLog ? archiveLog.time + " · " + archiveLog.who + "（" + archiveLog.role + "）" : "时间与经办人未记录";
    html += '<div class="node"><span class="nd-dot"></span><div class="nd-main">' +
      '<div class="nd-t">审核 · 通过并归档 <span class="nd-time">' + esc(rMeta) + "</span></div>" +
      '<div class="nd-d">' + esc(d.reason || "经办人确认材料齐全，已归档。") + "</div></div></div>" +
      '<div class="node"><span class="nd-dot"></span><div class="nd-main">' +
      '<div class="nd-t">归档 · 已登记</div>' +
      '<div class="nd-d">本机浏览器已登记归档状态；文件本身仍留在原目录，路径未记录。</div></div></div>';
  } else if (d.status === "已驳回") {
    var jMeta = rejectLog ? rejectLog.time + " · " + rejectLog.who + "（" + rejectLog.role + "）" : "时间与经办人未记录";
    html += '<div class="node bad"><span class="nd-dot"></span><div class="nd-main">' +
      '<div class="nd-t">审核 · 已驳回 <span class="nd-time">' + esc(jMeta) + "</span></div>" +
      '<div class="nd-d">' + esc(d.reason || "未填写驳回原因。") + "</div></div></div>" +
      '<div class="node off"><span class="nd-dot"></span><div class="nd-main">' +
      '<div class="nd-t">归档 · 审核通过后登记</div>' +
      '<div class="nd-d">当前为驳回状态，补交并审核通过后才会归档。</div></div></div>';
  } else {
    html += '<div class="node off"><span class="nd-dot"></span><div class="nd-main">' +
      '<div class="nd-t">审核 · 等待经办人处理</div>' +
      '<div class="nd-d">通过后归档，驳回需填写补交原因，两种处理都会写入留痕。</div></div></div>' +

/* 通用动作管线：按类型配置校验角色、状态、确认文案，改状态并写留痕 */
function runAction(typeKey, id, actionKey) {
  var def = typeDef(typeKey);
  var act = def.actions.filter(function(a){ return a.key === actionKey; })[0];
  var d = findDoc(id);
  if (!act) { toast("未知操作"); return; }
  if (!d) { toast("请先选择一条" + def.label); return; }
  if (!can(act.perm)) { toast("当前视角无权执行该操作"); return; }
  if (d.status === act.to) { toast("该" + def.label + "已是" + act.to + "状态"); return; }
  showModal(act.label + "确认",
    "<div>" + act.confirm(d) + "</div>" +
    '<div class="field" style="margin-top:12px"><label>备注 / 原因（可选）</label>' +
    '<textarea id="actReason" rows="3" placeholder="驳回可写明缺什么材料；归档可补充说明"></textarea></div>',
    [
      {label:"取消", cls:"btn"},
      {label:act.label, cls:act.cls || "primary", onClick:function(){
        d.status = act.to;
        d.reason = clean(document.getElementById("actReason").value);
        saveStore();
        try { addLog(act.label, d.name, state.operatorName, roleLabel()); } catch(e){}
        refreshAll();
        if (state.drawerId != null && findDoc(state.drawerId)) renderDrawer(findDoc(state.drawerId));
        toast("已" + act.label + "，并写入操作日志");
      }}
    ]);
}
function archiveSelected() {

function rejectSelected() {

function renderExtraFields(ftype, preset) {
  var box = document.getElementById("sExtra");
  if (!box) return;
  var tpl = formTemplate(ftype);
  preset = preset || {};
  box.innerHTML = tpl.fields.map(function(f){
    var req = f.required ? ' <span class="req">*</span>' : "";
    var ctrl;
    if (f.type === "textarea") ctrl = '<textarea id="ex_' + f.key + '" rows="3"></textarea>';
    else if (f.type === "select") {
      var opts = (f.options || []).map(function(o){
        return "<option" + (o === f.options[0] ? " selected" : "") + ">" + esc(o) + "</option>";
      }).join("");
      ctrl = '<select id="ex_' + f.key + '">' + opts + "</select>";
    } else if (f.type === "date") {
      ctrl = '<input id="ex_' + f.key + '" type="date" autocomplete="off">';
    } else {
      ctrl = '<input id="ex_' + f.key + '" type="text" autocomplete="off">';
    }
    return '<div class="field"><label>' + esc(f.label) + req + "</label>" + ctrl +
      '<div class="ferr" id="eEx_' + f.key + '"></div></div>';
  }).join("");
  tpl.fields.forEach(function(f){
    var el = document.getElementById("ex_" + f.key);

function collectExtra() {

}

/* 按类型 schema 跑必填与格式校验，返回 {字段key: 报错文案} */
function validateRecord(typeKey, values) {
  var def = typeDef(typeKey), errs = {};
  def.fields.forEach(function(f){
    var v = clean(values[f.key]);
    if (f.required && !v) { errs[f.key] = (f.type === "select" ? "请选择" : "请填写") + f.label; return; }
    if (f.type === "sid" && v) {
      if (!/^\d+$/.test(v)) errs[f.key] = "学号需为纯数字";
      else if (!(v.length >= 4 && v.length <= 12)) errs[f.key] = "学号长度应为 4-12 位";
    }
  });
  return errs;
}

function submitDoc() {
  var name = clean(document.getElementById("sName").value);
  var who = clean(document.getElementById("sWho").value);
  var sid = clean(document.getElementById("sSid").value);
  var cat = clean(document.getElementById("sCat").value);
  var code = clean(document.getElementById("sCode").value);

  if (!name) errs.name = "请填写材料名称";
  if (!cat) errs.cat = "请选择材料类别";
  if (ftype === "general") {
    if (!who) errs.who = "请填写姓名";
    if (!sid) errs.sid = "请填写学号";
    else if (!/^\d+$/.test(sid)) errs.sid = "学号需为纯数字";
    else if (!(sid.length >= 4 && sid.length <= 12)) errs.sid = "学号长度应为 4-12 位";
  } else if (sid && (!/^\d+$/.test(sid) || !(sid.length >= 4 && sid.length <= 12))) {
    errs.sid = "学号格式不正确";

  var extraErrs = validateExtra(extra);

  setFieldErr("eName", errs.name);
  setFieldErr("eWho", errs.who);

  Object.keys(extraErrs).forEach(function(k){ setFieldErr("eEx_" + k, extraErrs[k]); });

  if (Object.keys(errs).length || Object.keys(extraErrs).length) { errEl.textContent = ""; return; }

  var dup = store.docs.some(function(d){ return d.sid === sid && d.name === name && d.cat === cat; });

/* ============ 文件夹收集视图（目录扫描 + 变化记录） ============ */
var watch = {
  dirHandle: null, dirName: "", baseline: {}, timer: null, scanning: false,
  items: [], removed: [], selected: {},
  fsSupported: (typeof window !== "undefined" && typeof window.showDirectoryPicker === "function")
};
var WATCH_TAG = {
  new: ["orange", "未登记·新增"], changed: ["blue", "已修改"],
  registered: ["muted", "已登记"], kept: ["muted", "无变化"]
};

function buildCollect() {

  var pickBtn = watch.fsSupported
    ? '<button class="btn primary" id="cPick">选择监视文件夹</button>'
    : '<button class="btn" id="cPickLegacy">选择文件夹（一次性读取）</button>';
  var watchCtl = watch.fsSupported
    ? '<label class="watch-toggle"><input type="checkbox" id="cWatch"> 每 10 秒自动扫描</label>' : "";
  document.getElementById("view-collect").innerHTML =
    '<div class="card panel collect-head">' +
      '<div class="collect-toolbar">' + pickBtn +
        "<label>默认类别</label><select id=\"cCat\">" + catOpts + "</select>" + watchCtl +
        '<button class="btn subtle mini" id="cRescan" style="display:none">重新扫描</button>' +
      "</div>" +
      '<div class="collect-status" id="cStatus">尚未选择文件夹</div>' +
      '<div class="collect-note hint" id="cNote"></div>' +
    "</div>" +
    '<div class="table-wrap"><table>' +
      '<colgroup><col style="width:36px"><col><col style="width:110px"><col style="width:150px"><col style="width:120px"></colgroup>' +
      "<thead><tr><th></th><th>文件</th><th>大小</th><th>修改时间</th><th>比对结果</th></tr></thead>" +
      '<tbody id="cBody"></tbody></table></div>' +
    '<div class="actions" id="cActions"></div>' +
    '<input type="file" id="cLegacy" webkitdirectory="" style="display:none">';

  var $ = function(id){ return document.getElementById(id); };
  var saved = loadWatch();
  watch.dirName = saved.dirName; watch.baseline = saved.baseline;

  if (watch.fsSupported) {
    $("cPick").onclick = pickDirectory;
  } else {
    $("cPickLegacy").onclick = function(){ $("cLegacy").click(); };
    $("cLegacy").onchange = onLegacyPick;
  }
  $("cRescan").onclick = function(){ scanDirectory(); };
  var wt = $("cWatch");
  if (wt) wt.onchange = function(){ if (wt.checked) startWatch(); else stopWatch(); };
}

async function pickDirectory() {
  if (typeof window.showDirectoryPicker !== "function") { toast("当前浏览器不支持目录访问"); return; }
  try {
    var handle = await window.showDirectoryPicker({ mode: "read" });
    var perm = await handle.requestPermission({ mode: "read" });
    if (perm !== "granted") { toast("未授予文件夹读取权限"); return; }
    watch.dirHandle = handle; watch.dirName = handle.name; watch.selected = {};
    await scanDirectory();
  } catch (e) {
    if (e && e.name === "AbortError") return; /* 用户取消选择 */
    toast("选择文件夹失败：" + ((e && e.message) || e));
  }
}

async function readDirEntries(handle) {
  var out = [];
  for await (var entry of handle.values()) {
    var name = entry[0], h = entry[1];
    if (h.kind !== "file") continue;
    if (WATCH_SKIP_PREFIX.some(function(p){ return name.indexOf(p) === 0; })) continue;
    try {
      var f = await h.getFile();
      out.push({ rel: name, name: name, size: f.size, mtime: f.lastModified });
    } catch (e) { /* 单个文件读取失败则跳过 */ }
  }
  out.sort(function(a, b){ return a.name.localeCompare(b.name, "zh-CN"); });
  return out;
}

async function scanDirectory() {
  if (!watch.dirHandle) { renderCollect(); return; }
  watch.scanning = true; renderCollect();
  var entries;
  try {
    var perm = await watch.dirHandle.queryPermission({ mode: "read" });
    if (perm !== "granted") perm = await watch.dirHandle.requestPermission({ mode: "read" });
    if (perm !== "granted") {
      toast("文件夹权限已失效，请重新选择"); stopWatch(); watch.scanning = false; renderCollect(); return;
    }
    entries = await readDirEntries(watch.dirHandle);
  } catch (e) {
    watch.scanning = false; toast("读取文件夹失败：" + ((e && e.message) || e)); renderCollect(); return;
  }
  applyScan(entries);
  watch.scanning = false; renderCollect();
}

function applyScan(entries) {
  var firstRun = Object.keys(watch.baseline).length === 0;
  var reg = watchRegisteredSet();
  var cmp = compareWatch(entries, watch.baseline, reg);
  watch.items = cmp.items; watch.removed = cmp.removed;
  var c = cmp.counts;
  if (!firstRun && watch.dirName && (c.new || c.changed || c.removed)) {
    var parts = [];
    if (c.new) parts.push("新增 " + c.new);
    if (c.changed) parts.push("修改 " + c.changed);
    if (c.removed) parts.push("删除 " + c.removed);
    try { addLog("目录监听", watch.dirName + "：" + parts.join(" · "), state.operatorName, roleLabel(), "网页目录"); } catch (e) {}
  }
  watch.baseline = watchSnapshotOf(entries);
  saveWatch(watch.dirName, watch.baseline, nowStr());
}

function onLegacyPick(e) {
  var files = e.target.files || [];
  var entries = [];
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (WATCH_SKIP_PREFIX.some(function(p){ return f.name.indexOf(p) === 0; })) continue;
    entries.push({ rel: f.webkitRelativePath || f.name, name: f.name, size: f.size, mtime: f.lastModified });
  }
  watch.dirName = entries.length ? String(entries[0].rel).split("/")[0] : "";
  watch.baseline = loadWatch().baseline;
  applyScan(entries);
  toast("已一次性读取 " + entries.length + " 个文件（当前浏览器不支持后台监视）");
  renderCollect();
}

function watchImportable(it){ return it.state === "new" || it.state === "changed"; }

function renderCollect() {
  var $ = function(id){ return document.getElementById(id); };
  var statusEl = $("cStatus"), noteEl = $("cNote"), bodyEl = $("cBody"), actEl = $("cActions");
  if (!bodyEl) return;

  var last = loadWatch().updatedAt;
  if (watch.dirName) {
    statusEl.textContent = "监视目录：" + watch.dirName + (last ? " · 上次扫描 " + last : "") +
      " · 现存 " + watch.items.length + " 个文件";
    $("cRescan").style.display = "";
  } else {
    statusEl.textContent = "尚未选择文件夹";
    $("cRescan").style.display = "none";
  }
  noteEl.textContent = watch.fsSupported
    ? "页面打开期间按快照比对目录变化；页面关闭期间的变动，下次扫描时补录。仅登记文件名、大小与修改时间，不复制文件内容，也不读取磁盘绝对路径。"
    : "当前浏览器不支持目录后台访问，仅可一次性选择目录读取比对；如需自动监视，请使用 Chrome / Edge。";

  var rows = watch.items.map(function(it){
    var tag = WATCH_TAG[it.state] || ["muted", it.state];
    var canCheck = watchImportable(it);
    var checked = watch.selected[it.rel] ? " checked" : "";
    var cb = canCheck
      ? '<input type="checkbox" class="cb" data-rel="' + esc(it.rel) + '"' + checked + " aria-label=\"选择文件\">"
      : '<input type="checkbox" class="cb" disabled>';
    return '<tr data-rel="' + esc(it.rel) + '"><td>' + cb + "</td>" +
      '<td class="file-cell">' + esc(it.name) + "</td>" +
      '<td class="num-col">' + watchHumanSize(it.size) + "</td>" +
      "<td>" + esc(watchFmtMtime(it.mtime)) + "</td>" +
      '<td><span class="tag ' + tag[0] + '">' + esc(tag[1]) + "</span></td></tr>";
  });
  watch.removed.forEach(function(it){
    rows.push('<tr class="row-removed" data-rel="' + esc(it.rel) + '"><td><input type="checkbox" class="cb" disabled></td>' +
      '<td class="file-cell">' + esc(it.name) + "</td>" +
      '<td class="num-col">' + watchHumanSize(it.size) + "</td>" +
      "<td>" + esc(watchFmtMtime(it.mtime)) + "</td>" +
      '<td><span class="tag red">已删除</span></td></tr>');
  });
  bodyEl.innerHTML = rows.length ? rows.join("")
    : '<tr><td colspan="5" class="empty"><div class="empty-title">暂无文件</div><div class="empty-sub">选择文件夹后，这里列出扫描到的文件与比对结果</div></td></tr>';

  bodyEl.querySelectorAll("tr[data-rel]").forEach(function(tr){
    var rel = tr.dataset.rel;
    var it = watch.items.find(function(x){ return x.rel === rel; });
    if (!it || !watchImportable(it)) return;
    tr.onclick = function(){
      watch.selected[rel] = !watch.selected[rel];
      renderCollect();
    };
  });
  bodyEl.querySelectorAll(".cb[data-rel]").forEach(function(cb){
    cb.onchange = function(e){
      e.stopPropagation();
      var rel = cb.dataset.rel;
      if (cb.checked) watch.selected[rel] = true; else delete watch.selected[rel];
      renderCollect();
    };
  });

  var chosen = watch.items.filter(function(it){ return watch.selected[it.rel] && watchImportable(it); });
  var canCreate = can("docs:create");
  actEl.innerHTML =
    '<button class="btn primary" id="cImport" ' + (chosen.length && canCreate ? "" : "disabled") + ">将所选入账（自动编号）</button>" +
    '<span class="hint">仅登记文件名与路径，不移动或复制原文件</span>' +
    '<span class="hint" style="margin-left:auto">待入账 ' + chosen.length + " 个</span>";
  var btn = $("cImport");
  if (btn) btn.onclick = importSelected;
}

function importSelected() {
  if (!can("docs:create")) { toast("当前视角无权执行该操作"); return; }
  var chosen = watch.items.filter(function(it){ return watch.selected[it.rel] && watchImportable(it); });
  if (!chosen.length) { toast("没有可入账的新文件"); return; }
  var cat = clean(document.getElementById("cCat").value) || CATS[0];
  confirmModal("批量入账确认", "将把 " + chosen.length + " 份文件按「" + cat + "」入账并自动编号；提交人先记为「待补」，可稍后在台账补全。", function(){
    var ok = 0;
    chosen.forEach(function(it){
      try {
        addDoc({ name: watchBaseName(it.name), cat: cat, who: "待补", sid: "",
          note: "文件夹收集：" + watch.dirName, file: it.name, path: it.rel, scope: "全员",
          attachments: [{ name: it.name, path: it.rel, kind: "" }] });
        ok++;
      } catch (e) {}
    });
    if (ok) { try { addLog("收集入账", ok + " 份文件", state.operatorName, roleLabel(), "网页目录"); } catch (e) {} }
    watch.selected = {};
    var reg = watchRegisteredSet();
    watch.items.forEach(function(it){ if (reg[it.name]) it.state = "registered"; });
    saveWatch(watch.dirName, watch.baseline, nowStr());
    toast("已入账 " + ok + " 份材料并自动编号");
    refreshAll();
  });
}

function startWatch() {
  if (watch.timer) return;
  watch.timer = setInterval(function(){ if (!watch.scanning) scanDirectory(); }, 10000);
  toast("已开启自动扫描，每 10 秒比对一次");
}
function stopWatch() {
  if (watch.timer) { clearInterval(watch.timer); watch.timer = null; }
  var wt = document.getElementById("cWatch"); if (wt) wt.checked = false;
}

/* ============ 名单核对视图 ============ */
function parseRosterText(text) {
  var rows = [];
  String(text).split(/\r?\n/).forEach(function(line){
    line = line.trim(); if (!line) return;
    var parts = line.split(/[,，\t]/).map(function(x){ return x.trim(); }).filter(Boolean);
    if (parts.length >= 2) rows.push({ sid: parts[0], who: parts[1] });
  });
  return rows;
}
function copyText(text, msg) {
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = text;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, function(){ fallback(); toast(msg); });
  } else { fallback(); toast(msg); }
}

function renderRoster() {
  var canManage = can("roster:manage");
  var chk = rosterCheck();
  var rows = listRoster();
  var submitted = {}, rejected = {};
  store.docs.forEach(function(d){
    if (!d.sid) return;
    if (d.status === "待审核" || d.status === "已归档") submitted[d.sid] = true;
    else if (d.status === "已驳回") rejected[d.sid] = true;
  });

  var cards = [
    {label:"应交人数", num:chk.total, color:"var(--muted)"},
    {label:"已交人数", num:chk.done,  color:"var(--green)"},
    {label:"未交人数", num:chk.absent.length, color:"var(--red)"}
  ].map(function(c){
    return '<div class="card stat-card" style="cursor:default"><div class="num">' + c.num +
      '</div><div class="lbl" style="color:' + c.color + '"><span class="dot"></span>' + c.label + "</div></div>";
  }).join("");

  var trs = rows.map(function(r){
    var ok = submitted[r.sid];
    var tag = ok ? '<span class="tag green">已交</span>'
      : (rejected[r.sid] ? '<span class="tag orange">需补交</span>' : '<span class="tag orange">未交</span>');
    var delCell = canManage ? '<button class="btn subtle mini rb-del" data-id="' + r.id + '">移除</button>' : '<span class="muted">—</span>';
    return "<tr><td class='num-col'>" + esc(r.sid) + "</td><td>" + esc(r.who) + "</td><td>" + tag + "</td>" +
      "<td>" + delCell + "</td></tr>";
  }).join("");
  var body = trs || '<tr><td colspan="4" class="empty"><div class="empty-title">名单为空</div>' +
    '<div class="empty-sub">点上方「添加一人」或「导入名单」建立班级名单</div></td></tr>';

  var absentHtml = chk.absent.length ? chk.absent.map(function(r){
    return "<li>" + esc(r.who) + "（" + esc(r.sid) + "）</li>";
  }).join("") : '<div class="empty" style="padding:14px 0">所有人都已提交材料</div>';

  var extraSids = [];
  var extraRows = chk.extra.filter(function(d){
    if (extraSids.indexOf(d.sid) < 0) { extraSids.push(d.sid); return true; } return false;
  });
  var extraHtml = extraRows.length ? extraRows.map(function(d){
    return "<li>" + esc(d.who) + "（" + esc(d.sid) + "）· " + esc(d.name) + "</li>";
  }).join("") : '<div class="empty" style="padding:10px 0">材料提交人均在名单内</div>';

  document.getElementById("view-roster").innerHTML =
    '<div class="toolbar">' +
      (canManage ? '<button class="btn primary" id="rbAdd">添加一人</button>' +
                '<span class="spacer"></span>' +
                '<button class="btn subtle mini" id="rbImport">导入名单</button>' +
                '<button class="btn danger mini" id="rbClear">清空名单</button>' : "") +
      '<span class="hint">名单仅存本浏览器，随备份导出</span></div>' +
    '<div class="cards" style="grid-template-columns:repeat(3,1fr)">' + cards + "</div>" +
    '<div class="grid-2">' +
      '<div class="card panel"><h3>班级名单（' + rows.length + "）</h3>" +
        '<div class="table-wrap"><table><colgroup><col style="width:26%"><col><col style="width:18%"><col style="width:18%"></colgroup>' +
        "<thead><tr><th>学号</th><th>姓名</th><th>提交情况</th><th>操作</th></tr></thead><tbody>" + body + "</tbody></table></div>" +
      "</div>" +
      "<div>" +
        '<div class="card panel"><h3>未交清单（' + chk.absent.length + "）</h3><ul class=\"trace\">" + absentHtml + "</ul>" +
          (chk.absent.length ? '<div class="actions"><button class="btn subtle mini" id="rbCopy">复制催办文本</button></div>' : "") +
        "</div>" +
        '<div class="card panel" style="margin-top:14px"><h3>名单外的材料提交人</h3><ul class="trace">' + extraHtml + "</ul></div>" +
      "</div>" +
    "</div>";

  var rbA = document.getElementById("rbAdd"), rbI = document.getElementById("rbImport"), rbC = document.getElementById("rbClear");
  if (rbA) rbA.onclick = rosterAddModal;
  if (rbI) rbI.onclick = rosterImportModal;
  if (rbC) rbC.onclick = rosterClear;
  var copyBtn = document.getElementById("rbCopy");
  if (copyBtn) copyBtn.onclick = function(){
    var txt = chk.absent.map(function(r){ return r.who + "（" + r.sid + "）"; }).join("、");
    copyText("以下同学尚未提交材料：" + txt, "未交清单已复制");
  };
  document.querySelectorAll(".rb-del").forEach(function(b){
    b.onclick = function(){ removeRoster(Number(b.dataset.id)); refreshAll(); toast("已从名单移除"); };
  });
}

function rosterAddModal() {
  showModal("添加名单",
    '<div class="field"><label>学号</label><input id="roSid" type="text" inputmode="numeric" autocomplete="off"></div>' +
    '<div class="field"><label>姓名</label><input id="roWho" type="text" autocomplete="off"></div>' +
    '<div class="err" id="roErr"></div>',
    [
      {label:"取消", cls:"btn"},
      {label:"添加", cls:"btn primary", onClick:function(){
        var sid = clean(document.getElementById("roSid").value), who = clean(document.getElementById("roWho").value);
        try { addRoster(sid, who); }
        catch(e){ document.getElementById("roErr").textContent = e.message; return; }
        refreshAll(); toast("已加入名单");
      }}
    ]);
}
function rosterImportModal() {
  showModal("批量导入名单",
    '<p class="hint" style="margin-bottom:10px">每行一条，格式：学号,姓名（逗号或制表符分隔）；也可选择 CSV / TXT 文件。</p>' +
    '<textarea id="roImportText" rows="6" placeholder="250201,覃祖悦&#10;250203,李雨桐"></textarea>' +
    '<input type="file" id="roImportFile" accept=".csv,.txt" style="display:none">' +
    '<div class="actions"><button class="btn" id="roPickFile">选择 CSV / TXT 文件</button></div>' +
    '<div class="err" id="roImportErr"></div>',
    [
      {label:"取消", cls:"btn"},
      {label:"导入", cls:"btn primary", onClick:applyRosterImport}
    ]);
  document.getElementById("roPickFile").onclick = function(){ document.getElementById("roImportFile").click(); };
  document.getElementById("roImportFile").onchange = function(e){
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){ document.getElementById("roImportText").value = reader.result; };
    reader.readAsText(f, "utf-8"); e.target.value = "";
  };
}
function applyRosterImport() {
  var rows = parseRosterText(document.getElementById("roImportText").value);
  if (!rows.length) { document.getElementById("roImportErr").textContent = "未解析到有效行"; return; }
  var added = 0, dup = 0, bad = 0;
  rows.forEach(function(r){
    try { addRoster(r.sid, r.who); added++; }
    catch(e){ if (/已在名单/.test(e.message)) dup++; else bad++; }
  });
  refreshAll();
  toast("导入完成：新增 " + added + " 人" + (dup ? "，重复 " + dup : "") + (bad ? "，失败 " + bad : ""));
}
function rosterClear() {
  if (!store.roster.length) { toast("名单已是空的"); return; }
  confirmModal("清空名单", "确定清空全部 " + store.roster.length + " 名名单成员吗？此操作不可撤销。", function(){
    store.roster = []; saveStore(); refreshAll(); toast("名单已清空");
  });
}

/* ============ 任务 / 截止跟踪视图 ============ */
function renderTasks() {
  var canManage = can("task:manage");
  var st = taskStats();
  var rows = listTasks();
  var cards = [
    {label:"进行中",    num:st.ongoing, color:"var(--muted)"},
    {label:"临期(≤2天)", num:st.due,    color:"var(--orange)"},
    {label:"已逾期",    num:st.overdue, color:"var(--red)"},
    {label:"已完成",    num:st.done,    color:"var(--green)"}
  ].map(function(c){
    return '<div class="card stat-card" style="cursor:default"><div class="num">' + c.num +
      '</div><div class="lbl" style="color:' + c.color + '"><span class="dot"></span>' + c.label + "</div></div>";
  }).join("");

  var trs = rows.map(function(t){
    var left = daysUntil(t.deadline);
    var mark;
    if (t.done) mark = '<span class="tag green">已完成</span>';
    else if (left < 0) mark = '<span class="tag red">已逾期 ' + (-left) + " 天</span>";
    else if (left <= 2) mark = '<span class="tag orange">临期</span>';
    else mark = '<span class="tag">进行中</span>';
    var leftText = left == null ? "—" : (left < 0 ? "逾期 " + (-left) + " 天" :
      left === 0 ? "今天截止" : left === 1 ? "明天截止" : "剩 " + left + " 天");
    return "<tr><td>" + esc(t.title) + "</td><td>" + esc(t.cat || "—") + "</td><td class='num-col'>" +
      esc(t.deadline) + "</td><td>" + mark + "</td>" +
      '<td><button class="btn mini tg-toggle" data-id="' + t.id + '">' + (t.done ? "还原" : "完成") + "</button>" +
      (canManage ? ' <button class="btn subtle mini tg-edit" data-id="' + t.id + '">编辑</button> ' +
      '<button class="btn danger mini tg-del" data-id="' + t.id + '">删除</button>' : "") + "</td></tr>";
  }).join("");
  var body = trs || '<tr><td colspan="5" class="empty"><div class="empty-title">暂无任务</div>' +
    '<div class="empty-sub">点上方「添加任务」登记要收的材料事项与截止日期</div></td></tr>';

  document.getElementById("view-tasks").innerHTML =
    '<div class="toolbar">' +
    (canManage ? '<button class="btn primary" id="taskAdd">添加任务</button>' : "") +
    '<span class="hint" style="margin-left:auto">任务与截止提醒仅存本浏览器，随备份导出</span></div>' +
    '<div class="cards" style="grid-template-columns:repeat(4,1fr)">' + cards + "</div>" +
    '<div class="card panel"><div class="table-wrap"><table><colgroup><col><col style="width:18%"><col style="width:18%"><col style="width:18%"><col></colgroup>' +
    "<thead><tr><th>任务标题</th><th>类别</th><th>截止日期</th><th>状态</th><th>操作</th></tr></thead><tbody>" + body + "</tbody></table></div></div>";

  var tAdd = document.getElementById("taskAdd");
  if (tAdd) tAdd.onclick = function(){ taskModal(null); };
  document.querySelectorAll(".tg-toggle").forEach(function(b){
    b.onclick = function(){ toggleTask(Number(b.dataset.id)); refreshAll(); };
  });
  document.querySelectorAll(".tg-edit").forEach(function(b){
    b.onclick = function(){ taskModal(Number(b.dataset.id)); };
  });
  document.querySelectorAll(".tg-del").forEach(function(b){
    b.onclick = function(){
      var t = findTask(Number(b.dataset.id));
      confirmModal("删除任务", "确定删除任务「" + (t ? t.title : "") + "」吗？", function(){
        removeTask(Number(b.dataset.id)); refreshAll(); toast("任务已删除");
      });
    };
  });
}

        };

  var rows = builtinRows + extraRows;

  var addHtml = canCfg

        '<input id="tplFieldLabel" type="text" maxlength="16" placeholder="字段名称，例如 佐证材料" autocomplete="off">' +
        '<select id="tplFieldType">' + TPL_TYPES.map(function(t){ return '<option value="' + t[0] + '">' + esc(t[1]) + "</option>"; }).join("") + "</select>" +
        '<label class="tpl-req"><input type="checkbox" id="tplFieldReq"> 必填</label>' +
        '<button class="btn primary" id="tplAdd">添加字段</button>' +
      "</div>" +
      '<div class="tpl-add-sub"><input id="tplFieldOptions" type="text" placeholder="下拉选项，用逗号分隔；仅下拉类型需要" autocomplete="off">' +

    : '<div class="tpl-note">当前视角可查看模板字段；修改需经办人、审核者或汇总者岗位。</div>';

          '<div class="ph-side"><button class="btn subtle mini" id="tplToSubmit">去提交表单</button></div></div>' +
        '<table class="tpl-table"><colgroup><col style="width:34%"><col style="width:20%"><col style="width:12%"><col></colgroup>' +
        "<thead><tr><th>字段</th><th>类型</th><th>必填</th><th>来源 / 操作</th></tr></thead>" +
        "<tbody>" + (rows || '<tr><td colspan="4" class="tpl-empty">暂无字段</td></tr>') + "</tbody></table>" +
        addHtml +
      "</div></div>";

  document.querySelectorAll(".tpl-kind").forEach(function(b){
    b.onclick = function(){ state.tplType = b.dataset.kind; renderTemplates(); };
  });
  var toSubmit = document.getElementById("tplToSubmit");
  if (toSubmit) toSubmit.onclick = function(){ switchView("submit"); };
  var addBtn = document.getElementById("tplAdd");
  if (addBtn) addBtn.onclick = function(){
    var err = document.getElementById("tplErr");
    try {
      addTemplateField(kind, {
        label: document.getElementById("tplFieldLabel").value,
        type: document.getElementById("tplFieldType").value,
        required: document.getElementById("tplFieldReq").checked,
        options: clean(document.getElementById("tplFieldOptions").value).split(/[,，]/)
      });
    } catch(e) {
      if (err) err.textContent = e.message;
      return;
    }
    state.tplDirty = true;
    refreshAll();
    toast("已添加字段，提交表单与详情立即生效");
  };
  document.querySelectorAll(".tpl-del").forEach(function(b){
    b.onclick = function(){
      var key = b.dataset.key;
      confirmModal("删除字段", "删除后该字段不再出现在表单和详情中；已填过的历史内容仍保留在数据里。确定删除吗？", function(){
        try { removeTemplateField(kind, key); }
        catch(e) { toast(e.message); return; }

      });
    };
  });
}

/* ============ 操作日志与备份恢复 ============ */
var ACT_TAG = { "提交":"green", "归档":"green", "驳回":"red", "查看":"muted", "修改":"orange" };

function renderLogs() {
  var canBackup = can("backup:restore");
  var rows = listLogs();
  var trs = rows.map(function(l){
    var tag = ACT_TAG[l.act] || "orange";
    return "<tr><td>" + esc(l.time) + "</td><td>" + esc(l.who) + "</td><td>" + esc(l.role) +
      "</td><td><span class='tag " + tag + "'>" + esc(l.act) + "</span></td><td>" +
      esc(l.obj) + "</td><td>" + esc(l.src || "本机") + "</td></tr>";
  }).join("");
  var body = trs || '<tr><td colspan="6" class="empty"><div class="empty-title">暂无操作记录</div>' +
    '<div class="empty-sub">提交、归档、驳回等操作会自动记录在这里</div></td></tr>';

  document.getElementById("view-logs").innerHTML =
    '<div class="toolbar"><span class="hint" style="margin-left:0">共 ' + rows.length + " 条记录</span></div>" +
    '<div class="table-wrap"><table><colgroup><col style="width:18%"><col style="width:16%"><col style="width:12%"><col style="width:12%"><col><col style="width:12%"></colgroup>' +
    "<thead><tr><th>时间</th><th>操作人</th><th>角色</th><th>动作</th><th>对象</th><th>来源</th></tr></thead><tbody>" + body + "</tbody></table></div>" +
    '<div class="actions"><button class="btn" id="btnExport">导出备份</button>' +
    (canBackup ? '<button class="btn" id="btnImport">导入备份</button>' : "") +
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none"></div>';

  document.getElementById("btnExport").onclick = exportBackup;
  var btnImp = document.getElementById("btnImport");
  if (btnImp) btnImp.onclick = function(){ document.getElementById("importFile").click(); };
  document.getElementById("importFile").onchange = importBackup;
}

function exportBackup() {
  var blob = new Blob([JSON.stringify(backup(), null, 2)], {type:"application/json;charset=utf-8"});
  var a = document.createElement("a");
  var d = new Date();
  var stamp = d.getFullYear() + ("0"+(d.getMonth()+1)).slice(-2) + ("0"+d.getDate()).slice(-2);
  a.href = URL.createObjectURL(blob);
  a.download = "class-console-backup-" + stamp + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 200);
  toast("备份已导出");
}

function csvCell(v) {
  v = clean(v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function exportCsv() {
  var rows = filteredDocs();
  if (!rows.length) { toast("当前没有可导出的材料"); return; }
  var head = ["材料编号","材料类型","材料名称","类别","提交人","学号","提交时间","状态","附件","说明"];
  var lines = [head.map(csvCell).join(",")];
  rows.forEach(function(d){
    var tpl = formTemplate(d.form_type);
    var atts = d.attachments || [];
    var attNames = atts.map(function(a){ return a.name || ""; }).join("; ") || d.file || "";
    lines.push([d.code || "", tpl.label, d.name, d.cat, d.who, d.sid, d.time, d.status, attNames, d.note || ""].map(csvCell).join(","));
  });
  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  var d = new Date();
  var stamp = d.getFullYear() + ("0"+(d.getMonth()+1)).slice(-2) + ("0"+d.getDate()).slice(-2) +
    "-" + ("0"+d.getHours()).slice(-2) + ("0"+d.getMinutes()).slice(-2);
  a.href = URL.createObjectURL(blob);
  a.download = "class-console-" + stamp + ".csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 200);
  toast("已导出 " + rows.length + " 条");
}

/* CSV 解析：支持引号包裹、引号内逗号与换行、双引号转义 */
function parseCsv(text) {
  var rows = [], row = [], cell = "", inQ = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i+1] === '"') { cell += '"'; i++; }
        else inQ = false;
      } else cell += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cell); cell = ""; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== '\r') cell += c;
    }
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return clean(x); }); });
}

var CSV_HEAD = { code:"材料编号", name:"材料名称", cat:"类别", who:"提交人", sid:"学号", note:"说明", file:"附件" };
function mapCsvHeader(header) {
  var idx = {};
  Object.keys(CSV_HEAD).forEach(function(key){
    var pos = header.indexOf(CSV_HEAD[key]);
    if (pos >= 0) idx[key] = pos;
  });
  return idx;
}

function importCsv(e) {
  if (!can("docs:import")) { toast("当前视角无权批量导入材料"); e.target.value = ""; return; }
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var rows = parseCsv(reader.result);
    if (!rows.length) { toast("CSV 未解析到有效内容"); return; }
    var header = rows[0].map(function(x){ return clean(x); });
    var hasHead = header.some(function(h){ return CSV_HEAD.name === h || CSV_HEAD.who === h || CSV_HEAD.sid === h; });
    var idx = hasHead ? mapCsvHeader(header) : { name:0, cat:1, who:2, sid:3, note:4, file:5 };
    var body = hasHead ? rows.slice(1) : rows;
    var added = 0, skipped = 0, dup = 0;
    body.forEach(function(r){
      var vals = {
        code: idx.code != null ? clean(r[idx.code]) : "",
        name: clean(r[idx.name]), cat: clean(r[idx.cat]), who: clean(r[idx.who]),
        sid: clean(r[idx.sid]), note: clean(r[idx.note]), file: clean(r[idx.file])
      };
      if (Object.keys(validateRecord("doc", vals)).length) { skipped++; return; }
      var exists = store.docs.some(function(d){ return d.sid === vals.sid && d.name === vals.name && d.cat === vals.cat; });
      if (exists) { dup++; return; }
      try { addDoc(vals); added++; } catch(err){ skipped++; }
    });
    state.selected = {}; state.selectedId = null;
    refreshAll();
    try { addLog("导入", "CSV 材料 " + added + " 条", state.operatorName, roleLabel()); } catch(err){}
    toast("导入完成：新增 " + added + " 条" + (dup ? "，重复 " + dup : "") + (skipped ? "，跳过 " + skipped : ""));
  };
  reader.readAsText(file, "utf-8");
  e.target.value = "";
}

function importBackup(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); }
    catch (err) { toast("导入失败：不是有效的 JSON 文件"); return; }
    if (!data || typeof data !== "object" || !Array.isArray(data.docs) || !Array.isArray(data.logs)) {
      toast("导入失败：备份结构不正确，docs / logs 应为列表"); return;
    }
    confirmModal("导入确认", "导入将覆盖本浏览器当前全部材料与操作日志，且不可撤销。确定继续导入吗？", function(){
      try { restore(data.docs, data.logs, data.roster, data.tasks, data.templates); }
      catch (err) { toast("导入失败：" + err.message); return; }
      state.selected = {}; state.selectedId = null;
      state.tplDirty = true;
      closeDrawer();
      refreshAll(); toast("备份数据已导入");
    });
  };
  reader.readAsText(file, "utf-8");
  e.target.value = "";
}

/* ============ 初始化 ============ */
function bindRole() {
  var sel = document.getElementById("roleSelect");
  var sidEl = document.getElementById("applicantSid");
  var sidWrap = document.getElementById("applicantIdWrap");
  function syncLabel() {
    sel.value = state.role;
    var role = ROLES[state.role] || ROLES.handler;
    var displayName = role.label, displayRole = role.operator, operatorName = role.operator;
    if (state.role === "applicant" && state.applicantSid) {
      displayRole = "学号 " + state.applicantSid;
      var ro = findRosterBySid(state.applicantSid);
      if (ro) { displayName = ro.who; operatorName = ro.who; }
    }
    state.operatorName = operatorName;
    var nameEl = document.getElementById("idName");
    var roleEl = document.getElementById("idRole");
    var avatarEl = document.getElementById("idAvatar");
    if (nameEl) nameEl.textContent = displayName;
    if (roleEl) roleEl.textContent = displayRole;
    if (avatarEl) avatarEl.textContent = operatorName.charAt(0);
    var tName = document.getElementById("topName"), tRole = document.getElementById("topRole"),
        tAvatar = document.getElementById("topAvatar");
    if (tName) tName.textContent = state.role === "applicant" ? displayName + " · 申请人" : displayRole + " · " + displayName;
    if (tRole) tRole.textContent = state.role === "applicant" && state.applicantSid ? "学号 " + state.applicantSid : "本地模式";
    if (tAvatar) tAvatar.textContent = operatorName.charAt(0);
    if (sidWrap) sidWrap.style.display = state.role === "applicant" ? "block" : "none";
    if (sidEl && document.activeElement !== sidEl) sidEl.value = state.applicantSid;
  }
  sel.onchange = function(){
    state.role = sel.value;
    applyRoleDefaults();
    buildNav();
    syncLabel();
    closeDrawer();
    switchView(state.current);
    if (state.role === "applicant" && !state.applicantSid && sidEl && sidEl.focus) sidEl.focus();
  };
  if (sidEl) sidEl.oninput = function(){
    var val = clean(sidEl.value).replace(/[^\d]/g, "").slice(0, 20);
    if (sidEl.value !== val) sidEl.value = val;
    if (val === state.applicantSid) return;
    state.applicantSid = val;
    saveApplicantSid(val);
    state.selectedId = null;
    state.selected = {};
    syncLabel();
    if (state.role === "applicant" && (state.current === "dashboard" || state.current === "docs")) {
      switchView(state.current);
    }
  };
  syncLabel();
}

/* ---- 界面主题：浅色 / 深色 / 跟随系统（本地记住） ---- */
var THEME_KEY = "classconsole_web_theme";
function themePref(){ try { return localStorage.getItem(THEME_KEY) || "system"; } catch(e){ return "system"; } }
function systemPrefersDark(){
  if (typeof window === "undefined" || !window.matchMedia) return false;
  try { return !!window.matchMedia("(prefers-color-scheme: dark)").matches; } catch(e){ return false; }
}
function applyTheme(mode){
  var root = document.documentElement;
  if (!root || !root.setAttribute) return;
  var dark = mode === "dark" || (mode === "system" && systemPrefersDark());
  root.setAttribute("data-theme", dark ? "dark" : "light");
}
function syncThemeButtons(mode){
  document.querySelectorAll("#themeSwitch button").forEach(function(b){
    b.classList.toggle("on", b.dataset.themeMode === mode);
    b.onclick = function(){
      try { localStorage.setItem(THEME_KEY, b.dataset.themeMode); } catch(e){}
      applyTheme(b.dataset.themeMode); syncThemeButtons(b.dataset.themeMode);
    };
  });
}
function initTheme(){
  var mode = themePref();
  applyTheme(mode); syncThemeButtons(mode);
  if (typeof window === "undefined" || !window.matchMedia) return;
  try {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      if (themePref() === "system") applyTheme("system");
    });
  } catch(e){}
}

/* ---- 侧栏折叠（图标栏 / 展开态），状态持久化 ---- */
var SIDEBAR_KEY = "classconsole_web_sidebar";
function renderCollapseBtn() {
  var aside = document.querySelector(".sidebar");
  var btn = document.getElementById("collapseBtn");
  var collapsed = aside.classList.contains("collapsed");
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    (collapsed ? '<path d="m10 6 6 6-6 6"/>' : '<path d="m14 6-6 6 6 6"/>') + '</svg>';
  btn.title = collapsed ? "展开侧栏" : "折叠侧栏";
}
function initSidebar() {
  var aside = document.querySelector(".sidebar");
  var btn = document.getElementById("collapseBtn");
  try { if (localStorage.getItem(SIDEBAR_KEY) === "1") aside.classList.add("collapsed"); } catch(e){}
  btn.onclick = function() {
    var collapsed = aside.classList.toggle("collapsed");
    try { localStorage.setItem(SIDEBAR_KEY, collapsed ? "1" : "0"); } catch(e){}
    renderCollapseBtn();
  };
  renderCollapseBtn();
}

document.getElementById("drawerClose").onclick = closeDrawer;
document.getElementById("drawerMask").onclick = closeDrawer;
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  if (document.getElementById("reminderPop").classList.contains("show")) closeReminders();
  else if (document.getElementById("drawer").classList.contains("show")) closeDrawer();
});

/* 顶栏全局搜索：输入即切到台账并按关键词过滤，Enter 直接定位 */
function bindGlobalSearch(){
  var input = document.getElementById("globalSearch");
  if (!input) return;
  var timer = null;
  input.addEventListener("input", function(){
    var v = input.value;
    clearTimeout(timer);
    timer = setTimeout(function(){
      docsFilter.q = clean(v); docsFilter.page = 1;
      if (state.current !== "docs") switchView("docs"); else { syncFilterControls(); renderDocs(); }
    }, 260);
  });
  input.addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    e.preventDefault();
    docsFilter.q = clean(input.value); docsFilter.page = 1;
    switchView("docs");
    var q = document.getElementById("fQ");
    if (q && q.focus) q.focus();
  });
}

/* 快捷键：Ctrl/⌘ + K 聚焦顶栏全局搜索 */
document.addEventListener("keydown", function(e){
  if (!(e.ctrlKey || e.metaKey) || String(e.key || "").toLowerCase() !== "k") return;
  e.preventDefault();
  var g = document.getElementById("globalSearch");
  if (g && g.focus) { g.focus(); if (g.select) g.select(); }
});

/* 台账键盘导航：上下移动选中行，回车打开详情；输入控件内不拦截 */
document.addEventListener("keydown", function(e){
  if (state.current !== "docs") return;
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  var rows = filteredDocs();
  if (!rows.length) return;
  var idx = rows.findIndex(function(d){ return d.id === state.selectedId; });
  var ni = null;
  if (e.key === "ArrowDown") ni = idx < 0 ? 0 : Math.min(rows.length - 1, idx + 1);
  else if (e.key === "ArrowUp") ni = idx <= 0 ? 0 : idx - 1;
  else if (e.key === "Enter") { if (idx >= 0) { e.preventDefault(); openDoc(state.selectedId); } return; }
  else return;
  e.preventDefault();
  state.selectedId = rows[ni].id;
  docsFilter.page = Math.floor(ni / docsFilter.pageSize) + 1;
  renderDocs();
});

loadStore();
applyPrefs();
buildNav();
buildDocs();
buildSubmit();
buildCollect();
bindRole();
bindGlobalSearch();
bindReminders();
initSidebar();
initTheme();
applyRoleDefaults();
switchView("dashboard");
</script>
