<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班级材料操作台 · 浏览器本地版</title>
<style>
  :root{
    --bg:#F3F5F9; --card:#FFFFFF; --line:#E8ECF2; --line-strong:#D9E0EA;
    --text:#1B2430; --muted:#66707D;
    --primary:#4F63EE; --primary-hover:#3D55D8; --primary-soft:#EEF1FE;
    --green:#16A34A; --orange:#D97706; --red:#DC2626; --zebra:#F8FAFC;
    --radius:10px; --shadow:0 1px 2px rgba(27,36,48,.06);
    --fs-xs:12px; --fs-sm:12.5px; --fs-base:13.5px; --fs-md:15px; --fs-lg:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text); font-size:var(--fs-md); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:14px;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
  .app{display:flex;min-height:100vh}

  /* 侧边栏 */
  .sidebar{width:216px;background:var(--card);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:22px 18px 16px}
  .brand h1{font-size:16.5px;font-weight:700;letter-spacing:.01em}
  .brand p{font-size:var(--fs-xs);color:var(--muted);margin-top:3px}
  .nav{display:flex;flex-direction:column;padding:4px 10px;gap:2px}
  .nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;
    color:var(--muted);padding:9px 12px;border-radius:8px;text-align:left;min-height:40px;font-size:14px}
  .nav button .ico{width:18px;text-align:center}
  .nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .nav button:hover:not(.active){background:var(--bg)}
  .side-bottom{margin-top:auto;padding:16px 16px;border-top:1px solid var(--line)}
  .side-bottom .lbl{font-size:var(--fs-xs);color:var(--muted);margin-bottom:10px}
  .role-row{display:flex;gap:8px}
  .role-row label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--line);border-radius:8px;padding:8px 6px;cursor:pointer;min-height:38px;font-size:13px}
  .role-row input{accent-color:var(--primary)}
  .role-row label.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 28px 8px}
  .topbar h2{font-size:var(--fs-lg);font-weight:700}
  .topbar .summary{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
  .content{flex:1;padding:6px 28px 18px;min-width:0}
  .view{display:none}
  .view.active{display:block}
  .statusbar{display:flex;justify-content:space-between;gap:16px;padding:8px 28px;
    background:#E7EDEA;color:#5B716E;font-size:var(--fs-xs)}

  /* 卡片与通用 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:34px 16px}
  .empty .empty-title{font-size:14.5px;color:var(--text);margin-bottom:4px}
  .empty .empty-sub{font-size:13px;margin-bottom:12px}
  .btn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:8px 14px;min-height:38px;font-size:13.5px}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.danger{background:var(--card);border-color:#F3C2C2;color:var(--red)}
  .btn.danger:hover{background:#FEECEC}
  .btn.mini{min-height:32px;padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0}
  .toolbar label{font-size:var(--fs-sm);color:var(--muted)}
  .toolbar input[type=search],.toolbar select{
    border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;background:var(--card);min-height:38px;font-size:13.5px}
  .toolbar input[type=search]{width:210px}
  .toolbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .actions{display:flex;gap:10px;align-items:center;padding:12px 0}
  .hint{font-size:var(--fs-sm);color:var(--muted)}

  /* 筛选条件标签 */
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 12px;min-height:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--card);border-radius:20px;padding:5px 10px;font-size:12.5px;color:var(--text)}
  .chip b{font-weight:600}
  .chip button{border:0;background:transparent;color:var(--muted);font-size:14px;line-height:1;
    padding:0 2px;cursor:pointer}
  .chip button:hover{color:var(--red)}
  .chip-clear{border:0;background:transparent;color:var(--primary);font-size:12.5px;cursor:pointer;padding:4px 6px}
  .chip-clear:hover{text-decoration:underline}

  /* 看板 */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 16px}
  .stat-card{padding:15px 17px;cursor:pointer;border:1px solid var(--line);border-radius:var(--radius);transition:border-color .15s, box-shadow .15s}
  .stat-card:hover{border-color:var(--primary);box-shadow:var(--shadow)}
  .stat-card .num{font-size:25px;font-weight:700;letter-spacing:-.01em}
  .stat-card .lbl{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
  .stat-card .drill{font-size:var(--fs-xs);color:var(--primary);margin-top:7px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{padding:15px 16px}
  .panel h3{font-size:13.5px;font-weight:600;margin-bottom:12px}
  .cat-row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .cat-row .name{width:78px;font-size:13px;flex-shrink:0}
  .cat-row .track{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
  .cat-row .fill{height:100%;background:var(--primary);border-radius:6px}
  .cat-row .cnt{width:26px;text-align:right;font-size:13px;color:var(--muted)}
  .panel + .panel{margin-top:14px}
  .dash-actions{display:flex;gap:10px;margin:4px 0 16px}

  /* 表格 */
  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:var(--fs-base);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:var(--fs-sm);background:var(--zebra)}
  tbody tr:nth-child(even){background:var(--zebra)}
  tbody tr.sel{background:var(--primary-soft)}
  tbody tr.clickable{cursor:pointer}
  .num-col{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  /* 首列冻结：复选框列 + 材料名称列横滑固定 */
  .sticky-l0{position:sticky;left:0;z-index:2;background:var(--card)}
  .sticky-l1{position:sticky;left:36px;z-index:2;background:var(--card)}
  thead .sticky-l0,thead .sticky-l1{background:var(--zebra)}
  tbody tr:nth-child(even) .sticky-l0,tbody tr:nth-child(even) .sticky-l1{background:var(--zebra)}
  tbody tr.sel .sticky-l0,tbody tr.sel .sticky-l1{background:var(--primary-soft)}
  /* 密度三档 */
  .density-compact th,.density-compact td{padding:5px 10px}
  .density-spacious th,.density-spacious td{padding:13px 12px}
  /* 排序表头 */
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--text)}
  th .sort-ind{font-size:11px;color:var(--primary);margin-left:3px}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:var(--fs-xs);font-weight:500}
  .tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .tag.green{color:var(--green);background:#EAF7EF}
  .tag.orange{color:var(--orange);background:#FDF3E3}
  .tag.red{color:var(--red);background:#FEECEC}
  .tag.muted{color:var(--muted);background:#F1F3F6}

  /* 复选框与批量操作栏 */
  .cb{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;vertical-align:middle}
  .bulk-bar{display:none;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;
    background:var(--primary-soft);border:1px solid #DCE3FC;border-radius:var(--radius)}
  .bulk-bar.show{display:flex}
  .bulk-bar .bulk-count{font-size:13px;font-weight:600;color:var(--primary)}
  .bulk-bar .spacer{margin-left:auto}

  /* 列显隐面板 */
  .col-menu{position:relative;display:inline-block}
  .col-menu > summary{list-style:none;cursor:pointer;border:1px solid var(--line-strong);
    background:var(--card);border-radius:8px;padding:8px 12px;min-height:38px;font-size:13.5px;
    display:flex;align-items:center;gap:6px}
  .col-menu > summary::-webkit-details-marker{display:none}
  .col-menu .panel{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(27,36,48,.14);
    z-index:20;min-width:150px}
  .col-menu .panel label{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer}
  .match-count{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}

  /* 表单字段就近报错 */
  .field .ferr{grid-column:2;color:var(--red);font-size:12.5px;min-height:16px;padding-top:2px}

  /* 分页 */
  .pager{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 2px 0}
  .pager .pg-info{font-size:13px;color:var(--muted)}
  .pager .spacer{margin-left:auto}

  /* 表单 */
  .form-card{max-width:640px;margin:8px 0;padding:24px 26px}
  .form-card h3{font-size:17px;margin-bottom:4px}
  .form-card .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .field{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:11px 0}
  .field label{font-size:14px}
  .field label .req{color:var(--red)}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--card);width:100%}
  .field textarea{resize:vertical;min-height:78px}
  .file-line{display:flex;align-items:center;gap:10px}
  .file-line .fname{font-size:13px;color:var(--muted)}
  .err{color:var(--red);font-size:13px;min-height:20px;padding:6px 0}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}

  /* 确认弹窗 */
  .mask{position:fixed;inset:0;background:rgba(31,41,55,.42);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:30}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:14px;max-width:520px;width:100%;padding:22px 24px;
    box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .modal h3{font-size:16px;margin-bottom:12px}
  .modal .body{font-size:14px}
  .modal .body .kv{display:grid;grid-template-columns:86px 1fr;gap:6px 12px;padding:4px 0}
  .modal .body .kv .k{color:var(--muted)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  /* 详情抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(31,41,55,.32);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:25}
  .drawer-mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:430px;max-width:92vw;background:var(--card);
    box-shadow:-8px 0 30px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:26;
    transform:translateX(100%);transition:transform .22s ease}
  .drawer.show{transform:translateX(0)}
  .drawer header{display:flex;align-items:flex-start;gap:10px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
  .drawer header .dh-t{flex:1;min-width:0}
  .drawer header h3{font-size:16px;line-height:1.4;word-break:break-all}
  .drawer header .dh-tag{margin-top:6px}
  .drawer .dh-close{border:0;background:transparent;font-size:20px;color:var(--muted);padding:4px 8px;line-height:1}
  .drawer .dh-close:hover{color:var(--text)}
  .drawer-body{flex:1;overflow:auto;padding:16px 22px}
  .drawer-section{margin-bottom:18px}
  .drawer-section h4{font-size:12.5px;color:var(--muted);margin-bottom:10px;letter-spacing:.02em}
  .kv{display:grid;grid-template-columns:86px 1fr;gap:8px 12px;font-size:13.5px}
  .kv .k{color:var(--muted)}
  .kv .v{word-break:break-all}
  .trace{border-top:1px solid var(--line);padding-top:12px}
  .trace h4{font-size:13px;color:var(--muted);margin-bottom:8px}
  .trace li{list-style:none;font-size:13px;padding:5px 0;color:var(--text)}
  .trace .t-time{color:var(--muted);margin-right:6px}
  .drawer footer{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
  .drawer footer .spacer{margin-left:auto}

  .toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:var(--text);
    color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:40;max-width:80vw;text-align:center}
  .toast.show{opacity:.95}

  @media (max-width:1024px){
    .sidebar{width:156px}
    .brand{padding:18px 14px 14px}
    .nav button{padding:8px 10px;font-size:13px}
  }
  @media (max-width:768px){
    .app{flex-direction:column}
    .sidebar{width:100%;border-right:0;border-bottom:1px solid var(--line)}
    .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:6px 10px}
    .nav button{flex:0 0 auto;justify-content:center;min-height:38px}
    .side-bottom{margin-top:0;border-top:1px solid var(--line)}
    .cards{grid-template-columns:repeat(2,1fr)}
    .grid-2{grid-template-columns:1fr}
    .topbar{padding:16px 16px 8px}
    .content{padding:4px 16px 16px}
    .statusbar{padding:8px 16px}
    .field{grid-template-columns:1fr;gap:6px}
    .field .ferr{grid-column:1}
    .drawer{width:100%;max-width:100%}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>班级操作台</h1>
      <p>数据仅存本浏览器 · 不上云、不同步</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom">
      <div class="lbl">当前视角</div>
      <div class="role-row" id="roleRow">
        <label id="roleAdmin"><input type="radio" name="role" value="admin"> 管理员</label>
        <label id="roleStudent"><input type="radio" name="role" value="student"> 同学</label>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="viewTitle">工作台概览</h2>
      <div class="summary" id="summary"></div>
    </div>
    <div class="content">
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-docs"></section>
      <section class="view" id="view-roster"></section>
      <section class="view" id="view-tasks"></section>
      <section class="view" id="view-submit"></section>
      <section class="view" id="view-logs"></section>
    </div>
    <div class="statusbar">
      <span id="statusLeft">本地缓存模式 · 数据保存在本浏览器</span>
      <span id="statusRight"></span>
    </div>
  </main>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer" aria-label="材料详情">
  <header>
    <div class="dh-t">
      <h3 id="drawerTitle"></h3>
      <div class="dh-tag" id="drawerTag"></div>
    </div>
    <button class="dh-close" id="drawerClose" aria-label="关闭详情">×</button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
  <footer id="drawerFooter"></footer>
</aside>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ 常量与种子数据（对齐桌面版 seed.py） ============ */
var CATS = ["团务材料", "奖助材料", "学分材料", "宣传材料", "班级事务"];
var STATUS_ALL = ["全部", "待审核", "已归档", "已驳回", "待补材料"];
var STORE_KEY = "classconsole_web_v1";

/* ============ 类型配置（schema 驱动：列 / 字段 / 校验 / 动作 / 导出共用一份定义） ============ */
/* 新增一类业务时，在此追加一段类型配置即可；列表、表单、校验、动作管线按配置渲染。 */
var TYPES = {
  doc: {
    label: "材料",
    searchKeys: ["name", "who", "sid"],
    columns: [
      {key:"name",  label:"材料名称", sortable:true, frozen:"l1"},
      {key:"cat",   label:"类别",     sortable:false},
      {key:"who",   label:"提交人",   sortable:true},
      {key:"sid",   label:"学号",     sortable:true, num:true},
      {key:"id",    label:"提交时间", sortable:true},
      {key:"status",label:"状态",     sortable:true, tag:"status"},
      {key:"file",  label:"附件",     sortable:false}
    ],
    fields: [
      {key:"name", label:"材料名称", type:"text",     required:true},
      {key:"who",  label:"姓名",     type:"text",     required:true},
      {key:"sid",  label:"学号",     type:"sid",      required:true},
      {key:"cat",  label:"材料类别", type:"select",   options:CATS, required:true},
      {key:"note", label:"材料说明", type:"textarea"},
      {key:"file", label:"附件",     type:"file"}
    ],
    statuses: ["待审核", "已归档", "已驳回"],
    filters: [
      {key:"cat",    label:"类别", options:["全部"].concat(CATS)},
      {key:"status", label:"状态", options:STATUS_ALL}
    ],
    actions: [
      {key:"archive", label:"归档", to:"已归档", role:"admin", cls:"primary",
       confirm:function(r){ return "确定将「" + r.name + "」归档吗？归档后进入已归档列表。"; }},
      {key:"reject",  label:"驳回", to:"已驳回", role:"admin", cls:"danger",
       confirm:function(r){ return "确定驳回「" + r.name + "」吗？驳回后该材料将标记为已驳回。"; }}
    ]
  }
};
function typeDef(key){ return TYPES[key] || TYPES.doc; }
function fieldDef(typeKey, key){
  var f = typeDef(typeKey).fields.filter(function(x){ return x.key === key; })[0];
  return f || null;
}

var SEED_DOCS = [
  {name:"团日活动申报表", cat:"团务材料", who:"黄志强", sid:"250211", note:"十月主题团日活动", file:"", time:"11-12 09:24", status:"已归档", scope:"全员"},
  {name:"奖学金评定证明复印件", cat:"奖助材料", who:"李雨桐", sid:"250203", note:"校级奖学金评定", file:"证明复印件.pdf", time:"11-12 10:05", status:"待审核", scope:"班委"},
  {name:"社团招新活动新闻稿", cat:"宣传材料", who:"王浩宇", sid:"250217", note:"计算机网络协会招新", file:"新闻稿.docx", time:"11-13 14:40", status:"已归档", scope:"全员"},

/* ============ 本地缓存存储层（对齐仓库契约） ============ */
var store = { docs: [], logs: [], roster: [], tasks: [], seq: { doc: 0, log: 0 } };

function nowStr() {
  var d = new Date();
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function clean(v){ return v == null ? "" : String(v).trim(); }

function loadStore() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.docs) && Array.isArray(data.logs)) {
        store.docs = data.docs.filter(function(d){ return d && typeof d === "object"; }).map(normalizeDoc);
        store.logs = data.logs.filter(function(l){ return l && typeof l === "object"; });
        store.roster = Array.isArray(data.roster) ? data.roster.filter(function(r){ return r && typeof r === "object"; }).map(normalizeRoster) : [];
        store.tasks = Array.isArray(data.tasks) ? data.tasks.filter(function(t){ return t && typeof t === "object"; }).map(normalizeTask) : [];
        store.seq = data.seq || { doc: store.docs.length, log: store.logs.length };
        return;
      }
    }
  } catch (e) { /* 缓存损坏则重建种子 */ }
  store.docs = SEED_DOCS.map(function(d, i){ return Object.assign({id: i+1}, d); });
  store.logs = SEED_LOGS.map(function(l, i){ return Object.assign({id: i+1}, l); });
  store.roster = SEED_ROSTER.map(function(r, i){ return Object.assign({id: i+1}, r); });
  store.tasks = SEED_TASKS.map(function(t, i){
    var d = new Date(); d.setDate(d.getDate() + (t.offset || 0));
    function pad(n){ return (n < 10 ? "0" : "") + n; }
    var ds = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
    return { id: i+1, title:t.title, cat:t.cat, scope:t.scope, note:t.note, done:t.done, deadline:ds };
  });
  store.seq = { doc: store.docs.length, log: store.logs.length };
  saveStore();
}
function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
    state.persist = true;
  } catch (e) {
    // 存储被禁用或配额不足时降级为内存态，不中断当前操作
    state.persist = false;
  }
}

/* ---- 仓库方法（与桌面版契约同名） ---- */
function listDocs(q, cat) {
  q = clean(q).toLowerCase(); cat = clean(cat) || "全部";
  return store.docs.filter(function(d){
    var okCat = (cat === "全部" || d.cat === cat);
    if (!okCat) return false;
    if (!q) return true;
    return [d.name, d.who, d.sid].some(function(f){ return clean(f).toLowerCase().indexOf(q) >= 0; });
  }).sort(function(a,b){ return b.id - a.id; });
}
/* 按类型 schema 对一条记录做字段兜底，缺字段补空串，状态/范围给默认值 */
function normalizeDoc(raw, i) {
  var row = { id: i + 1 };
  TYPES.doc.fields.forEach(function(f){ row[f.key] = clean(raw[f.key]); });
  row.time = clean(raw.time);
  row.status = clean(raw.status) || "待审核";
  row.scope = clean(raw.scope) || "全员";
  row.reason = clean(raw.reason);
  return row;
}
function addDoc(data) {
  var row = normalizeDoc(data, store.seq.doc);
  row.time = nowStr();
  row.status = "待审核";
  if (!row.name || !row.cat || !row.who) throw new Error("材料名称、类别、姓名不能为空");
  store.seq.doc += 1; row.id = store.seq.doc;
  store.docs.push(row); saveStore();
  return row;
}
function findDoc(id){ return store.docs.find(function(d){ return d.id === id; }) || null; }
function archiveDoc(id){ var d = findDoc(id); if(!d) return null; d.status = "已归档"; saveStore(); return d; }
function rejectDoc(id){ var d = findDoc(id); if(!d) return null; d.status = "已驳回"; saveStore(); return d; }

/* ---- 班级名单（学号—姓名对照） ---- */
function normalizeRoster(raw, i){
  return { id: (i || 0) + 1, sid: clean(raw.sid), who: clean(raw.who) };
}
function listRoster(){ return store.roster.slice().sort(function(a,b){ return a.sid.localeCompare(b.sid); }); }
function findRosterBySid(sid){ var s = clean(sid); return store.roster.find(function(r){ return r.sid === s; }) || null; }
function addRoster(sid, who){
  sid = clean(sid); who = clean(who);
  if (!sid || !who) throw new Error("学号、姓名不能为空");
  if (!/^\d+$/.test(sid)) throw new Error("学号需为纯数字");
  if (findRosterBySid(sid)) throw new Error("该学号已在名单中");
  var maxId = store.roster.length ? Math.max.apply(null, store.roster.map(function(x){ return x.id; })) : 0;
  var r = { id: maxId + 1, sid: sid, who: who };
  store.roster.push(r); saveStore(); return r;
}
function removeRoster(id){ store.roster = store.roster.filter(function(r){ return r.id !== id; }); saveStore(); }

/* ---- 任务 / 截止跟踪 ---- */
function normalizeTask(raw, i){
  return {
    id: (i || 0) + 1,
    title: clean(raw.title), cat: clean(raw.cat), scope: clean(raw.scope) || "全员",
    deadline: clean(raw.deadline), note: clean(raw.note), done: !!raw.done
  };
}
function listTasks(){ return store.tasks.slice().sort(function(a,b){ return a.deadline < b.deadline ? -1 : 1; }); }
function findTask(id){ return store.tasks.find(function(t){ return t.id === id; }) || null; }
function addTask(data){
  var row = normalizeTask(data, store.seq.task || 0);
  if (!row.title) throw new Error("任务标题不能为空");
  if (!row.deadline) throw new Error("请选择截止日期");
  var maxId = store.tasks.length ? Math.max.apply(null, store.tasks.map(function(x){ return x.id; })) : 0;
  row.id = maxId + 1;
  store.tasks.push(row); saveStore(); return row;
}
function updateTask(id, data){
  var t = findTask(id); if (!t) return null;
  ["title","cat","scope","deadline","note"].forEach(function(k){ if (data[k] != null) t[k] = clean(data[k]); });
  if (typeof data.done === "boolean") t.done = data.done;
  saveStore(); return t;
}
function removeTask(id){ store.tasks = store.tasks.filter(function(t){ return t.id !== id; }); saveStore(); }
function toggleTask(id){ var t = findTask(id); if (t) { t.done = !t.done; saveStore(); } }

function dateToday(){ var d = new Date(); function p(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function daysUntil(deadline){
  if (!deadline) return null;
  var today = new Date(dateToday()); var dl = new Date(deadline + "T00:00:00");
  return Math.round((dl - today) / 86400000);
}
function taskStats(){
  var ongoing = 0, due = 0, overdue = 0, done = 0;
  store.tasks.forEach(function(t){
    if (t.done) { done++; return; }
    var left = daysUntil(t.deadline);
    if (left != null && left < 0) overdue++;
    else if (left != null && left <= 2) due++;
    ongoing++;
  });
  return { total: store.tasks.length, ongoing: ongoing, due: due, overdue: overdue, done: done };
}

/* 核对：应交（名单）/ 已交（有材料）/ 未交 / 名单外材料 */
function rosterCheck(){
  var submitted = {};
  store.docs.forEach(function(d){ if (d.sid) submitted[d.sid] = true; });
  var absent = store.roster.filter(function(r){ return !submitted[r.sid]; });
  var rosterSids = store.roster.map(function(r){ return r.sid; });
  var extra = store.docs.filter(function(d){ return d.sid && rosterSids.indexOf(d.sid) < 0; });
  return { total: store.roster.length, done: store.roster.length - absent.length, absent: absent, extra: extra };
}
function listLogs(){ return store.logs.slice().sort(function(a,b){ return b.id - a.id; }); }
function addLog(act, obj, who, role, src) {
  store.seq.log += 1;
  store.logs.push({id: store.seq.log, time: nowStr(), who: clean(who), role: clean(role),
    act: clean(act), obj: clean(obj), src: clean(src) || "本机"});
  saveStore();
}
function stats() {
  return {
    total: store.docs.length,
    pending: store.docs.filter(function(d){ return d.status === "待审核"; }).length,
    archived: store.docs.filter(function(d){ return d.status === "已归档"; }).length,
    rejected: store.docs.filter(function(d){ return d.status === "已驳回"; }).length
  };
}
function backup(){ return { docs: store.docs, logs: store.logs, roster: store.roster, tasks: store.tasks }; }
function restore(docs, logs, roster, tasks) {
  if (!Array.isArray(docs) || !Array.isArray(logs)) throw new Error("备份数据结构不正确");
  store.docs = docs.filter(function(d){ return d && typeof d === "object"; }).map(normalizeDoc);
  store.logs = logs.filter(function(l){ return l && typeof l === "object"; }).map(function(l,i){
    return {id: i+1, time:clean(l.time), who:clean(l.who), role:clean(l.role),
      act:clean(l.act), obj:clean(l.obj), src:clean(l.src) || "本机"};
  });
  store.roster = Array.isArray(roster) ? roster.filter(function(r){ return r && typeof r === "object"; }).map(normalizeRoster) : [];
  store.tasks = Array.isArray(tasks) ? tasks.filter(function(t){ return t && typeof t === "object"; }).map(normalizeTask) : [];
  store.seq = { doc: store.docs.length, log: store.logs.length };
  saveStore();
}

var FILTER_KEY = "classconsole_web_prefs";
var SIZE_OPTS = [10, 25, 50], DENS_OPTS = ["compact", "comfortable", "spacious"];
function loadPrefs(){ try { return JSON.parse(localStorage.getItem(FILTER_KEY)) || {}; } catch(e){ return {}; } }
function savePrefs(){
  var p = { q:docsFilter.q, cat:docsFilter.cat, status:docsFilter.status,
    sortKey:docsFilter.sortKey, sortDir:docsFilter.sortDir,
    pageSize:docsFilter.pageSize, density:docsFilter.density };

  if (p.status) docsFilter.status = p.status;

  if (p.sortDir) docsFilter.sortDir = p.sortDir;
  if (SIZE_OPTS.indexOf(p.pageSize) >= 0) docsFilter.pageSize = p.pageSize;
  if (DENS_OPTS.indexOf(p.density) >= 0) docsFilter.density = p.density;
}

function filteredDocs() {
  var q = clean(docsFilter.q).toLowerCase();
  var rows = store.docs.filter(function(d){
    if (docsFilter.cat !== "全部" && d.cat !== docsFilter.cat) return false;
    if (docsFilter.status !== "全部" && d.status !== docsFilter.status) return false;
    if (!q) return true;
    return [d.name, d.who, d.sid].some(function(f){ return clean(f).toLowerCase().indexOf(q) >= 0; });
  });
  var key = docsFilter.sortKey, dir = docsFilter.sortDir === "asc" ? 1 : -1;
  rows.sort(function(a, b){
    var va = a[key], vb = b[key];
    if (key === "sid") { va = String(va); vb = String(vb); }
    if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
    return String(va).localeCompare(String(vb), "zh") * dir;
  });
  return rows;
}

function buildDocs() {
  var catOpts = ["全部"].concat(CATS).map(function(c){
    return '<option' + (docsFilter.cat===c?" selected":"") + ">" + esc(c) + "</option>"; }).join("");
  var stOpts = STATUS_ALL.map(function(c){
    return '<option' + (docsFilter.status===c?" selected":"") + ">" + esc(c) + "</option>"; }).join("");
  var sizeOpts = [10,25,50].map(function(n){
    return '<option value="' + n + '"' + (docsFilter.pageSize===n?" selected":"") + ">" + n + " 条/页</option>"; }).join("");
  var densOpts = [["compact","紧凑"],["comfortable","舒适"],["spacious","宽松"]].map(function(o){
    return '<option value="' + o[0] + '"' + (docsFilter.density===o[0]?" selected":"") + ">" + o[1] + "</option>"; }).join("");

  var colChecks = DOC_COLS.map(function(c){
    var h = hiddenCols();
    var on = h.indexOf(c.key) < 0 ? " checked" : "";
    return '<label><input type="checkbox" class="col-cb" data-key="' + c.key + '"' + on + ">" + esc(c.label) + "</label>";
  }).join("");

  document.getElementById("view-docs").innerHTML =
    '<div class="toolbar">' +
      "<label>搜索</label><input type='search' id='fQ' placeholder='名称 / 姓名 / 学号' value='" + esc(docsFilter.q) + "'>" +
      "<label>类别</label><select id='fCat'>" + catOpts + "</select>" +
      "<label>状态</label><select id='fStatus'>" + stOpts + "</select>" +
      '<div class="toolbar-right">' +
        '<span class="match-count" id="matchCount"></span>' +
        "<label>每页</label><select id='fSize'>" + sizeOpts + "</select>" +
        "<label>密度</label><select id='fDensity'>" + densOpts + "</select>" +
        '<details class="col-menu"><summary>列显示</summary><div class="panel">' + colChecks + "</div></details>" +
      "</div></div>" +
    '<div class="chips" id="docChips"></div>' +
    '<div class="table-wrap" id="docsWrap"><table>' +
      '<colgroup><col style="width:36px"></colgroup>' +
      '<thead id="docsHead"></thead>' +
      '<tbody id="docsBody"></tbody></table></div>' +
    '<div class="pager" id="docPager"></div>' +
    '<div class="bulk-bar" id="bulkBar"></div>' +
    '<div class="actions" id="docsActions"></div>' +
    '<input type="file" id="csvImportFile" accept=".csv,.txt" style="display:none">';

  var qInput = document.getElementById("fQ");
  var debounce = null;
  qInput.oninput = function(e){
    clearTimeout(debounce);
    debounce = setTimeout(function(){
      docsFilter.q = e.target.value; docsFilter.page = 1; renderDocs();
    }, 300);
  };
  document.getElementById("fCat").onchange = function(e){ docsFilter.cat = e.target.value; docsFilter.page = 1; renderDocs(); };
  document.getElementById("fStatus").onchange = function(e){ docsFilter.status = e.target.value; docsFilter.page = 1; renderDocs(); };
  document.getElementById("fSize").onchange = function(e){ docsFilter.pageSize = Number(e.target.value); docsFilter.page = 1; renderDocs(); };
  document.getElementById("fDensity").onchange = function(e){ docsFilter.density = e.target.value; renderDocs(); };
  document.querySelectorAll(".col-cb").forEach(function(cb){
    cb.onchange = function(){
      var h = hiddenCols(), key = cb.dataset.key;
      if (cb.checked) { var i = h.indexOf(key); if (i >= 0) h.splice(i, 1); }
      else if (h.indexOf(key) < 0) h.push(key);
      saveHiddenCols(h); renderDocs();
    };
  });
}

function cellValue(d, key) {
  if (key === "id") return d.time || "";
  if (key === "file") return d.file || "无附件";
  return d[key] == null ? "" : d[key];
}
function renderCell(d, key) {
  var col = DOC_COLS.filter(function(c){ return c.key === key; })[0] || {};
  var cls = [];
  if (col.frozen === "l1") cls.push("sticky-l1");
  if (col.num) cls.push("num-col");
  var clsAttr = cls.length ? ' class="' + cls.join(" ") + '"' : "";
  if (col.tag === "status") {
    var tag = STATUS_TAG[d.status] || "orange";
    return '<td' + clsAttr + '><span class="tag ' + tag + '">' + esc(d.status) + "</span></td>";
  }
  return "<td" + clsAttr + ">" + esc(cellValue(d, key)) + "</td>";
}

function renderHead() {
  var cols = visibleCols();
  var thHtml = cols.map(function(c){
    var sticky = c.frozen === "l1" ? " sticky-l1" : "";
    if (!c.sortable) return "<th class='" + sticky.trim() + "'>" + esc(c.label) + "</th>";
    var ind = docsFilter.sortKey === c.key ? '<span class="sort-ind">' + (docsFilter.sortDir === "asc" ? "▲" : "▼") + "</span>" : "";
    return '<th class="sortable' + sticky + '" data-key="' + c.key + '">' + esc(c.label) + ind + "</th>";
  }).join("");
  var headCb = '<th class="sticky-l0"><input type="checkbox" class="cb" id="cbAll" aria-label="全选本页"></th>';
  document.getElementById("docsHead").innerHTML = "<tr>" + headCb + thHtml + "</tr>";
  document.querySelectorAll("#docsHead th.sortable").forEach(function(th){
    th.onclick = function(){
      var key = th.dataset.key;
      if (docsFilter.sortKey === key) {
        docsFilter.sortDir = docsFilter.sortDir === "asc" ? "desc" : "asc";
      } else {
        docsFilter.sortKey = key;
        docsFilter.sortDir = (key === "id") ? "desc" : "asc";
      }
      renderDocs();
    };
  });
}

function renderChips() {
  var chips = [];
  if (docsFilter.q) chips.push({label:"关键词", value:docsFilter.q, clear:function(){ docsFilter.q = ""; var i = document.getElementById("fQ"); if (i) i.value = ""; }});
  if (docsFilter.cat !== "全部") chips.push({label:"类别", value:docsFilter.cat, clear:function(){ docsFilter.cat = "全部"; }});
  if (docsFilter.status !== "全部") chips.push({label:"状态", value:docsFilter.status, clear:function(){ docsFilter.status = "全部"; }});
  var box = document.getElementById("docChips");
  if (!chips.length) { box.innerHTML = ""; return; }
  box.innerHTML = chips.map(function(c, i){
    return '<span class="chip">' + esc(c.label) + "：<b>" + esc(c.value) + "</b>" +
      '<button data-i="' + i + '" aria-label="移除该条件">×</button></span>';
  }).join("") + '<button class="chip-clear" id="chipClear">清除全部筛选</button>';
  box.querySelectorAll(".chip button").forEach(function(b){
    b.onclick = function(){ chips[Number(b.dataset.i)].clear(); docsFilter.page = 1; syncFilterControls(); renderDocs(); };
  });
  document.getElementById("chipClear").onclick = function(){
    docsFilter.q = ""; docsFilter.cat = "全部"; docsFilter.status = "全部"; docsFilter.page = 1;
    syncFilterControls(); renderDocs();
  };
}

function syncFilterControls() {
  var q = document.getElementById("fQ"); if (q) q.value = docsFilter.q;
  var c = document.getElementById("fCat"); if (c) c.value = docsFilter.cat;
  var s = document.getElementById("fStatus"); if (s) s.value = docsFilter.status;
}

function renderDocs() {
  renderHead();
  renderChips();
  syncFilterControls();
  var rows = filteredDocs();
  var isAdmin = state.role === "admin";

  var total = rows.length;
  var mc = document.getElementById("matchCount");
  if (mc) mc.textContent = "匹配 " + total + " 条";
  var pages = Math.max(1, Math.ceil(total / docsFilter.pageSize));
  if (docsFilter.page > pages) docsFilter.page = pages;
  var start = (docsFilter.page - 1) * docsFilter.pageSize;
  var pageRows = rows.slice(start, start + docsFilter.pageSize);
  var rangeStart = total ? start + 1 : 0;
  var rangeEnd = Math.min(total, start + docsFilter.pageSize);

  var wrap = document.getElementById("docsWrap");
  wrap.className = "table-wrap density-" + docsFilter.density;

  var visCols = visibleCols();
  var trs = pageRows.map(function(d){
    var sel = d.id === state.selectedId ? " sel" : "";
    var cb = '<td class="sticky-l0"><input type="checkbox" class="cb" data-id="' + d.id + '"' +
      (state.selected[d.id] ? " checked" : "") + " aria-label=\"选择该材料\"></td>";
    var tds = visCols.map(function(c){ return renderCell(d, c.key); }).join("");
    return "<tr class='clickable" + sel + "' data-id='" + d.id + "'>" + cb + tds + "</tr>";
  }).join("");

  var bodyEl = document.getElementById("docsBody");
  if (!total) {
    var headEmpty = store.docs.length === 0;
    bodyEl.innerHTML = '<tr><td colspan="' + (1 + visCols.length) + '" class="empty">' +
      (headEmpty
        ? '<div class="empty-title">还没有材料</div><div class="empty-sub">点击下方「提交材料」录入第一条</div>'
        : '<div class="empty-title">没有符合条件的材料</div><div class="empty-sub">试试放宽搜索或清除筛选条件</div>') +
      "</td></tr>";
  } else {
    bodyEl.innerHTML = trs;
  }

  document.querySelectorAll("#docsBody tr.clickable").forEach(function(tr){
    tr.onclick = function(){ state.selectedId = Number(tr.dataset.id); renderDocs(); };
    tr.ondblclick = function(){ openDoc(state.selectedId); };
  });

  /* 行复选框 + 表头全选三态 */
  document.querySelectorAll("#docsBody .cb").forEach(function(cb){
    cb.onchange = function(e){
      e.stopPropagation();
      var id = Number(cb.dataset.id);
      if (cb.checked) state.selected[id] = true; else delete state.selected[id];
      renderDocs();
    };
  });
  var cbAll = document.getElementById("cbAll");
  var pageIds = pageRows.map(function(d){ return d.id; });
  var checkedOnPage = pageIds.filter(function(id){ return state.selected[id]; });
  cbAll.checked = pageIds.length > 0 && checkedOnPage.length === pageIds.length;
  cbAll.indeterminate = checkedOnPage.length > 0 && checkedOnPage.length < pageIds.length;
  cbAll.onchange = function(){
    pageIds.forEach(function(id){
      if (cbAll.checked) state.selected[id] = true; else delete state.selected[id];
    });
    renderDocs();
  };

  /* 分页条 */
  var pager = document.getElementById("docPager");
  pager.innerHTML =
    '<span class="pg-info">第 ' + rangeStart + "–" + rangeEnd + " 条，共 " + total + " 条</span>" +
    '<span class="spacer"></span>' +
    '<button class="btn mini" id="pgPrev" ' + (docsFilter.page <= 1 ? "disabled" : "") + ">上一页</button>" +
    '<span class="pg-info">' + docsFilter.page + " / " + pages + " 页</span>" +
    '<button class="btn mini" id="pgNext" ' + (docsFilter.page >= pages ? "disabled" : "") + ">下一页</button>";
  document.getElementById("pgPrev").onclick = function(){ if (docsFilter.page > 1) { docsFilter.page -= 1; renderDocs(); } };
  document.getElementById("pgNext").onclick = function(){ if (docsFilter.page < pages) { docsFilter.page += 1; renderDocs(); } };

  /* 操作条 */
  var actions = '<button class="btn" id="btnView">查看详情</button>' +
    '<button class="btn" id="btnCsv">导出 CSV</button>' +
    '<button class="btn" id="btnCsvImport">导入 CSV</button>' +
    (isAdmin ? '<button class="btn primary" id="btnArchive">归档</button>' +
               '<button class="btn danger" id="btnReject">驳回</button>' : "") +
    '<span class="hint">已选 ' + (state.selectedId != null && findDoc(state.selectedId) ? "1 条" : "0 条") + "</span>";
  document.getElementById("docsActions").innerHTML = actions;

  var has = state.selectedId != null && findDoc(state.selectedId);
  document.getElementById("btnView").disabled = !has;
  document.getElementById("btnCsv").onclick = exportCsv;
  document.getElementById("btnCsvImport").onclick = function(){ document.getElementById("csvImportFile").click(); };
  document.getElementById("csvImportFile").onchange = importCsv;
  var btnA = document.getElementById("btnArchive"), btnR = document.getElementById("btnReject");
  if (btnA) btnA.disabled = !has;
  if (btnR) btnR.disabled = !has;
  document.getElementById("btnView").onclick = function(){ openDoc(state.selectedId); };
  if (btnA) btnA.onclick = archiveSelected;
  if (btnR) btnR.onclick = rejectSelected;

  /* 批量操作栏 */
  var selIds = Object.keys(state.selected).map(Number).filter(function(id){ return findDoc(id); });
  var bulk = document.getElementById("bulkBar");
  if (selIds.length) {
    bulk.classList.add("show");
    bulk.innerHTML = '<span class="bulk-count">已选 ' + selIds.length + " 条</span>" +
      (isAdmin ? '<button class="btn primary mini" id="bulkArchive">批量归档</button>' +
                 '<button class="btn danger mini" id="bulkReject">批量驳回</button>' : "") +
      '<span class="spacer"></span><button class="btn mini" id="bulkClear">清除选择</button>';
    document.getElementById("bulkClear").onclick = function(){ state.selected = {}; renderDocs(); };
    var bA = document.getElementById("bulkArchive"), bR = document.getElementById("bulkReject");
    if (bA) bA.onclick = function(){ bulkDoc("archive"); };
    if (bR) bR.onclick = function(){ bulkDoc("reject"); };
  } else {
    bulk.classList.remove("show"); bulk.innerHTML = "";
  }
  savePrefs();
}

function bulkDoc(action) {
  var ids = Object.keys(state.selected).map(Number).filter(function(id){ return findDoc(id); });
  if (!ids.length) { toast("请先选择要处理的材料"); return; }
  var label = action === "archive" ? "归档" : "驳回";
  confirmModal(label + "确认", "确定将选中的 " + ids.length + " 条材料" + label + "吗？执行后写入操作日志。", function(){
    var ok = 0, fail = 0;
    ids.forEach(function(id){
      var d = findDoc(id);
      if (!d) { fail++; return; }
      if (action === "archive") archiveDoc(id); else rejectDoc(id);
      try { addLog(label, d.name, state.operatorName, roleLabel()); } catch(e){}
      ok++;
    });
    state.selected = {};
    refreshAll();
    toast("已" + label + " " + ok + " 条" + (fail ? "，" + fail + " 条未处理" : ""));
  });
}

/* ============ 详情抽屉 ============ */
function openDoc(id, from) {
  var d = findDoc(id);
  if (!d) { toast("请先在列表中选择一条材料"); return; }
  state.selectedId = id; state.drawerId = id;
  try { addLog("查看", d.name, state.operatorName, roleLabel()); } catch (e) {}
  renderDrawer(d);
  document.getElementById("drawer").classList.add("show");
  document.getElementById("drawerMask").classList.add("show");
  if (state.current !== "docs") renderDocs();
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("drawerMask").classList.remove("show");
  state.drawerId = null;
}

function renderDrawer(d) {
  var tag = STATUS_TAG[d.status] || "orange";
  document.getElementById("drawerTitle").textContent = d.name;
  document.getElementById("drawerTag").innerHTML = '<span class="tag ' + tag + '">' + esc(d.status) + "</span>";

  var trace = listLogs().filter(function(l){ return l.obj === d.name; }).slice(0, 8);
  var traceHtml = trace.length ? '<div class="trace"><h4>操作留痕</h4><ul>' +
    trace.map(function(l){ return "<li><span class='t-time'>" + esc(l.time) + "</span>" +
      esc(l.who) + "（" + esc(l.role) + "）· " + esc(l.act) + "</li>"; }).join("") +
    "</ul></div>" : '<div class="empty" style="padding:14px 0">暂无该材料的操作记录</div>';

  document.getElementById("drawerBody").innerHTML =
    '<div class="drawer-section"><h4>基本信息</h4><div class="kv">' +
      '<span class="k">类别</span><span class="v">' + esc(d.cat) + "</span>" +
      '<span class="k">提交人</span><span class="v">' + esc(d.who) + "（" + esc(d.sid) + "）</span>" +
      '<span class="k">提交时间</span><span class="v">' + esc(d.time) + "</span>" +
      '<span class="k">可见范围</span><span class="v">' + esc(d.scope || "全员") + "</span>" +
      '<span class="k">附件</span><span class="v">' + esc(d.file || "无附件") + "</span>" +
      '<span class="k">说明</span><span class="v">' + esc(d.note || "无") + "</span>" +
      (d.reason ? '<span class="k">审核备注</span><span class="v">' + esc(d.reason) + "</span>" : "") +
    "</div></div>" +
    '<div class="drawer-section"><h4>留痕记录</h4>' + traceHtml + "</div>";

  var isAdmin = state.role === "admin";
  var footer = "";
  if (isAdmin) {
    if (d.status !== "已归档") footer += '<button class="btn primary" id="drArchive">归档</button>';
    if (d.status !== "已驳回") footer += '<button class="btn danger" id="drReject">驳回</button>';
  }
  footer += '<span class="spacer"></span><button class="btn" id="drClose">关闭</button>';
  document.getElementById("drawerFooter").innerHTML = footer;
  document.getElementById("drClose").onclick = closeDrawer;
  var drA = document.getElementById("drArchive"), drR = document.getElementById("drReject");
  if (drA) drA.onclick = archiveSelected;
  if (drR) drR.onclick = rejectSelected;
}

/* 通用动作管线：按类型配置校验角色、状态、确认文案，改状态并写留痕 */
function runAction(typeKey, id, actionKey) {
  var def = typeDef(typeKey);
  var act = def.actions.filter(function(a){ return a.key === actionKey; })[0];
  var d = findDoc(id);
  if (!act) { toast("未知操作"); return; }
  if (!d) { toast("请先选择一条" + def.label); return; }
  if (state.role !== act.role) { toast("当前视角无权执行该操作"); return; }
  if (d.status === act.to) { toast("该" + def.label + "已是" + act.to + "状态"); return; }
  showModal(act.label + "确认",
    "<div>" + act.confirm(d) + "</div>" +
    '<div class="field" style="margin-top:12px"><label>备注 / 原因（可选）</label>' +
    '<textarea id="actReason" rows="3" placeholder="驳回可写明缺什么材料；归档可补充说明"></textarea></div>',
    [
      {label:"取消", cls:"btn"},
      {label:act.label, cls:act.cls || "primary", onClick:function(){
        d.status = act.to;
        d.reason = clean(document.getElementById("actReason").value);
        saveStore();
        try { addLog(act.label, d.name, state.operatorName, roleLabel()); } catch(e){}
        refreshAll();
        if (state.drawerId != null && findDoc(state.drawerId)) renderDrawer(findDoc(state.drawerId));
        toast("已" + act.label + "，并写入操作日志");
      }}
    ]);
}
function archiveSelected() {
  runAction("doc", state.selectedId != null ? state.selectedId : state.drawerId, "archive");
}
function rejectSelected() {
  runAction("doc", state.selectedId != null ? state.selectedId : state.drawerId, "reject");
}

/* ============ 提交材料 ============ */
var submitFile = "";
var DRAFT_KEY = "classconsole_web_draft";
function loadDraft(){ try { return JSON.parse(localStorage.getItem(DRAFT_KEY)) || {}; } catch(e){ return {}; } }
function saveDraft(){
  var d = {
    name: document.getElementById("sName").value,
    who: document.getElementById("sWho").value,
    sid: document.getElementById("sSid").value,
    cat: document.getElementById("sCat").value,
    note: document.getElementById("sNote").value,
    file: submitFile
  };
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch(e){}
}
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(e){} }

/* 学号匹配名单：空姓名自动带出；已填姓名与名单不符时就近警告（不拦截提交） */
function linkRoster() {
  var sid = clean(document.getElementById("sSid").value);
  var whoEl = document.getElementById("sWho");
  var warn = document.getElementById("sWhoWarn");
  if (!whoEl || !warn) return;
  var ro = findRosterBySid(sid);
  if (ro) {
    if (!whoEl.value.trim()) { whoEl.value = ro.who; saveDraft(); }
    var mismatch = whoEl.value.trim() && whoEl.value.trim() !== ro.who;
    warn.textContent = mismatch ? "学号 " + sid + " 对应名单姓名为「" + ro.who + "」，与当前填写不一致" : "";
  } else {
    warn.textContent = "";
  }
}

function buildSubmit() {
  var catOptions = CATS.map(function(c){ return "<option>" + esc(c) + "</option>"; }).join("");
  document.getElementById("view-submit").innerHTML =
    '<div class="card form-card">' +
      "<h3>提交班级材料</h3>" +
      '<p class="sub">带 * 为必填项，提交后进入待审核列表并生成操作记录</p>' +
      '<div class="field"><label>材料名称 <span class="req">*</span></label><input id="sName" type="text" autocomplete="off"><div class="ferr" id="eName"></div></div>' +
      '<div class="field"><label>姓名 <span class="req">*</span></label><input id="sWho" type="text" autocomplete="off"><div class="ferr" id="eWho"></div><div class="hint" id="sWhoWarn" style="color:var(--orange);min-height:16px"></div></div>' +
      '<div class="field"><label>学号 <span class="req">*</span></label><input id="sSid" type="text" inputmode="numeric" autocomplete="off"><div class="ferr" id="eSid"></div></div>' +
      '<div class="field"><label>材料类别 <span class="req">*</span></label><select id="sCat"><option value="">请选择类别</option>' + catOptions + "</select><div class=\"ferr\" id=\"eCat\"></div></div>" +
      '<div class="field"><label>材料说明</label><textarea id="sNote"></textarea></div>' +
      '<div class="field"><label>附件</label><div class="file-line">' +
        '<input type="file" id="sFile" style="display:none">' +
        '<button class="btn" id="btnPick">选择文件</button>' +
        '<span class="fname" id="fileName">未选择文件</span>' +
        '<button class="btn" id="btnRemoveFile" style="display:none">移除</button></div></div>' +
      '<div class="err" id="sErr"></div>' +
      '<div class="form-actions"><button class="btn" id="btnClear">清空</button>' +
      '<button class="btn primary" id="btnSubmit">提交材料</button></div>' +
    "</div>";

  var $ = function(id){ return document.getElementById(id); };

function setFieldErr(id, msg){ var el = document.getElementById(id); if (el) el.textContent = msg || ""; }
function cap(s){ return String(s).charAt(0).toUpperCase() + String(s).slice(1); }
function errId(key){ return "e" + cap(key); }

/* 按类型 schema 跑必填与格式校验，返回 {字段key: 报错文案} */
function validateRecord(typeKey, values) {
  var def = typeDef(typeKey), errs = {};
  def.fields.forEach(function(f){
    var v = clean(values[f.key]);
    if (f.required && !v) { errs[f.key] = (f.type === "select" ? "请选择" : "请填写") + f.label; return; }
    if (f.type === "sid" && v) {
      if (!/^\d+$/.test(v)) errs[f.key] = "学号需为纯数字";
      else if (!(v.length >= 4 && v.length <= 12)) errs[f.key] = "学号长度应为 4-12 位";
    }
  });
  return errs;
}

function submitDoc() {
  var name = clean(document.getElementById("sName").value);
  var who = clean(document.getElementById("sWho").value);
  var sid = clean(document.getElementById("sSid").value);
  var cat = clean(document.getElementById("sCat").value);
  var note = clean(document.getElementById("sNote").value);

  var errs = validateRecord("doc", {name:name, who:who, sid:sid, cat:cat, note:note});
  typeDef("doc").fields.forEach(function(f){
    if (f.type === "file") return;
    setFieldErr(errId(f.key), errs[f.key]);
  });
  var errEl = document.getElementById("sErr");
  if (Object.keys(errs).length) { errEl.textContent = ""; return; }

  var dup = store.docs.some(function(d){ return d.sid === sid && d.name === name && d.cat === cat; });
  var doAdd = function(){
    var row;
    try {
      row = addDoc({name:name, cat:cat, who:who, sid:sid, note:note, file:submitFile, scope:"全员"});
      addLog("提交", name, state.operatorName, roleLabel());
    } catch (e) { errEl.textContent = "提交失败：" + e.message; return; }
    ["sName","sWho","sSid","sNote"].forEach(function(id){ document.getElementById(id).value = ""; });
    document.getElementById("sCat").value = "";
    typeDef("doc").fields.forEach(function(f){ if (f.type !== "file") setFieldErr(errId(f.key), ""); });
    clearDraft();
    document.getElementById("btnRemoveFile").click();
    errEl.textContent = "";
    docsFilter.status = "待审核"; docsFilter.page = 1;
    state.selectedId = row.id;
    syncFilterControls();
    switchView("docs");
    toast("材料已提交，进入待审核列表");
  };
  if (dup) confirmModal("重复提交确认", "学号 " + sid + " 已提交过「" + name + "」，是否仍要再次提交？", doAdd);
  else doAdd();
}

function parseRosterText(text) {
  var rows = [];
  String(text).split(/\r?\n/).forEach(function(line){
    line = line.trim(); if (!line) return;
    var parts = line.split(/[,，\t]/).map(function(x){ return x.trim(); }).filter(Boolean);
    if (parts.length >= 2) rows.push({ sid: parts[0], who: parts[1] });
  });
  return rows;
}
function copyText(text, msg) {
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = text;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, function(){ fallback(); toast(msg); });
  } else { fallback(); toast(msg); }
}

/* CSV 解析：支持引号包裹、引号内逗号与换行、双引号转义 */
function parseCsv(text) {
  var rows = [], row = [], cell = "", inQ = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i+1] === '"') { cell += '"'; i++; }
        else inQ = false;
      } else cell += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cell); cell = ""; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== '\r') cell += c;
    }
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return clean(x); }); });
}

var CSV_HEAD = { name:"材料名称", cat:"类别", who:"提交人", sid:"学号", note:"说明", file:"附件" };
function mapCsvHeader(header) {
  var idx = {};
  Object.keys(CSV_HEAD).forEach(function(key){
    var pos = header.indexOf(CSV_HEAD[key]);
    if (pos >= 0) idx[key] = pos;
  });
  return idx;
}

function importCsv(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var rows = parseCsv(reader.result);
    if (!rows.length) { toast("CSV 未解析到有效内容"); return; }
    var header = rows[0].map(function(x){ return clean(x); });
    var hasHead = header.some(function(h){ return CSV_HEAD.name === h || CSV_HEAD.who === h || CSV_HEAD.sid === h; });
    var idx = hasHead ? mapCsvHeader(header) : { name:0, cat:1, who:2, sid:3, note:4, file:5 };
    var body = hasHead ? rows.slice(1) : rows;
    var added = 0, skipped = 0, dup = 0;
    body.forEach(function(r){
      var vals = {
        name: clean(r[idx.name]), cat: clean(r[idx.cat]), who: clean(r[idx.who]),
        sid: clean(r[idx.sid]), note: clean(r[idx.note]), file: clean(r[idx.file])
      };
      if (Object.keys(validateRecord("doc", vals)).length) { skipped++; return; }
      var exists = store.docs.some(function(d){ return d.sid === vals.sid && d.name === vals.name && d.cat === vals.cat; });
      if (exists) { dup++; return; }
      try { addDoc(vals); added++; } catch(err){ skipped++; }
    });
    state.selected = {}; state.selectedId = null;
    refreshAll();
    try { addLog("导入", "CSV 材料 " + added + " 条", state.operatorName, roleLabel()); } catch(err){}
    toast("导入完成：新增 " + added + " 条" + (dup ? "，重复 " + dup : "") + (skipped ? "，跳过 " + skipped : ""));
  };
  reader.readAsText(file, "utf-8");
  e.target.value = "";
}

function importBackup(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); }
    catch (err) { toast("导入失败：不是有效的 JSON 文件"); return; }
    if (!data || typeof data !== "object" || !Array.isArray(data.docs) || !Array.isArray(data.logs)) {
      toast("导入失败：备份结构不正确，docs / logs 应为列表"); return;
    }
    confirmModal("导入确认", "导入将覆盖本浏览器当前全部材料与操作日志，且不可撤销。确定继续导入吗？", function(){
      try { restore(data.docs, data.logs, data.roster, data.tasks); }
      catch (err) { toast("导入失败：" + err.message); return; }
      state.selected = {}; state.selectedId = null;
      closeDrawer();
      refreshAll(); toast("备份数据已导入");
    });
  };
  reader.readAsText(file, "utf-8");
  e.target.value = "";
}

/* ============ 初始化 ============ */
function bindRole() {
  var radios = document.querySelectorAll('input[name="role"]');
  function syncLabel() {
    document.getElementById("roleAdmin").classList.toggle("on", state.role === "admin");
    document.getElementById("roleStudent").classList.toggle("on", state.role === "student");
    radios.forEach(function(r){ r.checked = (r.value === state.role); });
  }
  radios.forEach(function(r){
    r.onchange = function(){ state.role = r.value; syncLabel(); closeDrawer(); refreshAll(); };
  });
  syncLabel();
}

document.getElementById("drawerClose").onclick = closeDrawer;
document.getElementById("drawerMask").onclick = closeDrawer;
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && document.getElementById("drawer").classList.contains("show")) closeDrawer();
});

/* 台账键盘导航：上下移动选中行，回车打开详情；输入控件内不拦截 */
document.addEventListener("keydown", function(e){
  if (state.current !== "docs") return;
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  var rows = filteredDocs();
  if (!rows.length) return;
  var idx = rows.findIndex(function(d){ return d.id === state.selectedId; });
  var ni = null;
  if (e.key === "ArrowDown") ni = idx < 0 ? 0 : Math.min(rows.length - 1, idx + 1);
  else if (e.key === "ArrowUp") ni = idx <= 0 ? 0 : idx - 1;
  else if (e.key === "Enter") { if (idx >= 0) { e.preventDefault(); openDoc(state.selectedId); } return; }
  else return;
  e.preventDefault();
  state.selectedId = rows[ni].id;
  docsFilter.page = Math.floor(ni / docsFilter.pageSize) + 1;
  renderDocs();
});

loadStore();
applyPrefs();
buildNav();
buildDocs();
buildSubmit();
bindRole();
switchView("dashboard");
</script>
