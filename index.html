<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>班级操作台 · 师生服务台</title>
  <meta name="description" content="班级操作台师生服务台：学生提交材料，班委收材料、审核归档、催交跟进，教师看进度、收证据包。点一项服务直接进入办理，数据留在本机。">
  <style>
    :root{
      --bg:#F3F6F4;
      --surface:#FFFFFF;
      --ink:#17231F;
      --muted:#66756F;
      --faint:#8A9791;
      --line:#E0E7E2;
      --line-strong:#CBD7CF;
      --primary:#176B63;
      --primary-deep:#11564F;
      --primary-soft:#E8F2EE;
      --amber:#A96325;
      --amber-soft:#FBF0E3;
      --green:#287A55;
      --green-soft:#E8F4ED;
      --blue:#2F5F86;
      --blue-soft:#E9F0F6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
      background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
      -webkit-font-smoothing:antialiased;min-height:100vh;
    }
    a{color:inherit;text-decoration:none}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:7px;
      min-height:38px;padding:8px 15px;border-radius:8px;border:1px solid transparent;
      font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;
      transition:background .15s,border-color .15s,color .15s;
    }
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-deep)}
    .btn-ghost{background:#fff;color:var(--primary);border-color:var(--line-strong)}
    .btn-ghost:hover{background:var(--primary-soft)}

    /* 顶栏：工作台外壳，不做营销区 */
    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);
      border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
    .topbar-inner{max-width:1200px;margin:0 auto;padding:12px 24px;
      display:flex;align-items:center;gap:18px}
    .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);
      display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
    .brand-name{font-size:15px;font-weight:800;letter-spacing:.01em;line-height:1.2}
    .brand-sub{font-size:11px;color:var(--faint);letter-spacing:.04em}
    .top-state{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
      padding-left:18px;border-left:1px solid var(--line)}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
    .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

    /* 一张服务台：左侧分类，右侧一个连续工作面 */
    .layout{max-width:1200px;margin:0 auto;padding:20px 24px 32px;
      display:grid;grid-template-columns:216px minmax(0,1fr);gap:18px;align-items:start}
    .rail{position:sticky;top:80px;background:var(--surface);border:1px solid var(--line);
      border-radius:12px;padding:15px 11px;display:flex;flex-direction:column;gap:12px}
    .rail-head{font-size:10.5px;font-weight:800;letter-spacing:.13em;color:var(--faint);
      padding:0 8px;text-transform:uppercase}
    .rail-nav{display:flex;flex-direction:column;gap:3px}
    .rail-nav button{width:100%;display:flex;align-items:center;justify-content:space-between;
      gap:8px;padding:9px 9px;border:0;border-radius:7px;background:transparent;
      color:var(--muted);font:inherit;font-size:13px;text-align:left;cursor:pointer}
    .rail-nav button:hover{background:#F5F8F6;color:var(--primary)}
    .rail-nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
    .rail-nav button span.count{font-size:10.5px;color:var(--faint);font-weight:700}
    .rail-nav button.on span.count{color:var(--primary)}
    .rail-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 2px;
      font-size:11.5px;color:var(--muted);line-height:1.55}
    .rail-foot b{display:block;color:var(--ink);font-size:12px;margin-bottom:3px}

    .desk{min-width:0;background:var(--surface);border:1px solid var(--line);
      border-radius:12px;padding:22px 24px 14px}
    .desk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--primary);
      text-transform:uppercase;display:block;margin-bottom:4px}
    .desk-head h1{font-size:28px;line-height:1.18;letter-spacing:-.02em}
    .desk-head p{color:var(--muted);font-size:13px;margin-top:5px}
    .mode{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
      font-size:11.5px;color:var(--green);background:var(--green-soft);
      border:1px solid #CEE6D8;border-radius:999px;padding:5px 9px;font-weight:700}
    .mode i{width:6px;height:6px;border-radius:50%;background:var(--green)}

    .search{display:flex;align-items:center;gap:9px;margin-top:16px;
      border:1px solid var(--line-strong);border-radius:9px;padding:0 12px;
      background:#FBFCFB;transition:border-color .15s,box-shadow .15s}
    .search:focus-within{border-color:#9DC3B6;box-shadow:0 0 0 3px rgba(23,107,99,.08)}
    .search svg{flex-shrink:0;color:var(--faint)}
    .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;
      font:inherit;font-size:13.5px;color:var(--ink);padding:11px 0}
    .search input::placeholder{color:var(--faint)}
    .search kbd{font-family:inherit;font-size:10.5px;color:var(--faint);
      border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}

    .list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
      margin:15px 2px 9px;font-size:11.5px;color:var(--faint)}
    .list-head b{color:var(--muted);font-weight:700}

    .service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .service{display:grid;grid-template-columns:36px minmax(0,1fr);gap:11px;
      align-items:start;padding:13px 14px 12px;border:1px solid var(--line);
      border-radius:9px;background:#fff;transition:border-color .15s,background .15s,transform .15s}
    .service:hover{border-color:#AFCFC2;background:#FBFDFC;transform:translateY(-1px)}
    .service:active{transform:none}
    .ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
      justify-content:center;font-size:13px;font-weight:800;letter-spacing:-.02em;flex-shrink:0}
    .tone-1{background:var(--primary-soft);color:var(--primary)}
    .tone-2{background:var(--amber-soft);color:var(--amber)}
    .tone-3{background:var(--blue-soft);color:var(--blue)}
    .tone-4{background:var(--green-soft);color:var(--green)}
    .svc-main{min-width:0}
    .svc-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .svc-title h3{font-size:14px;line-height:1.25;letter-spacing:-.01em}
    .role{font-size:10px;font-weight:700;color:var(--muted);background:#F4F7F5;
      border:1px solid var(--line);border-radius:999px;padding:1px 6px}
    .svc-main p{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:3px}
    .svc-foot{display:flex;align-items:center;gap:7px;margin-top:7px}
    .tag{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;white-space:nowrap}
    .tag-free{color:var(--green);background:var(--green-soft);border:1px solid #CEE6D8}
    .tag-web{color:var(--primary);background:var(--primary-soft);border:1px solid #CDE3DB}
    .tag-desk{color:var(--amber);background:var(--amber-soft);border:1px solid #EEDCC4}
    .go{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--primary);
      white-space:nowrap}
    .go::after{content:" →";font-weight:400}

    .empty{display:none;padding:34px 12px;text-align:center;color:var(--muted);font-size:13px}
    .empty.show{display:block}
    .empty button{margin-left:6px;border:0;background:none;color:var(--primary);
      font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}

    .desk-foot{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;
      border-top:1px solid var(--line);margin-top:14px;padding:11px 2px 0;
      font-size:11px;color:var(--faint)}
    .desk-foot span{display:inline-flex;align-items:center;gap:5px}
    .desk-foot span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--green)}
    .desk-foot .links{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
    .desk-foot .links a{color:var(--muted);font-weight:700}
    .desk-foot .links a:hover{color:var(--primary)}

    @media (max-width:1040px){
      .layout{grid-template-columns:198px minmax(0,1fr);gap:14px;padding:16px}
      .desk{padding:20px 18px 12px}
    }
    @media (max-width:820px){
      .layout{display:block;padding:10px 12px 24px}
      .rail{position:static;margin-bottom:10px;padding:9px 9px 10px}
      .rail-head,.rail-foot{display:none}
      .rail-nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
      .rail-nav::-webkit-scrollbar{display:none}
      .rail-nav button{flex:0 0 auto;width:auto;padding:7px 8px;font-size:12px}
      .rail-nav button span.count{display:none}
      .desk{padding:17px 15px 12px;border-radius:10px}
      .desk-head h1{font-size:24px}
      .mode{display:none}
      .search{margin-top:13px}
      .service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:620px){
      .service-grid{grid-template-columns:1fr}
    }
    @media (max-width:520px){
      .topbar-inner{padding:10px 14px;gap:10px}
      .brand-sub,.top-state{display:none}
      .top-actions .btn{min-height:34px;padding:7px 10px;font-size:12px}
      .desk-head{display:block}
      .desk-head h1{font-size:22px}
      .desk-head p{font-size:12px}
      .service{padding:12px}
      .desk-foot .links{margin-left:0;width:100%}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="班级操作台服务台">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H11v16H6.5A1.5 1.5 0 0 1 5 18.5z"/>
            <path d="M19 5.5A1.5 1.5 0 0 0 17.5 4H13v16h4.5A1.5 1.5 0 0 0 19 18.5z"/>
          </svg>
        </span>
        <span>
          <span class="brand-name">班级操作台</span><br>
          <span class="brand-sub">师生服务台</span>
        </span>
      </a>
      <div class="top-state"><span class="live-dot"></span>本地模式 · 无需注册</div>
      <div class="top-actions">
        <a class="btn btn-ghost" href="https://github.com/MedianiGray/class-console/releases/tag/v0.36.0" target="_blank" rel="noopener">下载桌面版</a>
        <a class="btn btn-primary" href="web/index.html">打开网页版</a>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="rail" aria-label="服务分类">
      <div class="rail-head">服务分类</div>
      <nav class="rail-nav" id="catNav"></nav>
      <div class="rail-foot">
        <b>数据留在本机</b>
        <p>桌面用 SQLite，网页用浏览器缓存；不上传云端，换机用备份或交接包。</p>
      </div>
    </aside>

    <main class="desk">
      <div class="desk-head">
        <div>
          <span class="eyebrow">服务台</span>
          <h1>要办哪件事？</h1>
          <p>点一项直接进入办理，不用先读说明。学生不装 exe，班委和教师用桌面版。</p>
        </div>
        <span class="mode"><i></i>现在可用</span>
      </div>

      <form class="search" id="searchForm" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
        </svg>
        <input id="q" type="search" placeholder="搜服务：提交、台账、催交、证据包…" autocomplete="off" aria-label="搜索服务">
        <kbd>/</kbd>
      </form>

      <div class="list-head">
        <span><b id="resultCount">12</b> 项服务</span>
        <span>学生免安装 · 桌面端离线可用</span>
      </div>

      <div class="service-grid" id="serviceGrid"></div>
      <div class="empty" id="empty">没有匹配的服务。<button type="button" id="clearBtn">清空筛选</button></div>

      <div class="desk-foot">
        <span>数据留在本机</span>
        <span>AI 只给建议</span>
        <span>不公开点名</span>
        <span>不做账号 / 云端 / 自动群发</span>
        <div class="links">
          <a href="https://github.com/MedianiGray/class-console/blob/main/docs/办公工作台总图-v2.0.md" target="_blank" rel="noopener">版本总图</a>
          <a href="https://github.com/MedianiGray/class-console/blob/main/docs/安装与首启说明.md" target="_blank" rel="noopener">安装说明</a>
          <a href="https://github.com/MedianiGray/class-console" target="_blank" rel="noopener">源码</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    var CATS = [
      {key:"all",    label:"全部服务", note:"所有入口"},
      {key:"intake", label:"收材料",   note:"提交 · 收集"},
      {key:"review", label:"审归档",   note:"台账 · 模板"},
      {key:"follow", label:"跟进催交", note:"名单 · 任务 · 留痕"},
      {key:"report", label:"交差上报", note:"看板 · 证据包"},
      {key:"tool",   label:"工具与桌面", note:"批量 · 离线"}
    ];

    var RELEASE = "https://github.com/MedianiGray/class-console/releases/tag/v0.36.0";
    var SERVICES = [
      {id:"submit", cat:"intake", role:"学生", title:"提交材料", ico:"交", tone:1,
       desc:"表单提交，提交后能看到待审核、已归档或被驳回。", tag:"免安装", tagCls:"tag-free",
       href:"web/index.html?view=submit", go:"打开提交"},
      {id:"docs", cat:"review", role:"班委", title:"材料台账", ico:"台", tone:1,
       desc:"筛选、编号、详情、时间线与审批节点。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=docs", go:"打开台账"},
      {id:"collect", cat:"intake", role:"班委", title:"收一批材料", ico:"收", tone:2,
       desc:"文件夹收集、拖入登记、变化记录，先预览再入账。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=collect", go:"打开收集"},
      {id:"roster", cat:"follow", role:"班委", title:"名单核对", ico:"名", tone:2,
       desc:"完成矩阵、缺项、免交与延期，一眼看清谁还差。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=roster", go:"打开矩阵"},
      {id:"chase", cat:"follow", role:"班委", title:"催交与回执", ico:"催", tone:2,
       desc:"不点名话术、24 小时限频、回执留痕。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=roster", go:"去催交"},
      {id:"tasks", cat:"follow", role:"班委", title:"任务跟踪", ico:"任", tone:3,
       desc:"把催交和待办挂到人，跟进到完成为止。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=tasks", go:"打开任务"},
      {id:"templates", cat:"review", role:"班委", title:"材料模板", ico:"模", tone:3,
       desc:"班会、走访、承诺、约谈的字段与附件位。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=templates", go:"打开模板"},
      {id:"logs", cat:"follow", role:"班委", title:"操作留痕", ico:"痕", tone:3,
       desc:"谁在什么时候改了什么，按动作和对象筛选。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=logs", go:"查看留痕"},
      {id:"dashboard", cat:"report", role:"教师", title:"看全局", ico:"看", tone:4,
       desc:"按岗位看待审、未交、逾期与提醒，不用翻台账。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=dashboard", go:"打开看板"},
      {id:"ai", cat:"follow", role:"教师", title:"AI 助手", ico:"AI", tone:4,
       desc:"不用下载、不用 Key；查未交、待审、缺项，写催交草稿。", tag:"网页可用", tagCls:"tag-web",
       href:"web/index.html?view=ai", go:"打开助手"},
      {id:"filetools", cat:"tool", role:"班委", title:"文件室与批量工具", ico:"件", tone:1,
       desc:"目录树、预览、批量改名、图片转换；桌面端本地处理。", tag:"桌面端", tagCls:"tag-desk",
       href:RELEASE, go:"下载桌面版", external:true},
      {id:"proof", cat:"tool", role:"班委 · 教师", title:"证据包 / 交接包", ico:"包", tone:1,
       desc:"完整性检查、ZIP 导出、届别交接；桌面端生成。", tag:"桌面端", tagCls:"tag-desk",
       href:RELEASE, go:"下载桌面版", external:true}
    ];

    var activeCat = "all";
    var query = "";
    var grid = document.getElementById("serviceGrid");
    var catNav = document.getElementById("catNav");
    var resultCount = document.getElementById("resultCount");
    var emptyBox = document.getElementById("empty");
    var queryInput = document.getElementById("q");

    function countFor(key){
      if (key === "all") return SERVICES.length;
      return SERVICES.filter(function(s){ return s.cat === key; }).length;
    }

    function renderCats(){
      catNav.innerHTML = CATS.map(function(c){
        return '<button type="button" data-cat="' + c.key + '" class="' + (c.key === activeCat ? "on" : "") + '" aria-pressed="' + (c.key === activeCat) + '">'
          + '<span>' + c.label + '</span><span class="count">' + countFor(c.key) + '</span></button>';
      }).join("");
      catNav.querySelectorAll("button").forEach(function(b){
        b.onclick = function(){
          activeCat = b.getAttribute("data-cat");
          query = ""; queryInput.value = "";
          renderCats(); renderList();
        };
      });
    }

    function match(s){
      if (query) {
        var hay = (s.title + " " + s.desc + " " + s.role + " " + s.tag + " " + s.go).toLowerCase();
        return hay.indexOf(query.toLowerCase()) >= 0;
      }
      return activeCat === "all" || s.cat === activeCat;
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
      });
    }

    function hrefFor(s){
      return s.href.indexOf("web/index.html?") === 0 ? s.href + "&desk=1" : s.href;
    }

    function renderList(){
      var rows = SERVICES.filter(match);
      resultCount.textContent = rows.length;
      emptyBox.className = "empty" + (rows.length ? "" : " show");
      grid.innerHTML = rows.map(function(s){
        var ext = s.external ? ' target="_blank" rel="noopener"' : "";
        return '<a class="service" href="' + escapeHtml(hrefFor(s)) + '"' + ext + '>'
          + '<span class="ico tone-' + s.tone + '" aria-hidden="true">' + escapeHtml(s.ico) + '</span>'
          + '<span class="svc-main">'
          +   '<span class="svc-title"><h3>' + escapeHtml(s.title) + '</h3><span class="role">' + escapeHtml(s.role) + '</span></span>'
          +   '<p>' + escapeHtml(s.desc) + '</p>'
          +   '<span class="svc-foot"><span class="tag ' + s.tagCls + '">' + escapeHtml(s.tag) + '</span>'
          +     '<span class="go">' + escapeHtml(s.go) + '</span></span>'
          + '</span></a>';
      }).join("");
    }

    document.getElementById("searchForm").onsubmit = function(e){
      e.preventDefault();
      var first = SERVICES.filter(match)[0];
      if (first) location.href = hrefFor(first);
    };
    queryInput.oninput = function(){ query = queryInput.value.trim(); renderList(); };
    document.getElementById("clearBtn").onclick = function(){
      query = ""; queryInput.value = ""; activeCat = "all"; renderCats(); renderList(); queryInput.focus();
    };
    document.addEventListener("keydown", function(e){
      if (e.key === "/" && document.activeElement !== queryInput) {
        e.preventDefault(); queryInput.focus();
      }
      if (e.key === "Escape") { queryInput.value = ""; query = ""; renderList(); queryInput.blur(); }
    });

    renderCats(); renderList();
  </script>
</body>
</html>
